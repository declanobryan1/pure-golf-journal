      playedExpanded.push({course:c,subName:null,score:r?.overall??0,shotScore:r?.shotScore,playCount:r?.playCount||1,personalBest:r?.personalBest??(r?.shotScore?Number(r.shotScore):null),isHomeCourse:r?.isHomeCourse,isEarly:r?.isEarly||false});
    }
  });
  playedExpanded.sort((a,b)=>(b.score||0)-(a.score||0));
  const played=playedExpanded.filter(e=>{if(!q.trim())return true;const s=norm(q);const name=e.subName||e.course.name;return norm(name).includes(s)||norm(e.course.name).includes(s)||norm(e.course.city).includes(s)||norm(e.course.state).includes(s);});
  const want=filterBySearch(COURSES.filter(c=>statuses[c.id]?.play==="want"));
  const playedCount=playedExpanded.length;
  const wantCount=COURSES.filter(c=>statuses[c.id]?.play==="want").length;
  return(<div>
    <div style={{padding:"10px 16px",display:"flex",gap:6}}>
      {[["played",`Played (${playedCount})`],["want",`Bucket List (${wantCount})`]].map(([k,l])=>(
        <button key={k} className="pressable" onClick={()=>setTab(k)} style={{flex:1,padding:"10px",borderRadius:10,border:"none",cursor:"pointer",fontWeight:600,fontSize:12,
          fontFamily:"var(--font-body)",background:tab===k?"var(--c-green)":"var(--c-card)",color:tab===k?"#fff":"var(--c-sub)",
          transition:"background 200ms var(--ease-out),color 200ms var(--ease-out)"}}>{l}</button>))}</div>
    <div style={{padding:"4px 16px 10px",position:"relative"}}>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder={tab==="played"?"Search played courses...":"Search bucket list..."}
        style={{width:"100%",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:10,padding:"9px 34px 9px 14px",fontSize:12,outline:"none",fontWeight:400,boxSizing:"border-box",fontFamily:"var(--font-body)",transition:"border-color 200ms var(--ease-out)"}} onFocus={e=>e.target.style.borderColor="var(--c-green)"} onBlur={e=>e.target.style.borderColor=""}/>
      {q&&<button className="pressable" onClick={()=>setQ("")} aria-label="Clear" style={{position:"absolute",right:24,top:"50%",transform:"translateY(-50%)",width:20,height:20,borderRadius:"50%",background:"var(--c-surface)",border:"1px solid var(--c-border)",color:"var(--c-sub)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,lineHeight:0}}>
        <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>}
    </div>
    {tab==="played"&&(()=>{
      /* Compute ranks on full list (not filtered) with ties */
      const fullRanks=new Map();let rank=1;
      for(let i=0;i<playedExpanded.length;i++){
        const sc=playedExpanded[i].score||0;
        if(i>0){
          const prevSc=playedExpanded[i-1].score||0;
          if(sc===prevSc){/* tied */}else{rank=i+1;}
        }
        fullRanks.set(playedExpanded[i].course.id+"-"+(playedExpanded[i].subName||"main"),rank);
      }
      const rankCounts=new Map();for(const r of fullRanks.values())rankCounts.set(r,(rankCounts.get(r)||0)+1);
      const getRank=(e)=>fullRanks.get(e.course.id+"-"+(e.subName||"main"));
      const isTied=(e)=>rankCounts.get(getRank(e))>1;
      return played.length===0?
      <div className="fade-up" style={{textAlign:"center",padding:"48px 24px 24px",color:"var(--c-muted)"}}>
        <div style={{fontSize:36,marginBottom:10}}>⛳</div>
        <div style={{fontWeight:500,fontSize:18,fontFamily:"var(--font-display)",color:"var(--c-text)",marginBottom:6,letterSpacing:-0.3}}>{q?"No results":"Your ratings will live here"}</div>
        <div style={{fontSize:12,marginBottom:q?0:16,lineHeight:1.5,maxWidth:260,margin:q?"0 auto":"0 auto 16px"}}>{q?"Try a different search":"Rate a course from Discover to start building your personal ranking."}</div>
        {!q&&<button type="button" className="pressable" onClick={()=>onGoToTab&&onGoToTab("discover")} style={{background:"var(--c-green)",color:"#fff",border:"none",borderRadius:10,padding:"10px 20px",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"var(--font-body)"}}>Discover Courses</button>}
      </div>
      :played.map((e,i)=>{const c=e.course;const displayName=e.subName?`${cardName(c)} — ${e.subName}`:cardName(c);const r=getRank(e);const rankLabel=isTied(e)?`T-${r}`:`#${r}`;return(
        <div key={c.id+"-"+(e.subName||"main")} className="fade-up pressable" onClick={()=>onSelect(c)} style={{display:"flex",gap:12,padding:"12px 16px",borderBottom:"1px solid var(--c-border)",cursor:"pointer",animationDelay:`${i*35}ms`}}>
          <div style={{width:40,height:40,borderRadius:10,overflow:"hidden",flexShrink:0,position:"relative",background:"var(--c-surface)"}}>
            {(coursePreviews?.[c.id]||c.img)&&<img src={coursePreviews?.[c.id]||c.img} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>}
            <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(28,25,23,0.5)",fontWeight:800,fontSize:isTied(e)?9:11,color:"#fff"}}>{rankLabel}</div>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
              <span style={{fontWeight:600,fontSize:14}}>{displayName}</span>
              {e.score?<ScorePill score={e.score} early={e.isEarly}/>:<span style={{fontSize:11,fontWeight:600,color:"var(--c-green)",border:"1px solid var(--c-green-border)",borderRadius:6,padding:"2px 8px",background:"var(--c-green-dim)"}}>Rate</span>}
            </div>
            <div style={{color:"var(--c-muted)",fontSize:11,marginBottom:2}}>{c.city}, {c.state}</div>
            {(e.personalBest!=null||e.shotScore)&&<div style={{fontSize:11,color:"var(--c-green)",fontWeight:600}}>{(e.isHomeCourse||e.playCount>1)?`Personal Best: ${e.personalBest??e.shotScore}`:`Shot ${e.shotScore}`}</div>}
          </div>
        </div>);});})()}
    {tab==="want"&&(want.length===0?
      <div className="fade-up" style={{textAlign:"center",padding:"48px 24px 24px",color:"var(--c-muted)"}}>
        <div style={{fontSize:36,marginBottom:10}}>🎯</div>
        <div style={{fontWeight:500,fontSize:18,fontFamily:"var(--font-display)",color:"var(--c-text)",marginBottom:6,letterSpacing:-0.3}}>{q?"No results":"Build your bucket list"}</div>
        <div style={{fontSize:12,marginBottom:q?0:16,lineHeight:1.5,maxWidth:260,margin:q?"0 auto":"0 auto 16px"}}>{q?"Try a different search":"Save courses you want to play. We'll remind you when friends rate them."}</div>
        {!q&&<button type="button" className="pressable" onClick={()=>onGoToTab&&onGoToTab("discover")} style={{background:"var(--c-green)",color:"#fff",border:"none",borderRadius:10,padding:"10px 20px",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"var(--font-body)"}}>Browse Courses</button>}
      </div>
      :want.map((c,i)=>{
        const wantSubs=statuses[c.id]?.wantSubs;
        /* Build 3: which friends also have this on their bucket list?
           Data comes from the eager-loaded friend.want map (Wave C). */
        const friendsWithBucket=(friends||[]).filter(f=>(f.want||[]).includes(c.id));
        return(
        <div key={c.id} className="fade-up pressable" onClick={()=>onSelect(c)} style={{display:"flex",gap:12,padding:"12px 16px",borderBottom:"1px solid var(--c-border)",cursor:"pointer",animationDelay:`${i*35}ms`}}>
          <div style={{width:40,height:40,borderRadius:10,overflow:"hidden",flexShrink:0,background:"var(--c-surface)"}}>{(coursePreviews?.[c.id]||c.img)&&<img src={coursePreviews?.[c.id]||c.img} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:14,marginBottom:2}}>{c.name}</div>
            <div style={{color:"var(--c-muted)",fontSize:11,marginBottom:4}}>{c.city}, {c.state}{wantSubs&&wantSubs.length>0&&<span style={{marginLeft:6,color:"var(--c-blue)",fontWeight:600}}>· {wantSubs.join(", ")}</span>}</div>
            <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
              <Tag>{c.terrain}</Tag><Tag>{c.access}</Tag>
              {friendsWithBucket.length>0&&<div style={{display:"flex",alignItems:"center",gap:4,marginLeft:"auto"}}>
                <div style={{display:"flex"}}>
                  {friendsWithBucket.slice(0,3).map((f,fi)=>(
                    <div key={f.id} style={{marginLeft:fi===0?0:-6,border:"1.5px solid var(--c-bg)",borderRadius:"50%",width:20,height:20,overflow:"hidden",zIndex:3-fi}}>
                      <Avatar name={f.name} initials={f.initials} color={f.color} size={17} photo={f.profilePhoto} photoPos={f.profilePhotoPos}/>
                    </div>
                  ))}
                </div>
                {friendsWithBucket.length>3&&<span style={{fontSize:10,color:"var(--c-muted)",fontWeight:600}}>+{friendsWithBucket.length-3}</span>}
              </div>}
            </div>
          </div>
        </div>);}))}
  </div>);
}

/* ═══════════════════════════════════════════════════════════
   FRIENDS TAB
═══════════════════════════════════════════════════════════ */
function FriendsTab({friends,followers=[],activity:activityFromProps,onAddFriend,onViewFriend,onSelectCourse,reactions,toggleEmoji,addComment:addCommentProp,myUid}){
  const[lightbox,setLightbox]=useState(null);
  const openLightbox=(photos,startIndex)=>setLightbox({photos,startIndex});
  const[view,setView]=useState("list"); // "list"|"activity"|"add"
  const[friendQuery,setFriendQuery]=useState("");
  const[searchResults,setSearchResults]=useState([]);
  const[searching,setSearching]=useState(false);
  /* Contacts that matched a Pure user. We resolve names against Supabase via dbSearchUsers
     and only keep contacts that actually have an account. State persists across re-renders
     while the tab is mounted but resets on tab switch (intentional — no stale matches). */
  const[contactMatches,setContactMatches]=useState([]);
  const[syncingContacts,setSyncingContacts]=useState(false);
  const[contactsSyncedOnce,setContactsSyncedOnce]=useState(false);
  const[commentInputs,setCommentInputs]=useState({});
  const REACTION_EMOJIS=["\u{1F525}","\u{1F44F}","\u{1F44D}","\u2764\uFE0F","\u{1F62E}","\u26F3\uFE0F"];
  /* Single search bar drives both: filtering existing friends locally AND searching new users
     on Supabase (debounced 250ms). Results below show non-followed users with a Follow button. */
  const filteredFriends=useMemo(()=>{
    const q=friendQuery.trim().toLowerCase().replace(/^@/,"");
    if(!q)return friends;
    return friends.filter(f=>f.name.toLowerCase().includes(q)||(f.username||"").toLowerCase().includes(q));
  },[friends,friendQuery]);
  useEffect(()=>{
    const q=friendQuery.trim().replace(/^@/,"");
    if(q.length<2){setSearchResults([]);setSearching(false);return;}
    setSearching(true);
    let cancelled=false;
    const t=setTimeout(async()=>{
      const results=await dbSearchUsers(q,myUid);
      if(cancelled)return;
      /* Hide users I'm already following */
      const followingIds=new Set(friends.map(f=>f.id));
      setSearchResults(results.filter(r=>!followingIds.has(r.id)));
      setSearching(false);
    },250);
    return()=>{cancelled=true;clearTimeout(t);};
  },[friendQuery,myUid,friends]);
  /* addComment + sendReaction now persist to Supabase via the App-level prop. The
     prop is the same `addComment` used by ClubhouseActivityCard on the Home tab, which
     internally calls postReaction({authorId, courseId, text|emoji}) and merges with
     the realtime channel — so reactions made in Friends tab show up everywhere and
     survive reload. Previously this lived in `localComments` state and was lost on
     navigation. */
  const addComment=(key)=>{
    const text=(commentInputs[key]||"").trim();if(!text)return;
    if(addCommentProp)addCommentProp(key,text);
    setCommentInputs(c=>({...c,[key]:""}));
  };
  /* Pressing a reaction emoji posts it as a comment via the same path. */
  const sendReaction=(key,em)=>{
    if(addCommentProp)addCommentProp(key,em);
  };

  /* Activity feed comes from the App-level state hydrated by dbLoadFolloweeActivity. */
  const activity=activityFromProps||[];

  return(<div>
    {lightbox&&<PhotoLightbox photos={lightbox.photos} startIndex={lightbox.startIndex} onClose={()=>setLightbox(null)}/>}
    <div style={{padding:"10px 16px",display:"flex",gap:6}}>
      {[["list","Friends"],["activity","Activity"]].map(([k,l])=>(
        <button key={k} className="pressable" onClick={()=>setView(k)} style={{flex:1,padding:"10px",borderRadius:10,border:"none",cursor:"pointer",fontWeight:600,fontSize:12,
          fontFamily:"var(--font-body)",background:view===k?"var(--c-green)":"var(--c-card)",color:view===k?"#fff":"var(--c-sub)",
          transition:"background 200ms var(--ease-out),color 200ms var(--ease-out)"}}>{l}</button>))}
    </div>

    {view==="list"&&<div>
      {/* Search existing friends */}
      <div style={{padding:"8px 16px 6px",position:"relative"}}>
        <input value={friendQuery} onChange={e=>setFriendQuery(e.target.value)} placeholder="Search by name or @username..."
          style={{width:"100%",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:10,padding:"10px 34px 10px 14px",fontSize:13,outline:"none",fontFamily:"var(--font-body)",boxSizing:"border-box",
            transition:"border-color 200ms var(--ease-out)"}}
          onFocus={e=>e.target.style.borderColor="var(--c-green)"} onBlur={e=>e.target.style.borderColor=""}/>
        {friendQuery&&<button className="pressable" onClick={()=>setFriendQuery("")} style={{position:"absolute",right:24,top:"50%",transform:"translateY(-50%)",width:20,height:20,borderRadius:"50%",background:"var(--c-surface)",border:"1px solid var(--c-border)",color:"var(--c-sub)",fontSize:10,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>{"\u2715"}</button>}
      </div>
      {/* Sync Contacts — native iOS only. Reads names from the device, runs each through
          dbSearchUsers, and only surfaces contacts that have a Pure account. Names are
          matched on-device + via the existing user-search RPC; the contact list is never
          stored server-side. Hidden once a search query is active. */}
      {!friendQuery.trim()&&IS_NATIVE&&!contactsSyncedOnce&&<div style={{padding:"4px 16px 8px"}}>
        <button type="button" className="pressable" disabled={syncingContacts} onClick={async()=>{
          const Contacts=window.Capacitor?.Plugins?.Contacts;
          if(!Contacts){alert("Contacts not available on this device.");return;}
          setSyncingContacts(true);
          try{
            const perm=await Contacts.requestPermissions();
            if(perm?.contacts!=="granted"){
              alert("Contacts permission denied. You can enable it in Settings \u2192 Pure.");
              setSyncingContacts(false);return;
            }
            const{contacts}=await Contacts.getContacts({projection:{name:true}});
            /* Dedupe contact names on device. Cap at 100 — keeps the parallel search burst
               from hammering Supabase if someone has thousands of contacts. */
            const names=Array.from(new Set((contacts||[]).map(c=>c?.name?.display||[c?.name?.given,c?.name?.family].filter(Boolean).join(" ")).filter(Boolean).map(n=>n.trim()))).slice(0,100);
            if(!names.length){alert("No contacts found.");setSyncingContacts(false);return;}
            /* Search each name in parallel; collect distinct user matches. Filter to the
               current contact list only — no random Pure users sneak in via partial name
               overlap. RLS still gates results, but `dbSearchUsers` already excludes self. */
            const followingIds=new Set(friends.map(f=>f.id));
            const lowerNames=new Set(names.map(n=>n.toLowerCase()));
            const results=await Promise.all(names.map(n=>dbSearchUsers(n,myUid)));
            const seen=new Set();
            const matched=[];
            results.forEach(arr=>{
              (arr||[]).forEach(u=>{
                if(!u?.id||seen.has(u.id))return;
                if(followingIds.has(u.id))return;
                /* Strict match: the user's display name must match a contact name we
                   actually have. Without this, a search for "Mike" returns every Mike
                   on Pure. */
                const nm=(u.name||"").toLowerCase();
                if(!lowerNames.has(nm))return;
                seen.add(u.id);
                matched.push(u);
              });
            });
            setContactMatches(matched);
            setContactsSyncedOnce(true);
          }catch(e){
            console.warn("Contacts sync failed:",e?.message||e);
            alert("Could not access contacts.");
          }finally{setSyncingContacts(false);}
        }} style={{width:"100%",background:"var(--c-surface)",border:"1px dashed var(--c-border)",borderRadius:10,padding:"11px",fontSize:12,fontWeight:600,color:"var(--c-sub)",cursor:syncingContacts?"default":"pointer",fontFamily:"var(--font-body)",display:"flex",alignItems:"center",justifyContent:"center",gap:6,opacity:syncingContacts?0.6:1}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          {syncingContacts?"Searching your contacts\u2026":"Find friends from your contacts"}
        </button>
      </div>}
      {/* Pure-matched contacts — only shown when sync ran. Tap a row to view profile,
          tap Follow to follow inline. Same row treatment as the live search results. */}
      {!friendQuery.trim()&&IS_NATIVE&&contactsSyncedOnce&&<div style={{padding:"0 16px 8px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
          <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase"}}>Contacts on Pure</div>
          <button type="button" className="pressable" onClick={()=>{setContactMatches([]);setContactsSyncedOnce(false);}} style={{background:"transparent",border:"none",color:"var(--c-muted)",fontSize:10,fontWeight:600,cursor:"pointer",padding:0,fontFamily:"var(--font-body)"}}>Hide</button>
        </div>
        {contactMatches.length===0?
          <div style={{padding:"12px 14px",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:10,fontSize:12,color:"var(--c-muted)",textAlign:"center",lineHeight:1.5}}>None of your contacts are on Pure yet.</div>
        :<div style={{display:"flex",flexDirection:"column",gap:4}}>
          {contactMatches.map(u=>{
            const followsMe=followers.some(f=>f.id===u.id);
            return(<div key={u.id} className="pressable" onClick={()=>onViewFriend(u)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:10,border:"1px solid var(--c-border)",background:"var(--c-card)",cursor:"pointer",fontFamily:"var(--font-body)"}}>
              <Avatar name={u.name} initials={u.initials} size={32} photo={u.profilePhoto} photoPos={u.profilePhotoPos}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:13,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{u.name}{followsMe&&<span style={{marginLeft:6,fontSize:9,fontWeight:700,color:"var(--c-green)",background:"var(--c-green-dim)",border:"1px solid var(--c-green-border)",borderRadius:6,padding:"2px 6px",letterSpacing:0.3,textTransform:"uppercase",fontFamily:"var(--font-body)",verticalAlign:"middle"}}>Follows you</span>}</div>
                {u.username&&<div style={{fontSize:11,color:"var(--c-muted)",fontWeight:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>@{u.username}</div>}
              </div>
              <button type="button" className="pressable" onClick={e=>{e.stopPropagation();onAddFriend(u);setContactMatches(prev=>prev.filter(x=>x.id!==u.id));}} style={{background:"var(--c-green)",color:"#fff",border:"none",borderRadius:8,padding:"6px 12px",fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"var(--font-body)",letterSpacing:0.3}}>+ Follow</button>
            </div>);
          })}
        </div>}
      </div>}
      {/* Search results — only shown when query is at least 2 chars and has matches */}
      {friendQuery.trim().replace(/^@/,"").length>=2&&<div style={{padding:"4px 16px 8px"}}>
        <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>{searching?"Searching\u2026":searchResults.length?"Find people":"No matches"}</div>
        {searchResults.length>0&&<div style={{display:"flex",flexDirection:"column",gap:4}}>
          {searchResults.map(u=>{
            const followsMe=followers.some(f=>f.id===u.id);
            return(<div key={u.id} className="pressable" onClick={()=>onViewFriend(u)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:10,border:"1px solid var(--c-border)",background:"var(--c-card)",cursor:"pointer",fontFamily:"var(--font-body)"}}>
              <Avatar name={u.name} initials={u.initials} size={32} photo={u.profilePhoto} photoPos={u.profilePhotoPos}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:13,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{u.name}{followsMe&&<span style={{marginLeft:6,fontSize:9,fontWeight:700,color:"var(--c-green)",background:"var(--c-green-dim)",border:"1px solid var(--c-green-border)",borderRadius:6,padding:"2px 6px",letterSpacing:0.3,textTransform:"uppercase",fontFamily:"var(--font-body)",verticalAlign:"middle"}}>Follows you</span>}</div>
                {u.username&&<div style={{fontSize:11,color:"var(--c-muted)",fontWeight:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>@{u.username}</div>}
              </div>
              <button type="button" className="pressable" onClick={e=>{e.stopPropagation();onAddFriend(u);}} style={{background:"var(--c-green)",color:"#fff",border:"none",borderRadius:8,padding:"6px 12px",fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"var(--font-body)",letterSpacing:0.3}}>+ Follow</button>
            </div>);
          })}
        </div>}
      </div>}

      {friends.length===0?
        <div className="fade-up" style={{textAlign:"center",padding:"48px 24px 24px",color:"var(--c-muted)"}}>
          <div style={{fontSize:36,marginBottom:10}}>{"\u{1F465}"}</div>
          <div style={{fontWeight:500,fontSize:18,fontFamily:"var(--font-display)",color:"var(--c-text)",marginBottom:6,letterSpacing:-0.3}}>Golf is better with friends</div>
          <div style={{fontSize:12,marginBottom:16,lineHeight:1.5,maxWidth:260,margin:"0 auto 16px"}}>Search for friends by name or @username to follow them and see where they've played.</div>
          <button type="button" className="pressable" onClick={()=>document.querySelector('input[placeholder^="Search by name"]')?.focus()} style={{background:"var(--c-green)",color:"#fff",border:"none",borderRadius:10,padding:"10px 20px",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"var(--font-body)"}}>Find Friends</button>
        </div>
      :filteredFriends.length===0?
        <div style={{textAlign:"center",padding:"40px 20px",color:"var(--c-muted)",fontSize:12}}>No friends match "{friendQuery}"</div>
      :filteredFriends.map((f,i)=>{
        /* Played count expands sub-courses (Bethpage 4 subs = 4 played) so this
           matches what users see on their own profile. Data hasn't loaded yet
           when both ratings and played are empty (initial mount before tertiary
           hydration finishes) — show a skeleton placeholder instead of "0". */
        const dataLoaded=Object.keys(f.ratings||{}).length>0||(f.played||[]).length>0;
        const ct=(f.played||[]).reduce((sum,cid)=>{
          const c=COURSES.find(x=>x.id===cid);
          const r=f.ratings?.[cid];
          if(c?.subcourses&&r?.allSubs&&Object.keys(r.allSubs).length)return sum+Object.keys(r.allSubs).length;
          return sum+1;
        },0);
        const lastRating=Object.values(f.ratings).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
        const lastCourse=lastRating?COURSES.find(c=>c.id===Number(Object.entries(f.ratings).find(([,r])=>r===lastRating)?.[0])):null;
        const homeCourse=f.homeCourseId?COURSES.find(c=>c.id===f.homeCourseId):null;
        return(
          <div key={f.id} className="fade-up pressable" onClick={()=>onViewFriend(f)}
            style={{display:"flex",gap:12,padding:"14px 16px",borderBottom:"1px solid var(--c-border)",cursor:"pointer",animationDelay:`${i*40}ms`}}>
            <Avatar name={f.name} initials={f.initials} color={f.color} size={42} photo={f.profilePhoto}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:14,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}{f.username&&<span style={{color:"var(--c-muted)",fontWeight:500,fontSize:12,marginLeft:6}}>@{f.username}</span>}</div>
              <div style={{fontSize:11,color:"var(--c-muted)"}}>
                {homeCourse?<span>🏠 {homeCourse.name.split(" Golf")[0].split(" Country")[0]} · </span>:null}
                {dataLoaded
                  ?<><span>{ct} courses played</span>{lastCourse&&<span> · Last played {lastCourse.name.split(" ")[0]}...</span>}</>
                  :<span className="pure-skel" style={{display:"inline-block",width:90,height:11,verticalAlign:"middle",borderRadius:4}}/>
                }
              </div>
            </div>
            <div style={{color:"var(--c-muted)",fontSize:14,alignSelf:"center"}}>{"\u203A"}</div>
          </div>
        );
      })}
    </div>}

    {view==="activity"&&<div>
      {activity.length===0?
        <div className="fade-up" style={{textAlign:"center",padding:"48px 24px 24px",color:"var(--c-muted)"}}>
          <div style={{fontSize:36,marginBottom:10}}>{"\u{1F44B}"}</div>
          <div style={{fontWeight:500,fontSize:18,fontFamily:"var(--font-display)",color:"var(--c-text)",marginBottom:6,letterSpacing:-0.3}}>{friends.length===0?"No activity yet":"Quiet on the course"}</div>
          <div style={{fontSize:12,lineHeight:1.5,maxWidth:260,margin:"0 auto"}}>{friends.length===0?"Add friends to see their rounds roll in here.":"When friends rate courses, you'll see it here."}</div>
        </div>
      :activity.map((item,i)=>{
        const key=`${item.friend.id}-${item.course.id}`;
        const rx=reactions[key]||{emojis:[],comments:[]};
        /* Source-of-truth comments live on `rx.comments` (server-synced via App-level
           postReaction + realtime channel). Previously this read `localComments[key]`
           which lived only in this component's state and was lost on tab switch. */
        const cmts=rx.comments||[];
        return(
        <div key={key} className="fade-up" style={{padding:"14px 16px",borderBottom:"1px solid var(--c-border)",animationDelay:`${i*30}ms`}}>
          <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
            <div className="pressable" onClick={()=>onViewFriend&&onViewFriend(item.friend)} style={{cursor:"pointer"}}><Avatar name={item.friend.name} initials={item.friend.initials} color={item.friend.color} size={34}/></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,marginBottom:4}}>
                <span className="pressable" onClick={()=>onViewFriend&&onViewFriend(item.friend)} style={{fontWeight:600,cursor:"pointer"}}>{item.friend.name}</span>
                <span style={{color:"var(--c-muted)"}}> rated </span>
                <span className="pressable" onClick={()=>onSelectCourse&&onSelectCourse(item.course)} style={{fontWeight:600,cursor:"pointer",color:"var(--c-green)"}}>{item.course.name}</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <ScorePill score={item.rating.overall}/>
                <span style={{fontSize:11,color:"var(--c-muted)"}}>{scoreLabel(item.rating.overall)}</span>
              </div>
              {item.rating.shotScore&&<div style={{fontSize:11,color:"var(--c-green)",fontWeight:600,marginTop:4}}>Shot: {item.rating.shotScore}</div>}
              {item.rating.photos?.length>0&&<div data-allow-horizontal style={{marginTop:8,display:"flex",gap:6,overflowX:"auto"}}>
                {item.rating.photos.map((src,pi)=>(
                  <button key={pi} type="button" className="pressable" onClick={()=>openLightbox(item.rating.photos,pi)} style={{width:80,height:80,borderRadius:10,overflow:"hidden",flexShrink:0,border:"1px solid var(--c-border)",padding:0,background:"none",cursor:"pointer"}}>
                    <img src={src} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
                  </button>
                ))}
              </div>}
              {/* Friend's own review (and any sub-course reviews) */}
              {(()=>{
                const friendComments=[];
                if(item.rating.review)friendComments.push({text:item.rating.review,sub:null});
                if(item.rating.allSubs)Object.entries(item.rating.allSubs).forEach(([name,r])=>{if(r.review&&r.review!==item.rating.review)friendComments.push({text:r.review,sub:name});});
                if(!friendComments.length)return null;
                return(<div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
                  {friendComments.map((co,ri)=>(
                    <div key={`rvw-${ri}`}>
                      {co.sub&&<div style={{fontSize:9,fontWeight:700,color:"var(--c-green)",letterSpacing:0.5,textTransform:"uppercase",marginBottom:3}}>{co.sub}</div>}
                      <p style={{color:"var(--c-text)",fontSize:12,fontStyle:"italic",lineHeight:1.5,fontFamily:"var(--font-display)"}}>&ldquo;{co.text}&rdquo;</p>
                    </div>
                  ))}
                </div>);
              })()}
              {/* Reactions row — each press posts the emoji as a comment */}
              <div style={{display:"flex",gap:4,marginTop:10,flexWrap:"wrap",alignItems:"center"}}>
                {REACTION_EMOJIS.map(em=>(
                  <button key={em} className="pressable" onClick={()=>sendReaction(key,em)} style={{
                    background:"var(--c-surface)",
                    border:"1px solid var(--c-border)",
                    borderRadius:14,padding:"3px 8px",cursor:"pointer",fontSize:13,lineHeight:1,
                    transition:"background 160ms var(--ease-out)"}}>{em}</button>
                ))}
              </div>
              {cmts.length>0&&<div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
                {cmts.map((co,j)=>{
                  const isEmojiOnly=/^\p{Emoji}+$/u.test(co.text.trim());
                  /* Build 3: look up the reactor by reactorId so multi-person
                     reaction threads don't all attribute to "You". */
                  let authorLabel="Someone";
                  if(co.reactorId===myUid)authorLabel="You";
                  else{
                    const reactor=(friends||[]).find(f=>f.id===co.reactorId);
                    if(reactor)authorLabel=reactor.name.split(" ")[0];
                  }
                  return(
                  <div key={j} style={{background:"var(--c-surface)",borderRadius:10,padding:"7px 11px",fontSize:isEmojiOnly?16:12,color:"var(--c-text)",lineHeight:1.4}}>
                    <span style={{fontWeight:600,marginRight:6,fontSize:12}}>{authorLabel}</span>{co.text}
                  </div>);
                })}
              </div>}
              <div style={{marginTop:8,display:"flex",gap:6}}>
                <input value={commentInputs[key]||""} onChange={e=>setCommentInputs(c=>({...c,[key]:e.target.value}))}
                  onKeyDown={e=>e.key==="Enter"&&addComment(key)}
                  placeholder="Add a comment..."
                  style={{flex:1,background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:14,padding:"6px 12px",fontSize:12,outline:"none",fontFamily:"var(--font-body)",
                    transition:"border-color 160ms var(--ease-out)"}}
                  onFocus={e=>e.target.style.borderColor="var(--c-green)"} onBlur={e=>e.target.style.borderColor=""}/>
                {commentInputs[key]&&<button className="pressable" onClick={()=>addComment(key)} style={{background:"var(--c-green)",color:"#fff",border:"none",borderRadius:14,padding:"6px 12px",fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"var(--font-body)"}}>Post</button>}
              </div>
            </div>
            <div style={{fontSize:11,color:"var(--c-muted)",flexShrink:0,marginTop:2}}>{timeAgo(item.date)}</div>
          </div>
        </div>);
      })}
    </div>}
  </div>);
}

/* ═══════════════════════════════════════════════════════════
   FRIEND PROFILE VIEW
═══════════════════════════════════════════════════════════ */
function FriendProfile({friend:friendBase,onBack,onSelectCourse,friends,onViewFriend,myStatuses,isFriend,followsYou,onAddFriend,onRemoveFriend}){
  const[showList,setShowList]=useState(null); // null | "followers" | "following" | "played" | "scores" | "states" | "countries" | "pga" | "gd" | "bucket"
  const[listSearch,setListSearch]=useState("");
  const[avatarOpen,setAvatarOpen]=useState(false);
  /* Lazy-load the friend's full ratings + want list from Supabase on mount. The base
     friend object only carries profile fields (id, name, photo) after the search/follow
     flow, so we fetch the rest here. RLS gates this to followees only — if I'm not
     following them, the queries return empty rows and the profile renders as "0 courses".

     Two perf wins to avoid the previous 3-5s blank load:
       1. In-session cache (window.__friendDetailsCache) keyed by friend id — revisiting
          the same friend reuses the prior fetch instantly.
       2. Render the profile shell immediately with whatever's known from `friendBase`
          (name, photo, etc.) so the user sees something paint right away. Stats fill
          in when the fetch resolves; until then we show 0s but no full-screen blocker. */
  const cached=(()=>{try{return window.__friendDetailsCache?.[friendBase?.id]||null;}catch{return null;}})();
  const[detailsLoaded,setDetailsLoaded]=useState(!!cached);
  const[details,setDetails]=useState(cached||{ratings:friendBase.ratings||{},want:friendBase.want||[],played:friendBase.played||[]});
  const[loadError,setLoadError]=useState(null);
  const[retryToken,setRetryToken]=useState(0);
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      if(!friendBase?.id)return;
      setLoadError(null);
      const d=await dbLoadFriendDetails(friendBase.id);
      if(cancelled)return;
      if(d._error){setLoadError(d._error);return;}
      const next={
        ratings:d.ratings||{},
        want:d.want||friendBase.want||[],
        played:d.played?.length?d.played:(friendBase.played||Object.keys(d.ratings||{}).map(Number)),
      };
      setDetails(next);
      setDetailsLoaded(true);
      try{
        if(!window.__friendDetailsCache)window.__friendDetailsCache={};
        window.__friendDetailsCache[friendBase.id]=next;
      }catch{}
    })();
    return()=>{cancelled=true;};
  },[friendBase?.id,retryToken]);
  /* Compose the displayed friend object: base profile + lazy-loaded details. */
  const friend=useMemo(()=>({...friendBase,ratings:details.ratings,want:details.want,played:details.played}),[friendBase,details]);
  useEffect(()=>{setListSearch("");},[showList]);
  const ratingsObj=friend.ratings||{};
  const scores=Object.values(ratingsObj).map(r=>r.overall);
  const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null;
  const ranked=Object.entries(ratingsObj).map(([cid,r])=>({course:COURSES.find(c=>c.id===Number(cid)),rating:r}))
    .filter(x=>x.course).sort((a,b)=>b.rating.overall-a.rating.overall);
  const allShotScores=Object.entries(ratingsObj).filter(([,r])=>r.shotScore).map(([cid,r])=>({
    course:COURSES.find(c=>c.id===Number(cid)),score:Number(r.shotScore),date:r.date
  })).filter(x=>x.course).sort((a,b)=>a.score-b.score);
  const friendRounds=useMemo(()=>getRoundsFromRatings(ratingsObj,friend.ghinRounds),[ratingsObj,friend.ghinRounds]);
  const friendHandicap=useMemo(()=>calcHandicap(friendRounds),[friendRounds]);
  const avgShot=allShotScores.length?allShotScores.reduce((s,x)=>s+x.score,0)/allShotScores.length:null;
  const wantCourses=COURSES.filter(c=>friend.want?.includes(c.id));
  const followers=friend.followers||[];
  const following=friend.following||[];
  const playedIds=new Set(friend.played||Object.keys(friend.ratings||{}).map(Number));
  const playedCourses=COURSES.filter(c=>playedIds.has(c.id));
  const statesPlayed=new Set(playedCourses.filter(c=>!c.country||c.country==="USA").map(c=>c.state)).size;
  const countriesPlayed=new Set(playedCourses.map(c=>c.country||"USA")).size;
  const pgaCount=(()=>{let n=0;playedCourses.filter(c=>c.pgaTour).forEach(c=>{const r=friend.ratings?.[c.id];if(c.subcourses&&r?.allSubs){n+=Object.keys(r.allSubs).length;}else if(r){n++;}});return n;})();
  const gdCount=(()=>{let n=0;playedCourses.filter(c=>c.gdWorld||c.gdUS).forEach(c=>{const r=friend.ratings?.[c.id];if(c.subcourses&&r?.allSubs){n+=Object.keys(r.allSubs).length;}else if(r){n++;}});return n;})();

  return(<div className="slide-over" style={{height:"100%",overflowY:"auto",WebkitOverflowScrolling:"touch",overscrollBehavior:"contain",background:"var(--c-bg)"}}>
    <div style={{padding:"calc(env(safe-area-inset-top, 0px) + 16px) 18px 16px"}}>
      <button className="pressable" onClick={onBack} style={{background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:10,padding:"7px 12px",cursor:"pointer",fontWeight:600,fontSize:13,fontFamily:"var(--font-body)",marginBottom:20,display:"flex",alignItems:"center",gap:4}}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>

      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16}}>
        <Avatar name={friend.name} initials={friend.initials} color={friend.color} size={56} photo={friend.profilePhoto} photoPos={friend.profilePhotoPos} onClick={friend.profilePhoto?()=>setAvatarOpen(true):undefined}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <div style={{fontSize:22,fontWeight:500,fontFamily:"var(--font-display)",lineHeight:1.1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"100%"}}>{friend.name}</div>
            {followsYou&&<span style={{fontSize:9,fontWeight:700,color:"var(--c-green)",background:"var(--c-green-dim)",border:"1px solid var(--c-green-border)",borderRadius:6,padding:"3px 7px",letterSpacing:0.4,textTransform:"uppercase",fontFamily:"var(--font-body)"}}>Follows you</span>}
          </div>
          {friend.username&&<div style={{color:"var(--c-muted)",fontSize:12,marginTop:2,fontWeight:500}}>@{friend.username}</div>}
          <div style={{color:"var(--c-muted)",fontSize:12,marginTop:4,fontWeight:500}}>{Object.keys(friend.ratings||{}).length} courses rated</div>
        </div>
      </div>
      {(onAddFriend||onRemoveFriend)&&<button className="pressable" onClick={()=>{if(isFriend){onRemoveFriend&&onRemoveFriend(friend);}else{onAddFriend&&onAddFriend(friend);}}} style={{width:"100%",background:isFriend?"var(--c-card)":"var(--c-green)",color:isFriend?"var(--c-text)":"#fff",border:isFriend?"1px solid var(--c-border)":"none",borderRadius:12,padding:"11px",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"var(--font-body)",marginBottom:18,transition:"background 180ms var(--ease-out)"}}>{isFriend?"✓ Following":"+ Follow"}</button>}
      {loadError&&<div style={{display:"flex",alignItems:"center",gap:10,background:"#fef3f2",border:"1px solid #fecdca",borderRadius:10,padding:"10px 12px",marginBottom:14,fontFamily:"var(--font-body)"}}>
        <div style={{flex:1,fontSize:12,color:"#7f1d1d",fontWeight:600,lineHeight:1.4}}>Couldn't load this profile.</div>
        <button type="button" className="pressable" onClick={()=>setRetryToken(t=>t+1)} style={{background:"#7f1d1d",color:"#fff",border:"none",borderRadius:8,padding:"6px 12px",fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"var(--font-body)",letterSpacing:0.3}}>Retry</button>
      </div>}

      <div className="fade-up" style={{display:"flex",gap:16,marginBottom:16,padding:"0 4px"}}>
        {[
          [followers.length,"Followers",()=>setShowList("followers")],
          [following.length,"Following",()=>setShowList("following")],
          [playedCourses.length,"Played",()=>playedCourses.length&&setShowList("played")],
          [wantCourses.length,"Bucket List",()=>wantCourses.length&&setShowList("bucket")],
        ].map(([vl,lb,onClick])=>(
          <button key={lb} className="pressable" onClick={onClick} style={{background:"none",border:"none",cursor:"pointer",textAlign:"center",padding:0,fontFamily:"var(--font-display)"}}>
            <div style={{fontSize:17,fontWeight:500,color:"var(--c-text)",lineHeight:1,fontFamily:"var(--font-display)",minHeight:17,display:"flex",alignItems:"center",justifyContent:"center"}}>
              {detailsLoaded?vl:<Skel w={22} h={14}/>}
            </div>
            <div style={{fontSize:8,color:"var(--c-muted)",marginTop:3,fontWeight:600,letterSpacing:0.3,textTransform:"uppercase",fontFamily:"var(--font-body)"}}>{lb}</div>
          </button>
        ))}
      </div>

      <div className="fade-up" style={{display:"flex",gap:8,marginBottom:14}}>
        <button className="pressable" onClick={()=>friendRounds.length&&setShowList("scores")} style={{flex:1,background:"rgba(21,128,61,0.06)",border:"1px solid rgba(21,128,61,0.15)",borderRadius:12,padding:"14px 6px",textAlign:"center",cursor:friendRounds.length?"pointer":"default",fontFamily:"var(--font-body)"}}>
          <div style={{fontSize:24,fontWeight:300,fontFamily:"var(--font-display)",color:"var(--c-green)",letterSpacing:-0.5,minHeight:24,display:"flex",alignItems:"center",justifyContent:"center"}}>
            {detailsLoaded?(friendHandicap!=null&&friendRounds.length>=5?(friendHandicap<0?"+"+Math.abs(friendHandicap).toFixed(1):friendHandicap.toFixed(1)):"\u2014"):<Skel w={36} h={20}/>}
          </div>
          <div style={{fontSize:8,color:"var(--c-muted)",marginTop:3,fontWeight:700,letterSpacing:0.6,textTransform:"uppercase"}}>Handicap</div>
        </button>
        <button className="pressable" onClick={()=>statesPlayed&&setShowList("states")} style={{flex:1,background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,padding:"14px 6px",textAlign:"center",cursor:statesPlayed?"pointer":"default",fontFamily:"var(--font-body)"}}>
          <div style={{fontSize:24,fontWeight:300,fontFamily:"var(--font-display)",color:"var(--c-green)",letterSpacing:-0.5,minHeight:24,display:"flex",alignItems:"center",justifyContent:"center"}}>
            {detailsLoaded?statesPlayed:<Skel w={28} h={20}/>}
          </div>
          <div style={{fontSize:8,color:"var(--c-muted)",marginTop:3,fontWeight:700,letterSpacing:0.6,textTransform:"uppercase"}}>States</div>
        </button>
        <button className="pressable" onClick={()=>countriesPlayed&&setShowList("countries")} style={{flex:1,background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,padding:"14px 6px",textAlign:"center",cursor:countriesPlayed?"pointer":"default",fontFamily:"var(--font-body)"}}>
          <div style={{fontSize:24,fontWeight:300,fontFamily:"var(--font-display)",color:"var(--c-green)",letterSpacing:-0.5,minHeight:24,display:"flex",alignItems:"center",justifyContent:"center"}}>
            {detailsLoaded?countriesPlayed:<Skel w={28} h={20}/>}
          </div>
          <div style={{fontSize:8,color:"var(--c-muted)",marginTop:3,fontWeight:700,letterSpacing:0.6,textTransform:"uppercase"}}>Countries</div>
        </button>
      </div>

      {(pgaCount>0||gdCount>0)&&<div className="fade-up" style={{display:"flex",gap:8,marginBottom:16}}>
        {pgaCount>0&&<button className="pressable" onClick={()=>setShowList("pga")} style={{display:"flex",alignItems:"center",gap:8,flex:1,background:"rgba(251,191,36,0.06)",border:"1px solid rgba(251,191,36,0.18)",borderRadius:10,padding:"10px 14px",cursor:"pointer",fontFamily:"var(--font-body)",textAlign:"left"}}>
          <div style={{fontSize:20,fontWeight:300,fontFamily:"var(--font-display)",color:"#b45309",letterSpacing:-0.5,lineHeight:1}}>{pgaCount}</div>
          <div style={{fontSize:9,color:"#b45309",fontWeight:700,letterSpacing:0.3,textTransform:"uppercase",lineHeight:1.3}}>PGA Tour<br/>Courses</div>
          <svg style={{marginLeft:"auto",opacity:0.4}} width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#b45309" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>}
        {gdCount>0&&<button className="pressable" onClick={()=>setShowList("gd")} style={{display:"flex",alignItems:"center",gap:8,flex:1,background:"rgba(21,128,61,0.05)",border:"1px solid rgba(21,128,61,0.13)",borderRadius:10,padding:"10px 14px",cursor:"pointer",fontFamily:"var(--font-body)",textAlign:"left"}}>
          <div style={{fontSize:20,fontWeight:300,fontFamily:"var(--font-display)",color:"var(--c-green)",letterSpacing:-0.5,lineHeight:1}}>{gdCount}</div>
          <div style={{fontSize:9,color:"var(--c-green)",fontWeight:700,letterSpacing:0.3,textTransform:"uppercase",lineHeight:1.3}}>Top 100<br/>Courses</div>
          <svg style={{marginLeft:"auto",opacity:0.4}} width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--c-green)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>}
      </div>}

      {showList&&<Sheet onClose={()=>setShowList(null)} floating={showList==="followers"||showList==="following"}>
        <div style={{padding:(showList==="followers"||showList==="following")?"24px 20px":"8px 20px 28px"}}>
          {/* Single heading per sheet — same cleanup as ProfileTab. */}
          <h2 style={{fontSize:22,fontWeight:500,fontFamily:"var(--font-display)",marginBottom:16,letterSpacing:-0.2}}>{showList==="followers"?"Followers":showList==="following"?"Following":showList==="played"?"Played Courses":showList==="bucket"?"Bucket List":showList==="states"?"States Played":showList==="countries"?"Countries Played":showList==="pga"?"PGA Tour Courses":showList==="gd"?"Top 100":showList==="scores"?"Scores":friend.name}</h2>
          {showList==="bucket"?(()=>{
            const myBucketIds=new Set(Object.entries(myStatuses||{}).filter(([,s])=>s.play==="want").map(([id])=>Number(id)));
            const q=listSearch.trim().toLowerCase();
            const matchFn=c=>!q||c.name.toLowerCase().includes(q)||c.city.toLowerCase().includes(q)||c.state.toLowerCase().includes(q);
            const common=wantCourses.filter(c=>myBucketIds.has(c.id)&&matchFn(c));
            const onlyTheirs=wantCourses.filter(c=>!myBucketIds.has(c.id)&&matchFn(c));
            const Row=({c,i,last})=>(
              <div key={c.id} className="pressable" onClick={()=>{setShowList(null);onSelectCourse&&onSelectCourse(c);}} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:last?"none":"1px solid var(--c-border)",cursor:"pointer"}}>
                <div style={{width:36,height:36,borderRadius:8,overflow:"hidden",flexShrink:0,background:"var(--c-surface)"}}>
                  {c.img&&<img src={c.img} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:13}}>{c.name}</div>
                  <div style={{color:"var(--c-muted)",fontSize:11,marginTop:1}}>{c.city}, {c.state}</div>
                </div>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-muted)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </div>);
            return(
              <div>
                {wantCourses.length>0&&<div style={{position:"relative",marginBottom:14}}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-muted)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                  <input value={listSearch} onChange={e=>setListSearch(e.target.value)} placeholder="Search bucket list" style={{width:"100%",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:10,padding:"9px 12px 9px 34px",fontSize:13,fontFamily:"var(--font-body)",boxSizing:"border-box",outline:"none"}}/>
                </div>}
                {common.length>0&&(
                  <div style={{marginBottom:18}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                      <div style={{fontSize:10,fontWeight:700,color:"var(--c-green)",letterSpacing:0.8,textTransform:"uppercase"}}>In Common</div>
                      <div style={{flex:1,height:1,background:"var(--c-border)"}}/>
                      <div style={{fontSize:11,color:"var(--c-muted)",fontWeight:600}}>{common.length}</div>
                    </div>
                    <div style={{background:"var(--c-green-dim)",border:"1px solid var(--c-green-border)",borderRadius:12,padding:"4px 14px"}}>
                      {common.map((c,i)=><Row key={c.id} c={c} i={i} last={i===common.length-1}/>)}
                    </div>
                  </div>
                )}
                {q&&onlyTheirs.length===0&&common.length===0&&<div style={{textAlign:"center",padding:"30px 0",color:"var(--c-muted)",fontSize:12}}>No matches for "{listSearch}"</div>}
                {(!q||onlyTheirs.length>0)&&<div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                    <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:0.8,textTransform:"uppercase"}}>{common.length>0?"Only Theirs":"All Bucket List"}</div>
                    <div style={{flex:1,height:1,background:"var(--c-border)"}}/>
                    <div style={{fontSize:11,color:"var(--c-muted)",fontWeight:600}}>{onlyTheirs.length}</div>
                  </div>
                  {onlyTheirs.length===0?<div style={{textAlign:"center",padding:"18px 0",color:"var(--c-muted)",fontSize:12}}>All of {friend.name.split(" ")[0]}'s bucket list matches yours</div>

    </div>
