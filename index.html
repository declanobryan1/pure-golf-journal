function PhotoCropper({photo,initialX=50,initialY=50,initialScale=1,onSave,onCancel}){
  /* Convert input %-based position to pixel-based translation once image & container load */
  const[imgDims,setImgDims]=useState(null); // natural {w,h}
  const[containerSize,setContainerSize]=useState(0);
  const[scale,setScale]=useState(Math.max(1,initialScale));
  const[tx,setTx]=useState(0); // pixel translate x (from centered base)
  const[ty,setTy]=useState(0);
  const[initialized,setInitialized]=useState(false);
  const containerRef=useRef(null);
  useEffect(()=>{const prev=document.body.style.overflow;document.body.style.overflow="hidden";return()=>{document.body.style.overflow=prev;};},[]);
  useEffect(()=>{
    const el=containerRef.current;if(!el)return;
    const update=()=>setContainerSize(el.getBoundingClientRect().width);
    update();
    const ro=new ResizeObserver(update);ro.observe(el);
    return()=>ro.disconnect();
  },[]);
  const onImgLoad=(e)=>{
    const img=e.currentTarget;
    setImgDims({w:img.naturalWidth,h:img.naturalHeight});
  };
  /* Base size: fit image so it covers the square container (object-cover behavior) */
  const base=useMemo(()=>{
    if(!imgDims||!containerSize)return null;
    const {w,h}=imgDims;
    /* scale so that min(w,h) fills container */
    const s=Math.max(containerSize/w,containerSize/h);
    return{w:w*s,h:h*s};
  },[imgDims,containerSize]);
  /* Apply initial position once base is known */
  useEffect(()=>{
    if(!base||initialized)return;
    /* initialX/Y are 0-100 object-position %. Convert to pixel offset. */
    const overflowX=base.w*initialScale-containerSize;
    const overflowY=base.h*initialScale-containerSize;
    const maxTx=overflowX/2;const maxTy=overflowY/2;
    const itx=overflowX>0?((50-initialX)/50)*maxTx:0;
    const ity=overflowY>0?((50-initialY)/50)*maxTy:0;
    setTx(itx);setTy(ity);setInitialized(true);
  },[base,containerSize,initialScale,initialX,initialY,initialized]);
  const clamp=(nx,ny,s)=>{
    if(!base)return{nx,ny};
    const overflowX=Math.max(0,base.w*s-containerSize);
    const overflowY=Math.max(0,base.h*s-containerSize);
    return{nx:Math.max(-overflowX/2,Math.min(overflowX/2,nx)),ny:Math.max(-overflowY/2,Math.min(overflowY/2,ny))};
  };
  const pointers=useRef(new Map());
  const gesture=useRef({startDist:0,startScale:1,startMidX:0,startMidY:0,origTx:0,origTy:0});
  const onPointerDown=(e)=>{
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    pointers.current.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.current.size===1){
      gesture.current.startMidX=e.clientX;gesture.current.startMidY=e.clientY;
      gesture.current.origTx=tx;gesture.current.origTy=ty;
    }else if(pointers.current.size===2){
      const pts=Array.from(pointers.current.values());
      const dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y;
      gesture.current.startDist=Math.hypot(dx,dy);
      gesture.current.startScale=scale;
      gesture.current.startMidX=(pts[0].x+pts[1].x)/2;gesture.current.startMidY=(pts[0].y+pts[1].y)/2;
      gesture.current.origTx=tx;gesture.current.origTy=ty;
    }
  };
  const onPointerMove=(e)=>{
    if(!pointers.current.has(e.pointerId))return;
    pointers.current.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.current.size===1){
      const dx=e.clientX-gesture.current.startMidX;
      const dy=e.clientY-gesture.current.startMidY;
      const {nx,ny}=clamp(gesture.current.origTx+dx,gesture.current.origTy+dy,scale);
      setTx(nx);setTy(ny);
    }else if(pointers.current.size>=2){
      const pts=Array.from(pointers.current.values());
      const dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y;
      const dist=Math.hypot(dx,dy);
      let newScale=scale;
      if(gesture.current.startDist>0){
        newScale=Math.max(1,Math.min(5,gesture.current.startScale*(dist/gesture.current.startDist)));
        setScale(newScale);
      }
      const midX=(pts[0].x+pts[1].x)/2,midY=(pts[0].y+pts[1].y)/2;
      const panDX=midX-gesture.current.startMidX;
      const panDY=midY-gesture.current.startMidY;
      const {nx,ny}=clamp(gesture.current.origTx+panDX,gesture.current.origTy+panDY,newScale);
      setTx(nx);setTy(ny);
    }
  };
  const onPointerUp=(e)=>{
    pointers.current.delete(e.pointerId);
    if(pointers.current.size<2)gesture.current.startDist=0;
    if(pointers.current.size===1){
      /* If one finger remains, re-anchor its position as the new drag start */
      const remaining=Array.from(pointers.current.values())[0];
      gesture.current.startMidX=remaining.x;gesture.current.startMidY=remaining.y;
      gesture.current.origTx=tx;gesture.current.origTy=ty;
    }
  };
  const handleSave=()=>{
    /* Bake the crop into a data URL so preview doesn't need positioning math */
    if(!imgDims||!base||!containerSize){onSave({dataUrl:photo,x:initialX,y:initialY,scale});return;}
    /* Output size: clamp by the source crop size so we never upscale, but allow up to 1200px for crisp retina display */
    const img=new Image();
    img.onload=()=>{
      const displayedW=base.w*scale;const displayedH=base.h*scale;
      const srcDisplayedLeft=(displayedW-containerSize)/2-tx;
      const srcDisplayedTop=(displayedH-containerSize)/2-ty;
      const ratio=imgDims.w/displayedW;
      const sx=srcDisplayedLeft*ratio;
      const sy=srcDisplayedTop*ratio;
      const sw=containerSize*ratio;
      const sh=containerSize*ratio;
      const OUT=Math.max(512,Math.min(1200,Math.round(sw)));
      const canvas=document.createElement("canvas");
      canvas.width=OUT;canvas.height=OUT;
      let ctx;try{ctx=canvas.getContext("2d",{colorSpace:"display-p3"});}catch{ctx=canvas.getContext("2d");}
      if(!ctx)ctx=canvas.getContext("2d");
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
      try{
        ctx.drawImage(img,sx,sy,sw,sh,0,0,OUT,OUT);
        const dataUrl=canvas.toDataURL("image/jpeg",0.95);
        onSave({dataUrl,x:50,y:50,scale:1});
      }catch(err){
        onSave({dataUrl:photo,x:initialX,y:initialY,scale});
      }
    };
    img.onerror=()=>onSave({dataUrl:photo,x:initialX,y:initialY,scale});
    img.src=photo;
  };
  /* Double-tap to reset to center+1x */
  const lastTapRef=useRef(0);
  const onMaybeDoubleTap=()=>{
    const now=Date.now();
    if(now-lastTapRef.current<280){
      setScale(1);setTx(0);setTy(0);
    }
    lastTapRef.current=now;
  };
  /* Slider control → keep current center stable while scaling */
  const setScaleAroundCenter=newScale=>{
    const ratio=newScale/(scale||1);
    const {nx,ny}=clamp(tx*ratio,ty*ratio,newScale);
    setScale(newScale);setTx(nx);setTy(ny);
  };
  const imgTransform=base?`translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${scale})`:"translate(-50%,-50%)";
  const cropSize=`min(340px, 82vw)`;
  return(<div style={{position:"fixed",inset:0,background:"var(--c-bg)",zIndex:400,display:"flex",flexDirection:"column",animation:"fadeIn 200ms var(--ease-out)",color:"var(--c-text)"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"calc(env(safe-area-inset-top, 0px) + 14px) 18px 12px",flexShrink:0,borderBottom:"1px solid var(--c-border)"}}>
      <button type="button" onClick={onCancel} style={{background:"none",border:"none",color:"var(--c-sub)",fontSize:16,fontWeight:400,cursor:"pointer",fontFamily:"var(--font-body)",padding:"6px 2px",minWidth:60,textAlign:"left"}}>Cancel</button>
      <div style={{fontSize:15,fontWeight:600,fontFamily:"var(--font-body)",letterSpacing:0.1,color:"var(--c-text)"}}>Move and Scale</div>
      <button type="button" onClick={handleSave} style={{background:"none",border:"none",color:"var(--c-green)",fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"var(--font-body)",padding:"6px 2px",minWidth:60,textAlign:"right"}}>Choose</button>
    </div>
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px 20px"}}>
      {/* Crop stage: image fills a square, circular mask overlays to show final crop */}
      <div style={{position:"relative",width:cropSize,aspectRatio:"1/1"}}>
        <div ref={containerRef} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp} onClick={onMaybeDoubleTap} style={{position:"absolute",inset:0,overflow:"hidden",touchAction:"none",userSelect:"none",cursor:"grab",background:"var(--c-surface)",borderRadius:"50%",boxShadow:"0 12px 36px rgba(28,25,23,0.12), 0 0 0 1px rgba(28,25,23,0.06)"}}>
          <img src={photo} alt="" draggable="false" onLoad={onImgLoad} style={{position:"absolute",left:"50%",top:"50%",transform:imgTransform,transformOrigin:"center center",width:base?base.w:"auto",height:base?base.h:"auto",maxWidth:"none",pointerEvents:"none",willChange:"transform"}}/>
        </div>
        {/* Subtle ring around the circle to define the edge */}
        <div aria-hidden style={{position:"absolute",inset:0,pointerEvents:"none",borderRadius:"50%",boxShadow:"inset 0 0 0 1.5px rgba(28,25,23,0.10)"}}/>
      </div>
      {/* Zoom slider */}
      <div style={{marginTop:32,width:cropSize,display:"flex",alignItems:"center",gap:12}}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-muted)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        <input type="range" min="1" max="4" step="0.01" value={scale} onChange={e=>setScaleAroundCenter(parseFloat(e.target.value))} style={{flex:1,accentColor:"var(--c-green)",height:4}}/>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--c-sub)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>
      </div>
    </div>
    <div style={{padding:"6px 20px calc(env(safe-area-inset-bottom, 0px) + 20px)",textAlign:"center",color:"var(--c-muted)",fontSize:12,fontFamily:"var(--font-body)",flexShrink:0,letterSpacing:0.1}}>Drag to reposition · pinch or slide to zoom</div>
  </div>);
}

function PhotoLightbox({photos,startIndex=0,onClose}){
  const[idx,setIdx]=useState(startIndex);
  const[dragX,setDragX]=useState(0);
  const[dragY,setDragY]=useState(0);
  const[animating,setAnimating]=useState(true);
  const[width,setWidth]=useState(0);
  /* Per-view zoom state — resets when navigating to a new photo */
  const[zoom,setZoom]=useState({scale:1,tx:0,ty:0});
  const trackRef=useRef(null);
  const touchRef=useRef({x:0,y:0,t:0,lockAxis:null,active:false});
  const pinchRef=useRef({active:false,startDist:0,startScale:1,startMidX:0,startMidY:0,origTx:0,origTy:0});
  const lastTapRef=useRef(0);
  /* Reset zoom whenever active image changes */
  useEffect(()=>{setZoom({scale:1,tx:0,ty:0});},[idx]);
  useEffect(()=>{
    const prev=document.body.style.overflow;
    document.body.style.overflow="hidden";
    const onKey=(e)=>{
      if(e.key==="Escape")onClose();
      else if(e.key==="ArrowRight")setIdx(i=>Math.min(photos.length-1,i+1));
      else if(e.key==="ArrowLeft")setIdx(i=>Math.max(0,i-1));
    };
    window.addEventListener("keydown",onKey);
    const t=setTimeout(()=>setAnimating(false),260);
    return()=>{document.body.style.overflow=prev;window.removeEventListener("keydown",onKey);clearTimeout(t);};
  },[onClose,photos.length]);
  useEffect(()=>{
    const el=trackRef.current;if(!el)return;
    const update=()=>setWidth(el.getBoundingClientRect().width);
    update();
    const ro=new ResizeObserver(update);ro.observe(el);
    return()=>ro.disconnect();
  },[]);
  const onTouchStart=(e)=>{
    if(e.touches.length>=2){
      /* Start pinch gesture */
      const t1=e.touches[0],t2=e.touches[1];
      const dx=t1.clientX-t2.clientX,dy=t1.clientY-t2.clientY;
      pinchRef.current={active:true,startDist:Math.hypot(dx,dy),startScale:zoom.scale,startMidX:(t1.clientX+t2.clientX)/2,startMidY:(t1.clientY+t2.clientY)/2,origTx:zoom.tx,origTy:zoom.ty};
      touchRef.current.active=false;
      setAnimating(false);
      return;
    }
    const t=e.touches[0];
    touchRef.current={x:t.clientX,y:t.clientY,t:Date.now(),lockAxis:null,active:true,origTx:zoom.tx,origTy:zoom.ty};
    setAnimating(false);
    /* Double-tap detection — toggles between 1x and 2x */
    const now=Date.now();
    if(now-lastTapRef.current<300){
      setZoom(z=>z.scale>1?{scale:1,tx:0,ty:0}:{scale:2,tx:0,ty:0});
      setAnimating(true);
      lastTapRef.current=0;touchRef.current.active=false;
      return;
    }
    lastTapRef.current=now;
  };
  const onTouchMove=(e)=>{
    /* Two-finger pinch */
    if(e.touches.length>=2&&pinchRef.current.active){
      const t1=e.touches[0],t2=e.touches[1];
      const dx=t1.clientX-t2.clientX,dy=t1.clientY-t2.clientY;
      const dist=Math.hypot(dx,dy);
      const newScale=Math.max(1,Math.min(5,pinchRef.current.startScale*(dist/Math.max(1,pinchRef.current.startDist))));
      const midX=(t1.clientX+t2.clientX)/2,midY=(t1.clientY+t2.clientY)/2;
      const panDX=midX-pinchRef.current.startMidX;
      const panDY=midY-pinchRef.current.startMidY;
      setZoom({scale:newScale,tx:pinchRef.current.origTx+panDX,ty:pinchRef.current.origTy+panDY});
      return;
    }
    if(!touchRef.current.active)return;
    const t=e.touches[0];
    const dx=t.clientX-touchRef.current.x;
    const dy=t.clientY-touchRef.current.y;
    /* When zoomed in, single finger pans the image instead of swiping */
    if(zoom.scale>1.02){
      setZoom(z=>({...z,tx:touchRef.current.origTx+dx,ty:touchRef.current.origTy+dy}));
      return;
    }
    if(!touchRef.current.lockAxis){
      if(Math.abs(dx)>10||Math.abs(dy)>10){
        touchRef.current.lockAxis=Math.abs(dx)>Math.abs(dy)?"x":"y";
      }else return;
    }
    if(touchRef.current.lockAxis==="x"){
      let rdx=dx;
      if((idx===0&&dx>0)||(idx===photos.length-1&&dx<0))rdx=dx*0.3;

      setAnimating(true);
      if(zoom.scale<1.05)setZoom({scale:1,tx:0,ty:0});

/* Defer an unmount so the modal can play an exit animation first.
   Returns [closing, closeWithAnim]. Usage:
     const [closing, close] = useModalExit(onClose, 260);
     // backdrop animation: closing?"fadeOut 200ms ...":"fadeIn 200ms ..."
     // panel animation:    closing?"slideDown 260ms ...":"slideUp 300ms ..."
     // call close() instead of onClose() from every dismiss path (backdrop tap, X, Cancel, post-save) */
function useModalExit(onClose,duration){
  const[closing,setClosing]=useState(false);
  const d=typeof duration==="number"?duration:260;
  const timerRef=useRef(null);
  useEffect(()=>()=>{if(timerRef.current)clearTimeout(timerRef.current);},[]);
  /* Lock body scroll while the modal is mounted — prevents iOS rubber-band from
     tugging the page behind the modal. Uses position:fixed (not just overflow:hidden)
     because iOS WKWebView still allows elastic horizontal pan with overflow:hidden alone,
     which manifests as the modal sheet visually drifting sideways during touches.
     Stacked modals unwind correctly: each layer captures the prev style before
     overwriting, and cleanup restores it — so inner-modal close returns to the
     outer-modal lock state, and outermost close returns to the original page. */
  useEffect(()=>{
    const prev={overflow:document.body.style.overflow,position:document.body.style.position,width:document.body.style.width,top:document.body.style.top,left:document.body.style.left,right:document.body.style.right};
    const scrollY=window.scrollY;
    document.body.style.overflow="hidden";
    document.body.style.position="fixed";
    document.body.style.width="100%";
    document.body.style.top=`-${scrollY}px`;
    document.body.style.left="0";
    document.body.style.right="0";
    /* Hard horizontal lock: a non-passive touchmove listener that tracks each finger's
       start position and preventDefaults any move with meaningful horizontal travel.
       This catches every horizontal swipe regardless of where it starts — slider, input,
       backdrop, scroll container — and stops iOS WKWebView from elastically translating
       the sheet sideways. Vertical drags are untouched, so sheet content still scrolls
       and the dismiss-by-drag-down gesture still works.

       Threshold tuning: total horizontal travel >= 2px AND horizontal exceeds vertical
       by 1.5x is enough to lock — this catches subtle drift that previously slipped
       through (the "side to side" wobble Declan reported). Vertical-dominant drags
       still pass through cleanly because we never preventDefault them. */
    const starts=new Map();
    const onStart=e=>{for(const t of e.changedTouches)starts.set(t.identifier,{x:t.clientX,y:t.clientY});};
    const onMove=e=>{
      for(const t of e.changedTouches){
        const s=starts.get(t.identifier);if(!s)continue;
        const dx=Math.abs(t.clientX-s.x),dy=Math.abs(t.clientY-s.y);
        if(dx>=2&&dx>=dy*1.5){e.preventDefault();break;}
      }
    };
    const onEnd=e=>{for(const t of e.changedTouches)starts.delete(t.identifier);};
    document.addEventListener("touchstart",onStart,{passive:true});
    document.addEventListener("touchmove",onMove,{passive:false});
    document.addEventListener("touchend",onEnd,{passive:true});
    document.addEventListener("touchcancel",onEnd,{passive:true});
    return()=>{
      Object.assign(document.body.style,prev);
      window.scrollTo(0,scrollY);
      document.removeEventListener("touchstart",onStart);
      document.removeEventListener("touchmove",onMove);
      document.removeEventListener("touchend",onEnd);
      document.removeEventListener("touchcancel",onEnd);
    };
  },[]);
  const close=React.useCallback((...args)=>{
    if(closing)return;
    setClosing(true);
    timerRef.current=setTimeout(()=>{setClosing(false);onClose&&onClose(...args);},d);
  },[closing,onClose,d]);
  return[closing,close];
}
function Sheet({onClose,children,noDismiss,fullScreen,floating,noEnter}){
  const[closing,close]=useModalExit(onClose,300);
  /* Body lock is handled centrally in useModalExit (position:fixed pattern). */
  /* fullScreen: render as a full-page view with a Back button header (used for Handicap/Rounds).
     Escapes any transformed ancestor via createPortal so nested openings work correctly.
     noEnter: skip the fade-in animation (used when auto-reopening after a Settings
     round-trip — the Sheet was already on screen before, so we don't want it to fade in
     a second time and create a flash of bare Profile behind it). */
  if(fullScreen){
    return ReactDOM.createPortal((
      <div style={{position:"fixed",inset:0,background:"var(--c-bg)",zIndex:150,display:"flex",flexDirection:"column",animation:closing?"fadeOut 220ms var(--ease-out) both":(noEnter?"none":"fadeIn 200ms var(--ease-out)")}}>
        <div style={{padding:"calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px",display:"flex",alignItems:"center",gap:10,background:"var(--c-bg)",flexShrink:0}}>
          <button type="button" onClick={close} className="pressable" style={{background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:10,padding:"7px 12px",cursor:"pointer",fontWeight:600,fontSize:13,fontFamily:"var(--font-body)",color:"var(--c-green)",display:"flex",alignItems:"center",gap:4}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Back
          </button>
        </div>
        <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",paddingBottom:"env(safe-area-inset-bottom, 0px)"}}>{children}</div>
      </div>
    ),document.body);
  }
  /* Portal the sheet into document.body so position:fixed escapes any ancestor with
     `transform`, `will-change`, or `filter` (which create new containing blocks for
     fixed-positioned children). Without this, sheets render constrained to the parent
     scroll container, leaving the header/tab bar uncovered.

     `floating`: pin the sheet at a fixed top offset instead of bottom-flex anchoring.
     With Capacitor `resize: native`, the WebView shrinks when the keyboard opens, and
     a bottom-anchored sheet follows the new bottom upward — for sheets containing a
     search input that's awkward (the whole sheet jumps with the keyboard). With
     `floating`, the sheet stays at a fixed position regardless of viewport resize. */
  const outerStyle=floating?{
    position:"fixed",inset:0,background:"rgba(28,25,23,0.4)",zIndex:100,
    backdropFilter:"blur(6px)",overscrollBehavior:"contain",touchAction:"none",
    animation:closing?"fadeOut 220ms var(--ease-out) both":"fadeIn 220ms var(--ease-out)",
  }:{
    position:"fixed",inset:0,background:"rgba(28,25,23,0.4)",zIndex:100,
    display:"flex",alignItems:"flex-end",justifyContent:"center",
    backdropFilter:"blur(6px)",overscrollBehavior:"contain",touchAction:"none",
    animation:closing?"fadeOut 220ms var(--ease-out) both":"fadeIn 220ms var(--ease-out)",
  };
  const innerStyle=floating?{
    position:"absolute",left:12,right:12,top:"max(env(safe-area-inset-top, 0px) + 60px, 80px)",
    margin:"0 auto",
    background:"var(--c-bg)",borderRadius:18,maxWidth:390,
    maxHeight:"calc(100dvh - 140px - env(safe-area-inset-bottom, 0px))",
    overflowY:"auto",overscrollBehavior:"contain",WebkitOverflowScrolling:"touch",
    border:"1px solid var(--c-border)",
    boxShadow:"0 18px 48px rgba(0,0,0,0.18)",paddingBottom:16,
    touchAction:"pan-y",
    animation:closing?"fadeOut 220ms var(--ease-out) both":"scaleIn 280ms var(--ease-out-expo) both",
    willChange:"transform,opacity",
  }:{
    background:"var(--c-bg)",borderRadius:"18px 18px 0 0",width:"100%",
    maxWidth:390,maxHeight:"92dvh",overflowY:"auto",overscrollBehavior:"contain",
    WebkitOverflowScrolling:"touch",borderTop:"1px solid var(--c-border)",
    boxShadow:"0 -4px 40px rgba(0,0,0,0.12)",paddingBottom:"env(safe-area-inset-bottom, 0px)",
    /* touchAction:pan-y prevents iOS from interpreting horizontal drags on the sheet
       content (e.g. while dragging a slider inside) as a "swipe to dismiss" gesture
       that pulls the entire sheet sideways. */
    touchAction:"pan-y",
    animation:closing?"slideDown 280ms var(--ease-out) both":"sheetUp 360ms var(--ease-out-expo) both",
    willChange:"transform",
  };
  return ReactDOM.createPortal((<div style={outerStyle}
    onClick={noDismiss?undefined:close}
    onTouchMove={e=>{
      /* Defense-in-depth: if a touch starts on the backdrop and moves horizontally,
         preventDefault stops iOS from elastically translating fixed-position children. */
      if(e.target===e.currentTarget)e.preventDefault();
    }}>
    <div style={innerStyle} onClick={e=>e.stopPropagation()}>
      {!floating&&<div style={{display:"flex",justifyContent:"center",paddingTop:10,paddingBottom:4,position:"sticky",top:0,background:"var(--c-bg)",zIndex:1}}>
        <div style={{width:28,height:3,borderRadius:2,background:"var(--c-border)"}}/>
      </div>}
      {children}
    </div>
  </div>),document.body);
}

/* Beta feedback modal — single-textarea, low-friction. Pops automatically once after
   the user's 5th rating, and is also reachable from Settings. Submission writes to
   public.feedback in Supabase with the current tab/route stashed as context so triage
   knows what they were doing when confusion (or praise) struck.

   Design choices:
   - 200-char limit shown inline so users self-edit to specifics
   - Trigger source ("auto" vs "settings") captured in context for funnel analysis
   - Floating top-anchored variant so the keyboard doesn't shove the sheet around */
function FeedbackModal({source,context,onClose,onSubmitted}){
  const[closing,close]=useModalExit(onClose,260);
  const[message,setMessage]=useState("");
  const[saving,setSaving]=useState(false);
  const[done,setDone]=useState(false);
  const submit=async()=>{
    const clean=message.trim();
    if(!clean||saving)return;
    setSaving(true);
    const ok=await dbWriteFeedback({message:clean,context:{...(context||{}),source:source||"unknown"}});
    setSaving(false);
    if(ok){
      trackEvent("feedback_submitted",{source:source||"unknown",length:clean.length});
      setDone(true);
      onSubmitted&&onSubmitted();
      setTimeout(()=>close(),1400);
    }
  };
  return ReactDOM.createPortal((
    <div onClick={close} style={{position:"fixed",inset:0,background:"rgba(28,25,23,0.72)",zIndex:230,display:"flex",alignItems:"flex-start",justifyContent:"center",animation:closing?"fadeOut 200ms var(--ease-out) both":"fadeIn 200ms var(--ease-out)"}}>

          <div style={{fontSize:18,fontWeight:500,fontFamily:"var(--font-display)",marginBottom:4}}>Thank you</div>
          <div style={{fontSize:12,color:"var(--c-muted)",lineHeight:1.5}}>Every reply gets read.</div>
        </div>:<>
          <div style={{fontSize:18,fontWeight:500,fontFamily:"var(--font-display)",marginBottom:4}}>{source==="auto"?"How's Pure feeling so far?":"Send feedback"}</div>

          <button type="button" onClick={submit} disabled={!message.trim()||saving} className="pressable" style={{width:"100%",background:message.trim()&&!saving?"var(--c-green)":"var(--c-card)",color:message.trim()&&!saving?"#fff":"var(--c-muted)",border:message.trim()?"none":"1px solid var(--c-border)",borderRadius:12,padding:"12px",fontWeight:700,fontSize:13,cursor:message.trim()&&!saving?"pointer":"default",fontFamily:"var(--font-body)",marginBottom:6}}>{saving?"Sending\u2026":"Send"}</button>

        </>}

/* ═══════════════════════════════════════════════════════════
   HEAD-TO-HEAD MODAL
═══════════════════════════════════════════════════════════ */
function HeadToHeadModal({course,targetSubName,ratings,onComplete,onClose,friends,userTees,bypassCap}){
  const allCandidates=useMemo(()=>getCandidates(course,targetSubName,ratings),[]);
  const[candidates,setCandidates]=useState(allCandidates);
  const MIN_ROUNDS=Math.min(3,candidates.length);
  const[results,setResults]=useState([]);const[chosen,setChosen]=useState(null);const[busy,setBusy]=useState(false);
  const[phase,setPhase]=useState("impression");const[finalScore,setFinalScore]=useState(null);const[finishing,setFinishing]=useState(false);
  const[impression,setImpression]=useState(null);
  const[note,setNote]=useState("");const[date,setDate]=useState(new Date().toISOString().split("T")[0]);const[shotScore,setShotScore]=useState("");const[photos,setPhotos]=useState([]);const[playedWith,setPlayedWith]=useState([]);const[tee,setTee]=useState(null);
  const startComparisons=()=>{
    if(!impression)return;
    const narrowed=allCandidates.filter(c=>Math.abs(c.score-impression.s)<=1.8);
    setCandidates(narrowed.length>=Math.min(3,allCandidates.length)?narrowed:allCandidates);
    setPhase("duel");
  };
  const current=getNext(candidates,results,course);const roundNum=results.length+1;
  /* Show dynamic target round cap for progress display */
  const displayTarget=Math.max(MIN_ROUNDS,results.length+(shouldContinue(candidates,results)?1:0));
  const choose=choice=>{if(busy||!current)return;
    /* Medium tap on every comparison choice — feels like flipping a card */
    tapMedium();
    setChosen(choice);setBusy(true);
    setTimeout(()=>{const next=[...results,{...current,result:choice}];setResults(next);setChosen(null);setBusy(false);
      const keepGoing=shouldContinue(candidates,next);
      if(!keepGoing){
        const h2hScore=calcScore(next,{bypassCap});
        let adjScore=h2hScore;
        if(impression?.cap)adjScore=Math.min(adjScore,impression.cap);
        if(impression?.floor)adjScore=Math.max(adjScore,impression.floor);
        setFinishing(true);setFinalScore(Math.max(1,Math.min(10,adjScore)));setTimeout(()=>setPhase("result"),350);
      }
    },260);};
  if(phase==="impression"){return(<Sheet onClose={onClose}><div style={{padding:"8px 20px 36px"}}>
    <div style={{display:"flex",justifyContent:"flex-end",marginBottom:-4}}>
      <button className="pressable" onClick={onClose} style={{background:"var(--c-surface)",border:"1px solid var(--c-border)",borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:14,color:"var(--c-muted)",display:"flex",alignItems:"center",justifyContent:"center"}}>{"\u2715"}</button>
    </div>
    <div style={{marginBottom:18}}>
      <div style={{fontSize:10,fontWeight:700,color:"var(--c-green)",letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>First Impression</div>
      <h2 style={{fontSize:22,fontWeight:600,fontFamily:"var(--font-display)",lineHeight:1.2}}>{course.name}{targetSubName?<span style={{color:"var(--c-muted)",fontWeight:400}}> — {targetSubName}</span>:null}</h2>
      <p style={{color:"var(--c-muted)",fontSize:12,marginTop:4}}>How would you describe it? We'll compare it against similar courses next.</p>
    </div>
    <div className="stagger" style={{display:"flex",flexDirection:"column",gap:6,marginBottom:22}}>
      {IMPRESSIONS.map(o=>{const sel=impression?.s===o.s;return(
        <button key={o.s} className="pressable" onClick={()=>setImpression(o)} style={{
          display:"flex",alignItems:"center",gap:12,padding:"14px 16px",borderRadius:12,
          border:`1px solid ${sel?o.color:"var(--c-border)"}`,background:sel?`${o.color}0d`:"var(--c-card)",
          cursor:"pointer",textAlign:"left",transition:"background 180ms var(--ease-out),border-color 180ms var(--ease-out)"}}>
          <div style={{width:12,height:12,borderRadius:"50%",background:o.color,flexShrink:0,opacity:sel?1:0.85,boxShadow:sel?`0 0 0 4px ${o.color}33,0 0 10px ${o.color}66`:`0 0 0 2px ${o.color}22`,transition:"opacity 180ms var(--ease-out),box-shadow 200ms var(--ease-out)"}}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14,fontFamily:"var(--font-body)",color:sel?o.color:"var(--c-text)",transition:"color 180ms var(--ease-out)"}}>{o.label}</div>
            <div style={{fontSize:11,fontFamily:"var(--font-body)",color:"var(--c-muted)",marginTop:1}}>{o.desc}</div>
          </div>
          {sel&&<div style={{width:20,height:20,borderRadius:"50%",background:o.color,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <span style={{fontSize:11,color:"#fff",fontWeight:800}}>{"\u2713"}</span></div>}
        </button>);})}
    </div>
    <PrimaryBtn disabled={!impression} onClick={startComparisons}>Start Comparisons →</PrimaryBtn>
  </div></Sheet>);}
  if(phase==="result"&&finalScore!==null){
    const prevUnits=getRatedUnits(ratings).length;
    const willBeEarly=prevUnits===3||prevUnits===4;
    /* Save the rating on any exit path from the reveal — X button or tap-above */
    const saveAndClose=()=>onComplete({overall:finalScore,comparisons:results.map(r=>({key:r.key,courseId:r.courseId,subName:r.subName,result:r.result})),review:note,date,shotScore:shotScore||null,teeName:tee?.teeName||null,courseRating:tee?.rating?Number(tee.rating):null,slope:tee?.slope?Number(tee.slope):null,tee:tee||null,photos:photos.map(p=>p.src),playedWith,impressionLabel:impression?.label||null,...(targetSubName?{subcourse:targetSubName}:{})});
    return(<Sheet onClose={saveAndClose}><div style={{padding:"8px 20px 40px"}}>
    <div style={{display:"flex",justifyContent:"flex-end",marginBottom:-4}}>
      <button className="pressable" onClick={saveAndClose} aria-label="Save and close" style={{background:"var(--c-surface)",border:"1px solid var(--c-border)",borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:14,color:"var(--c-muted)",display:"flex",alignItems:"center",justifyContent:"center"}}>{"\u2715"}</button>
    </div>
    <div style={{textAlign:"center",marginBottom:28}}>
      <div style={{fontSize:10,fontWeight:700,color:"var(--c-green)",letterSpacing:1.5,textTransform:"uppercase",marginBottom:12}}>Your Score</div>
      <div style={{fontSize:16,fontWeight:600,fontFamily:"var(--font-display)",marginBottom:20,lineHeight:1.2}}>{course.name}{targetSubName?" — "+targetSubName:""}</div>
      <div className="count-up" style={{fontSize:80,fontWeight:300,fontFamily:"var(--font-display)",color:scoreColor(finalScore),lineHeight:1,letterSpacing:-3,marginBottom:18}}>{finalScore.toFixed(1)}</div>
      <div style={{fontSize:14,fontWeight:600,color:scoreColor(finalScore)}}>{scoreLabel(finalScore)}</div>
      {willBeEarly&&<div style={{marginTop:14,display:"flex",justifyContent:"center"}}><EarlyRatingChip/></div>}
      {willBeEarly&&<div style={{marginTop:8,fontSize:11,color:"var(--c-muted)",maxWidth:280,marginLeft:"auto",marginRight:"auto",lineHeight:1.5}}>You've only rated a few courses — this one may shift once your scale is more calibrated. We'll revisit it after you've rated 15.</div>}
      {(()=>{
        /* Confidence: only show after 3+ comparisons. Based on variance of per-comparison scores. */
        if(results.length<3)return null;
        const scores=results.map(r=>r.score||0).filter(Boolean);
        if(!scores.length)return null;
        const mean=scores.reduce((s,x)=>s+x,0)/scores.length;
        const variance=scores.reduce((s,x)=>s+(x-mean)**2,0)/scores.length;
        const stdev=Math.sqrt(variance);
        let label,color,bg;
        if(results.length>=5&&stdev<1.0){label="Confident";color="var(--c-green)";bg="var(--c-green-dim)";}
        else if(stdev<1.5){label="Pretty sure";color="var(--c-green)";bg="var(--c-green-dim)";}
        else{label="Could still shift";color="#b45309";bg="rgba(251,191,36,0.12)";}
        return(<div style={{marginTop:12,display:"inline-flex",alignItems:"center",gap:6,background:bg,border:`1px solid ${color}33`,borderRadius:20,padding:"4px 12px",fontSize:11,fontWeight:700,color}}>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          {label}
        </div>);
      })()}
      <div style={{display:"flex",justifyContent:"center",gap:6,flexWrap:"wrap",marginTop:16}}>
        {results.map(r=>(<div key={r.key} style={{background:"var(--c-surface)",border:"1px solid var(--c-border)",borderRadius:8,padding:"6px 10px",fontSize:11}}>
          <span style={{color:"var(--c-sub)"}}>vs {r.label}</span></div>))}
      </div>
    </div>
    <div style={{height:1,background:"var(--c-border)",marginBottom:20}}/>
    <RoundFields note={note} setNote={setNote} date={date} setDate={setDate} shotScore={shotScore} setShotScore={setShotScore} photos={photos} setPhotos={setPhotos} friends={friends} playedWith={playedWith} setPlayedWith={setPlayedWith} course={course} subName={targetSubName||null} userTees={userTees} tee={tee} setTee={setTee}/>
    <PrimaryBtn onClick={saveAndClose}>Save to My Courses</PrimaryBtn>
  </div></Sheet>);}
  if(!current&&!finishing)return null;

  </div></Sheet>);
}

                          <Avatar name={f.name} initials={f.initials} color={f.color} size={17} photo={f.profilePhoto} photoPos={f.profilePhotoPos}/>
                        </div>
                      ))}
                    </div>
                    <span style={{fontSize:11,color:"var(--c-text)",fontWeight:600}}>{taggedFriends.slice(0,2).map(f=>f.name.split(" ")[0]).join(", ")}{taggedFriends.length>2?` +${taggedFriends.length-2}`:""}</span>
                  </div>}
                  {r.note&&<div style={{fontSize:12,color:"var(--c-sub)",fontStyle:"italic",lineHeight:1.45}}>"{r.note}"</div>}
                </div>);
              })}
            </div>
          }
        </div>
      </Sheet>);
    })()}
  </div>);
}

/* ═══════════════════════════════════════════════════════════
   DISCOVER TAB

/* Scroll position + filter state persisted across navigation. When the user
   filters by a tag/state/country, opens a course, then taps back, they expect
   the same view they left — not a reset Discover. Module-level cache survives
   DiscoverTab unmount/remount as long as the user doesn't switch tabs. */
const DISCOVER_SCROLL={pos:0,returning:false,q:"",tf:null,pf:null,sf:null,cf:null};
function DiscoverTab({statuses,ratings,onSelect,focusSearch,onFocusConsumed,scrollToTopNonce,profile,onRequestCourse,coursePreviews}){
  const isReturning=DISCOVER_SCROLL.returning;
  useEffect(()=>{DISCOVER_SCROLL.returning=false;},[]);
  /* Initialize from the module-level cache so a back-from-detail navigation
     restores whatever filters the user had selected. Each setter mirrors back
     to the cache so the next mount sees the latest values. */
  const[q,setQRaw]=useState(DISCOVER_SCROLL.q||"");
  const[tf,setTfRaw]=useState(DISCOVER_SCROLL.tf||null); // terrain filter
  const[pf,setPfRaw]=useState(DISCOVER_SCROLL.pf||null); // prestige filter
  const[sf,setSfRaw]=useState(DISCOVER_SCROLL.sf||null); // state filter
  const[cf,setCfRaw]=useState(DISCOVER_SCROLL.cf||null); // country filter
  const setQ=(v)=>{DISCOVER_SCROLL.q=typeof v==="function"?v(q):v;setQRaw(DISCOVER_SCROLL.q);};
  const setTf=(v)=>{DISCOVER_SCROLL.tf=typeof v==="function"?v(tf):v;setTfRaw(DISCOVER_SCROLL.tf);};
  const setPf=(v)=>{DISCOVER_SCROLL.pf=typeof v==="function"?v(pf):v;setPfRaw(DISCOVER_SCROLL.pf);};
  const setSf=(v)=>{DISCOVER_SCROLL.sf=typeof v==="function"?v(sf):v;setSfRaw(DISCOVER_SCROLL.sf);};
  const setCf=(v)=>{DISCOVER_SCROLL.cf=typeof v==="function"?v(cf):v;setCfRaw(DISCOVER_SCROLL.cf);};
  const[stateOpen,setStateOpen]=useState(false);
  const[countryOpen,setCountryOpen]=useState(false);
  const scrollRef=useRef(null);const searchRef=useRef(null);
  const PRESTIGE_FILTERS=[
    {key:"pga",label:"PGA Tour",match:c=>!!c.pgaTour},
    {key:"gd100",label:"Top 100 World",match:c=>!!c.gdWorld},
    {key:"major",label:"Major Host",match:c=>c.majors&&c.majors.length>0},
  ];
  const getCountry=c=>c.country||"USA";
  const allCountries=useMemo(()=>{const set=new Set();COURSES.forEach(c=>set.add(getCountry(c)));return Array.from(set).sort();},[]);
  const allStates=useMemo(()=>{const set=new Set();COURSES.forEach(c=>{const co=getCountry(c);if(cf){if(co===cf)c.state&&set.add(c.state);}else{if(co==="USA")c.state&&set.add(c.state);}});return Array.from(set).sort();},[cf]);
  /* A course is considered "fully rated" if it has an overall score and, for sub-course courses, every sub has been played */
  const isFullyRated=(c)=>{const rt=ratings[c.id];if(!rt)return false;
    if(c.subcourses){const played=Object.keys(rt.allSubs||{}).length;return played>=c.subcourses.length;}
    return rt.overall!=null;};
  const list=useMemo(()=>{let r=[...COURSES].sort((a,b)=>a.name.localeCompare(b.name));
    /* Hide fully-rated courses unless the user is actively searching */
    if(!q.trim()&&!sf&&!cf)r=r.filter(c=>!isFullyRated(c));
    if(q.trim()){
      const s=norm(q);
      /* Score each match: 4=name starts with, 3=name contains, 2=city/state, 1=country/tag */
      const scored=r.map(c=>{
        const name=norm(c.name);
        if(name.startsWith(s))return{c,score:4};
        if(name.includes(s))return{c,score:3};
        if(norm(c.city).includes(s)||norm(c.state).includes(s))return{c,score:2};
        if(norm(getCountry(c)).includes(s)||c.tags.some(t=>norm(t).includes(s)))return{c,score:1};
        return null;
      }).filter(Boolean);
      scored.sort((a,b)=>b.score-a.score);
      r=scored.map(x=>x.c);
    }
    if(tf)r=r.filter(c=>c.terrain===tf);
    if(cf)r=r.filter(c=>getCountry(c)===cf);
    if(sf)r=r.filter(c=>c.state===sf);
    if(pf){const f=PRESTIGE_FILTERS.find(x=>x.key===pf);if(f)r=r.filter(f.match);}
    return r;},[q,tf,pf,sf,cf,ratings]);
  useLayoutEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=DISCOVER_SCROLL.pos;},[]);
  useEffect(()=>{const el=scrollRef.current;if(!el)return;const onScroll=()=>{DISCOVER_SCROLL.pos=el.scrollTop;};el.addEventListener("scroll",onScroll,{passive:true});return()=>el.removeEventListener("scroll",onScroll);},[]);
  const prevNonceRef=useRef(scrollToTopNonce);
  /* Tab re-tap = scroll to top AND clear filters (treat as "fresh start").
     Detail-back returns won't trigger this because handleSelect doesn't bump the nonce. */
  useEffect(()=>{

          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>}

    </div>
    <div data-allow-horizontal style={{display:"flex",gap:6,padding:"6px 16px 6px",overflowX:"auto"}}>
      <button className="pressable" onClick={()=>setCountryOpen(true)} style={{
        whiteSpace:"nowrap",padding:"5px 12px",borderRadius:6,border:"1px solid "+(cf?"var(--c-green)":"var(--c-border)"),cursor:"pointer",fontWeight:700,fontSize:10,letterSpacing:0.5,textTransform:"uppercase",fontFamily:"var(--font-body)",
        background:cf?"var(--c-green)":"var(--c-card)",color:cf?"#fff":"var(--c-sub)",display:"flex",alignItems:"center",gap:5,
        transition:"background 200ms var(--ease-out),color 200ms var(--ease-out)"}}>{cf&&flagFor(cf)&&<span style={{fontSize:13,lineHeight:1,letterSpacing:0}}>{flagFor(cf)}</span>}{cf||"Country"}{cf&&<span onClick={e=>{e.stopPropagation();setCf(null);setSf(null);}} style={{fontSize:11,lineHeight:1,opacity:0.9}}>{"\u2715"}</span>}</button>
      <button className="pressable" onClick={()=>setStateOpen(true)} style={{

        background:sf?"var(--c-green)":"var(--c-card)",color:sf?"#fff":"var(--c-sub)",display:"flex",alignItems:"center",gap:4,
        transition:"background 200ms var(--ease-out),color 200ms var(--ease-out)"}}>{sf||"State"}{sf&&<span onClick={e=>{e.stopPropagation();setSf(null);}} style={{fontSize:11,lineHeight:1,opacity:0.9}}>{"\u2715"}</span>}</button>
      {PRESTIGE_FILTERS.map(f=>{const active=pf===f.key;return(<button key={f.key} className="pressable" onClick={()=>setPf(active?null:f.key)} style={{

/* ═══════════════════════════════════════════════════════════
   MY COURSES TAB
═══════════════════════════════════════════════════════════ */
function MyCoursesTab({statuses,ratings,onSelect,subtab,setSubtab,onGoToTab,coursePreviews,friends}){
  const tab=subtab||"played";const setTab=setSubtab||(()=>{});
  const[q,setQ]=useState("");
  const filterBySearch=(arr)=>{if(!q.trim())return arr;const s=norm(q);return arr.filter(c=>norm(c.name).includes(s)||norm(c.city).includes(s)||norm(c.state).includes(s));};
  const playedRaw=COURSES.filter(c=>statuses[c.id]?.play==="played");

  const playedExpanded=[];
  playedRaw.forEach(c=>{
    const r=ratings[c.id];
    if(c.subcourses&&r?.allSubs&&Object.keys(r.allSubs).length){
      Object.entries(r.allSubs).forEach(([subName,sub])=>{
        playedExpanded.push({course:c,subName,score:sub.overall,shotScore:sub.shotScore,playCount:sub.playCount||1,personalBest:sub.personalBest??(sub.shotScore?Number(sub.shotScore):null),isHomeCourse:r.isHomeCourse,isEarly:sub.isEarly||false});
      });
