    {friends.length<3&&(()=>{

      const suggestions=pool.filter(p=>{const k=p.name.toLowerCase();if(seen.has(k))return false;seen.add(k);return!existing.has(k);}).slice(0,3);

              </div>
            ))}

      </div>);
    })()}

    {/* Friend activity peek — top 3 with reactions + comments */}

        return(<ClubhouseActivityCard key={rxKey} item={item} rxKey={rxKey} reactions={reactions} toggleEmoji={toggleEmoji} addComment={addComment} onSelect={onSelect} onViewFriend={onViewFriend} isLast={i===recentActivity.length-1} onOpenLightbox={openLightbox} friends={friends} myUid={profile?.id}/>);

    </div>}
    {/* Permanent footer sign-off — subtle IG follow link at the end of the clubhouse feed */}
    <a href="https://instagram.com/puregolfjournal" target="_blank" rel="noreferrer" className="pressable" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"18px 16px 8px",marginTop:12,color:"var(--c-muted)",textDecoration:"none",fontFamily:"var(--font-body)",fontSize:12,fontWeight:500,borderTop:"1px solid var(--c-border)"}}>

      <span>Follow <span style={{color:"var(--c-sub)",fontWeight:600}}>@puregolfjournal</span></span>

  </div>);

function WelcomeTour({onClose,onDone}){
  const[idx,setIdx]=useState(0);
  const[dragX,setDragX]=useState(0);
  const[animating,setAnimating]=useState(true);
  const[width,setWidth]=useState(0);
  const trackRef=useRef(null);
  const touchRef=useRef({x:0,t:0,active:false});
  useEffect(()=>{const prev=document.body.style.overflow;document.body.style.overflow="hidden";return()=>{document.body.style.overflow=prev;};},[]);
  useEffect(()=>{
    const el=trackRef.current;if(!el)return;
    const update=()=>setWidth(el.getBoundingClientRect().width);
    update();
    const ro=new ResizeObserver(update);ro.observe(el);return()=>ro.disconnect();
  },[]);
  const total=TOUR_SLIDES.length;
  const last=idx===total-1;
  const next=()=>{setAnimating(true);if(last){onDone();}else setIdx(idx+1);};
  const prev=()=>{if(idx>0){setAnimating(true);setIdx(idx-1);}};
  const onTouchStart=e=>{touchRef.current={x:e.touches[0].clientX,t:Date.now(),active:true};setAnimating(false);};
  const onTouchMove=e=>{if(!touchRef.current.active)return;let dx=e.touches[0].clientX-touchRef.current.x;if((idx===0&&dx>0)||(last&&dx<0))dx*=0.3;setDragX(dx);};
  const onTouchEnd=()=>{if(!touchRef.current.active)return;touchRef.current.active=false;setAnimating(true);const dt=Date.now()-touchRef.current.t;const vel=Math.abs(dragX)/Math.max(1,dt);if((Math.abs(dragX)>width*0.25||vel>0.45)){if(dragX<0&&!last)setIdx(idx+1);else if(dragX>0&&idx>0)setIdx(idx-1);}setDragX(0);};
  const renderSlide=(slide,i)=>(
    <div key={i} style={{width,flexShrink:0,padding:"28px 28px 0",display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center"}}>
      {slide.mark&&<div style={{fontSize:110,fontWeight:400,fontFamily:"var(--font-display)",fontStyle:"italic",color:"var(--c-green)",lineHeight:1,marginBottom:18,letterSpacing:-1,paddingRight:10}}>{slide.mark}</div>}
      {slide.wordmark&&<div style={{marginBottom:22,display:"flex",flexDirection:"column",alignItems:"center"}}>
        <div style={{fontSize:58,fontWeight:400,fontFamily:"var(--font-display)",fontStyle:"italic",color:"var(--c-green)",lineHeight:1,letterSpacing:-0.5,paddingRight:6}}>Pure</div>
        <div style={{fontSize:10,color:"var(--c-muted)",marginTop:6,fontWeight:600,letterSpacing:2.4,textTransform:"uppercase",paddingLeft:2.4}}>Golf Journal</div>
      </div>}
      {slide.emoji&&<div style={{fontSize:56,marginBottom:18,lineHeight:1}}>{slide.emoji}</div>}
      <div style={{fontSize:26,fontWeight:500,fontFamily:"var(--font-display)",marginBottom:12,color:"var(--c-text)",letterSpacing:-0.3,lineHeight:1.15}}>{slide.title}</div>
      {slide.body&&<div style={{fontSize:14,color:"var(--c-sub)",lineHeight:1.55,maxWidth:320,marginBottom:slide.tabs||slide.splitCards?18:0}}>{slide.body}</div>}
      {slide.tabs&&<div style={{width:"100%",maxWidth:320,display:"flex",flexDirection:"column",gap:10,marginTop:6}}>
        {slide.tabs.map(t=>(<div key={t.label} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,textAlign:"left"}}>
          <div style={{width:30,height:30,borderRadius:8,background:"var(--c-green-dim)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><TabIcon name={t.icon} active={true}/></div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:13,color:"var(--c-text)"}}>{t.label}</div>
            <div style={{fontSize:11,color:"var(--c-muted)",marginTop:1}}>{t.desc}</div>
          </div>
        </div>))}
      </div>}
      {slide.options&&<div style={{width:"100%",maxWidth:340,display:"flex",flexDirection:"column",gap:10,marginTop:6}}>
        {slide.options.map(o=>(<div key={o.label} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,textAlign:"left"}}>
          <div style={{width:32,height:32,borderRadius:8,background:"var(--c-green-dim)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:17}}>{o.emoji}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:13,color:"var(--c-text)"}}>{o.label}</div>
            <div style={{fontSize:11,color:"var(--c-muted)",marginTop:1,lineHeight:1.4}}>{o.desc}</div>
          </div>
        </div>))}
      </div>}
      {slide.footnote&&<div style={{fontSize:11,color:"var(--c-muted)",lineHeight:1.55,maxWidth:320,marginTop:16,fontStyle:"italic",whiteSpace:"pre-line"}}>{slide.footnote}</div>}
      {slide.splitCards&&<div style={{width:"100%",maxWidth:340,display:"flex",flexDirection:"column",gap:10,marginTop:6}}>
        {slide.splitCards.map(c=>(<div key={c.label} style={{background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,padding:"14px 16px",textAlign:"left"}}>
          <div style={{display:"inline-flex",alignItems:"center",background:c.color==="var(--c-green)"?"var(--c-green-dim)":"var(--c-surface)",color:c.color,border:`1px solid ${c.color==="var(--c-green)"?"var(--c-green-border)":"var(--c-border)"}`,borderRadius:6,padding:"4px 10px",fontWeight:700,fontSize:11,letterSpacing:0.3,fontFamily:"var(--font-body)",marginBottom:8}}>{c.label}</div>
          <div style={{fontSize:13,color:"var(--c-text)",lineHeight:1.5,marginBottom:4}}>{c.desc}</div>
          <div style={{fontSize:11,color:"var(--c-muted)",fontStyle:"italic"}}>{c.note}</div>
        </div>))}
      </div>}
    </div>
  );
  return ReactDOM.createPortal((
    <div style={{position:"fixed",inset:0,background:"var(--c-bg)",zIndex:250,display:"flex",flexDirection:"column",animation:"fadeIn 200ms var(--ease-out)"}}>
      <div style={{padding:"calc(env(safe-area-inset-top, 0px) + 14px) 18px 8px",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
        <button type="button" onClick={prev} style={{background:"none",border:"none",color:idx>0?"var(--c-sub)":"transparent",fontSize:15,fontWeight:500,cursor:idx>0?"pointer":"default",fontFamily:"var(--font-body)",padding:"6px 2px",minWidth:60,textAlign:"left",pointerEvents:idx>0?"auto":"none"}}>Back</button>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {TOUR_SLIDES.map((_,i)=>(<div key={i} style={{width:i===idx?18:6,height:6,borderRadius:3,background:i===idx?"var(--c-green)":"var(--c-border)",transition:"width 220ms var(--ease-out),background 220ms var(--ease-out)"}}/>))}
        </div>
        <button type="button" onClick={onClose} style={{background:"none",border:"none",color:"var(--c-muted)",fontSize:15,fontWeight:500,cursor:"pointer",fontFamily:"var(--font-body)",padding:"6px 2px",minWidth:60,textAlign:"right"}}>Skip</button>
      </div>
      <div ref={trackRef} onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} onTouchCancel={onTouchEnd} style={{flex:1,overflow:"hidden",position:"relative",touchAction:"pan-y"}}>
        {width>0&&<div style={{display:"flex",width:width*total,transform:`translate3d(${-idx*width+dragX}px,0,0)`,transition:animating?"transform 380ms cubic-bezier(0.22,1,0.36,1)":"none",willChange:"transform",height:"100%"}}>
          {TOUR_SLIDES.map(renderSlide)}
        </div>}
      </div>
      <div style={{padding:"16px 22px calc(env(safe-area-inset-bottom, 0px) + 22px)",flexShrink:0}}>
        <button type="button" onClick={next} className="pressable" style={{width:"100%",background:"var(--c-green)",color:"#fff",border:"none",borderRadius:12,padding:"14px",fontWeight:700,fontSize:15,cursor:"pointer",fontFamily:"var(--font-body)"}}>{last?(TOUR_SLIDES[idx].cta||"Get Started"):"Next"}</button>
      </div>
    </div>
  ),document.body);
}

function InstallPrompt(){
  const[show,setShow]=useState(false);
  useEffect(()=>{
    /* Build 3 fix: never show "Add to Home Screen" prompt inside the native
       Capacitor app — the app IS already installed. Was firing in TestFlight
       and confusing testers. */
    if(IS_NATIVE)return;
    const standalone=window.navigator.standalone||window.matchMedia("(display-mode: standalone)").matches;
    if(standalone)return;
    const ua=window.navigator.userAgent;
    const isIOS=/iPhone|iPad|iPod/.test(ua)&&!window.MSStream;
    const isSafari=/Safari/.test(ua)&&!/CriOS|FxiOS/.test(ua);
    if(!(isIOS&&isSafari))return;
    /* Show again every 3 days even if previously dismissed */
    const dismissedAt=Number(localStorage.getItem("pwa-prompt-dismissed-at")||0);
    const THREE_DAYS=3*24*60*60*1000;
    if(dismissedAt&&Date.now()-dismissedAt<THREE_DAYS)return;
    const t=setTimeout(()=>setShow(true),1200);
    return()=>clearTimeout(t);
  },[]);
  const dismiss=()=>{localStorage.setItem("pwa-prompt-dismissed-at",String(Date.now()));setShow(false);};
  if(!show)return null;
  return(<div onClick={dismiss} style={{position:"fixed",left:0,right:0,bottom:"max(env(safe-area-inset-bottom, 0), 16px)",zIndex:200,padding:"0 12px",animation:"fadeUp 320ms var(--ease-out)"}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"var(--c-card)",borderRadius:18,padding:"14px 16px",boxShadow:"0 16px 48px rgba(0,0,0,0.22)",border:"1px solid var(--c-border)",maxWidth:380,margin:"0 auto",display:"flex",alignItems:"center",gap:12}}>
      <div style={{width:40,height:40,borderRadius:10,background:"var(--c-bg)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:"1px solid var(--c-border)",overflow:"hidden"}}>
        <img src="pure-p-icon.png" alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={(e)=>{e.currentTarget.style.display="none";}}/>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:2}}>Add Pure to Home Screen</div>
        <div style={{fontSize:11,color:"var(--c-muted)",lineHeight:1.35,display:"flex",alignItems:"center",flexWrap:"wrap",gap:4}}>
          <span>Tap</span>
          <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:16,height:16,borderRadius:4,background:"var(--c-surface)",color:"var(--c-text)"}}><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></span>
          <span>then "Add to Home Screen"</span>
        </div>
      </div>
      <button onClick={dismiss} aria-label="Dismiss" style={{background:"none",border:"none",color:"var(--c-muted)",cursor:"pointer",padding:4,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>);
}

function App(){
  /* Auth: pre-onboarding gate. Until a Supabase session exists, render LoginScreen.
     Once authenticated, the existing onboarding flow runs to collect the user profile, then writes it to the public.users table. */
  const{session,loading:authLoading}=useAuthSession();
  /* Fade out the pre-React splash once mounted. Animations finish ~1680ms; hold an extra 500ms so the full logo sits on screen before dismissing. */
  useEffect(()=>{
    const splash=document.getElementById("pure-splash");
    if(!splash)return;
    const hold=setTimeout(()=>{
      splash.classList.add("fading");
      const cleanup=setTimeout(()=>{splash.remove();},480);
      splash.dataset.cleanup=cleanup;
    },2200);
    return()=>clearTimeout(hold);
  },[]);
  /* Parse URL params once at mount — used for deep-link into a course + invite-follow */
  const[initialLink]=useState(()=>{
    try{
      const params=new URLSearchParams(window.location.search);
      const cid=Number(params.get("course"));
      const inviteUser=params.get("invite");
      return{courseId:cid&&COURSES.find(c=>c.id===cid)?cid:null,inviteUser:inviteUser||null};
    }catch{return{courseId:null,inviteUser:null};}
  });
  /* (Removed earlier global pointerdown haptic. Haptics are now placed inline at the
     specific call sites that benefit from feedback — see Apple HIG.) */
  const[tab,setTab]=useState("home");
  /* Random home fact — picked once per app session (persists across tab switches) */
  const[sessionRandomFactId]=useState(()=>{
    const ids=Object.keys(HOME_FACTS).map(Number).filter(id=>HOME_FACTS[id]&&HOME_FACTS[id]!==COURSE_FACTS[id]);
    return ids.length?ids[Math.floor(Math.random()*ids.length)]:null;
  });
  const[tabScrollNonce,setTabScrollNonce]=useState(0);
  const mainScrollRef=useRef(null);
  const handleTabClick=(key)=>{
    if(key===tab){
      if(mainScrollRef.current)mainScrollRef.current.scrollTo({top:0,behavior:"smooth"});
      setTabScrollNonce(n=>n+1);
    }else{
      setTab(key);
      /* Analytics: tab switches show feature discovery patterns. Are users finding
         Friends? Discover? The breakdown across our user base tells us which tabs
         deserve more emphasis or onboarding hints. */
      trackEvent("tab_switch",{from:tab,to:key});
    }
  };
  const[course,setCourse]=useState(null);
  /* Deep-link: open the requested course once profile is set up */
  useEffect(()=>{
    if(initialLink.courseId){
      const target=COURSES.find(c=>c.id===initialLink.courseId);
      if(target)setCourse(target);
      /* Clean URL so reload doesn't re-open */
      try{window.history.replaceState({},"",window.location.pathname);}catch{}
    }
  },[]);
  const[statuses,setStatuses]=useState({});
  const[ratings,setRatings]=useState({});
  const[friends,setFriends]=useState([]);  // populated from Supabase friendships on hydration
  const[followers,setFollowers]=useState([]);  // people who follow me — drives "follows you" badge
  const[viewFriend,setViewFriend]=useState(null);
  const[navStack,setNavStack]=useState([]);
  const[profile,setProfile]=useState(null); // {name,homeCourseId,homeRating}
  const[hydrated,setHydrated]=useState(false);  // true after the initial Supabase load completes
  /* Becomes true once the SECONDARY hydration wave (imported_rounds, friends, etc.)
     has resolved. Effects that watch ghinRounds (handicap toast) need to know when the
     post-launch population settles — without this, they'd misfire on the 0 → N jump. */
  const[secondaryHydrated,setSecondaryHydrated]=useState(false);
  /* Hydrate ALL user data from Supabase when the auth session lands:
     profile (users), ratings, statuses, imported_rounds, user_tees, reactions.
     Reconstructs the React state shape (snake_case → camelCase, rows → keyed maps). */
  useEffect(()=>{
    if(!session){setProfile(null);setHydrated(false);return;}
    let cancelled=false;
    (async()=>{
      const uid=session.user.id;
      const[u,rs,sts]=await Promise.all([
        supabase.from("users").select("*").eq("id",uid).maybeSingle(),
        supabase.from("ratings").select("*").eq("user_id",uid),
        supabase.from("statuses").select("*").eq("user_id",uid),
      ]);
      if(cancelled)return;
      /* Kick off the secondary wave in the background — its setState calls happen later
         and won't block setHydrated(true). All have null defaults so the UI renders
         empty-but-functional friend lists/activity until they fill in. */
      const secondary=Promise.all([
        supabase.from("imported_rounds").select("*").eq("user_id",uid),
        supabase.from("user_tees").select("*").eq("user_id",uid),
        supabase.from("reactions").select("*").or(`user_id.eq.${uid},target_user_id.eq.${uid}`),
        dbLoadFollowing(uid),
        dbLoadFollowers(uid),
        dbLoadFolloweeActivity(uid),
        dbLoadNotifications(uid),
      ]);
      /* Stub fields the main flow consumes — populate from secondary when it resolves. */
      const ir={data:[]},ut={data:[]},rx={data:[]},fol={rows:[]},flw={rows:[]},act={rows:[]},notes={rows:[]};
      secondary.then(([_ir,_ut,_rx,_fol,_flw,_act,_notes])=>{
        if(cancelled)return;
        const irData=_ir.data||[];
        const utData=_ut.data||[];
        const rxData=_rx.data||[];
        const folRows=(_fol&&_fol.rows)||[];
        const flwRows=(_flw&&_flw.rows)||[];
        const actRows=(_act&&_act.rows)||[];
        const noteRows=(_notes&&_notes.rows)||[];
        /* Imported rounds → onto profile.ghinRounds */
        const importedRounds=irData.map(row=>({score:row.score,holes:row.holes,courseRating:row.course_rating,slope:row.slope,teeName:row.tee_name,subName:row.sub_name,date:row.date,courseName:row.course_name,courseId:row.course_id,source:row.source,photos:row.photos||[],note:row.note||null,playedWith:row.played_with||[]}));
        const userTeesMap={};
        /* Build 3: keys are now composite (course_id + ":" + sub_name) for
           sub-course rows, plain course_id for main-course rows. TeePicker
           reads from both keys with main-course fallback. */
        utData.forEach(row=>{
          const t={name:row.tee_name,rating:Number(row.course_rating),slope:row.slope};
          const key=row.sub_name?row.course_id+":"+row.sub_name:String(row.course_id);
          userTeesMap[key]=[...(userTeesMap[key]||[]),t];
        });
        setProfile(p=>p?{...p,ghinRounds:importedRounds,userTees:userTeesMap}:p);
        const reactionsMap={};
        rxData.forEach(row=>{const key=`${row.target_user_id}-${row.course_id}`;const entry=reactionsMap[key]||{emojis:[],comments:[]};const display=row.emoji||row.text;if(display)entry.comments=[...entry.comments,{id:row.id,text:display,emoji:row.emoji||null,reactorId:row.user_id,date:row.created_at}];reactionsMap[key]=entry;});
        setReactions(reactionsMap);
        setFriends(folRows);
        setFollowers(flwRows);
        const activityList=actRows.map(it=>{const course=COURSES.find(c=>c.id===it.courseId);if(!course)return null;return{friend:it.friend,course,rating:it.rating,date:it.rating.date||it.createdAt};}).filter(Boolean);
        setActivity(activityList);
        setNotifications(noteRows);
        /* Mark secondary done so handicap-toast effect can stop suppressing itself. */
        setSecondaryHydrated(true);
        /* Build 3: load global course aggregates so CourseDetail can show
           "Avg Rating" across all users, not just friends+self. Small payload
           (one row per course that has any ratings) so a single un-paginated
           fetch is fine for v1. */
        supabase.from("course_aggregates").select("course_id,avg_rating,rating_count").then(({data,error})=>{
          if(cancelled||error)return;
          const map={};
          (data||[]).forEach(row=>{map[row.course_id]={avg:Number(row.avg_rating),count:row.rating_count};});
          setCourseAggregates(map);
        });
        /* Tertiary wave: eager-load friend ratings + statuses so Friends list,
           Course detail Friends tab, Top 5 friend overlap, and bucket-list signals
           all populate without per-friend on-demand loads. RLS auto-filters by
           privacy + follow graph. Fail-soft: ignore errors, friends will fall back
           to lazy-load via FriendProfile if they tap into one. */
        const followeeIds=folRows.map(f=>f.id).filter(Boolean);
        if(followeeIds.length){
          dbLoadAllFriendsData(followeeIds).then(({ratingsByUser,statusesByUser})=>{
            if(cancelled)return;
            setFriends(prev=>prev.map(f=>{
              const r=ratingsByUser[f.id]||{};
              const s=statusesByUser[f.id]||{played:[],want:[],wantSubs:{}};
              return{...f,ratings:r,played:s.played,want:s.want,wantSubs:s.wantSubs};
            }));
          }).catch(e=>console.warn("friend data eager-load failed:",e?.message||e));
        }
      }).catch(e=>{console.warn("secondary hydrate failed:",e?.message||e);setSecondaryHydrated(true);});
      if(u.error)console.warn("users fetch failed:",u.error.message);
      if(rs.error)console.warn("ratings fetch failed:",rs.error.message);
      if(sts.error)console.warn("statuses fetch failed:",sts.error.message);
      /* Profile */
      let nextProfile=null;
      if(u.data){
        nextProfile={
          id:u.data.id,
          name:u.data.name,
          username:u.data.username,
          email:u.data.email,
          homeCourseId:u.data.home_course_id,
          homeArea:u.data.home_area||null,
          profilePhoto:u.data.profile_photo_url,
          profilePhotoPos:u.data.profile_photo_pos,
          welcomeTourSeen:u.data.welcome_tour_seen,
          selfReportedHandicap:u.data.self_reported_handicap,
          selfReportedAt:u.data.self_reported_at,
          isTestUser:u.data.is_test_user,
          /* Privacy settings — hydrated from DB. Defaults match DB defaults. */
          hideRatings:u.data.hide_ratings||"off",
          hideShots:!!u.data.hide_shots,
          privateProfile:!!u.data.private_profile,
          /* Refine flow state persisted across sessions (per build 3) */
          refineState:u.data.refine_state||null,
          followers:[],following:[],
          /* ghinRounds + userTees fill in when secondary load resolves */
          ghinRounds:[],
          userTees:{},
        };
      }
      /* Ratings → group by course_id, fold sub_name rows into allSubs */
      const ratingsMap={};
      (rs.data||[]).forEach(row=>{
        const r={
          overall:Number(row.overall),
          review:row.review||"",
          date:row.date||null,
          shotScore:row.shot_score,
          personalBest:row.personal_best,
          isHomeCourse:!!row.is_home_course,
          isEarly:!!row.is_early,
          firstImpression:!!row.first_impression,
          impressionLabel:row.impression_label,
          teeName:row.tee_name,
          courseRating:row.course_rating,
          slope:row.slope,
          tee:row.tee,
          playedWith:row.played_with||[],
          photos:row.photos||[],
          comparisons:row.comparisons||[],
          history:row.history||[],
        };
        if(row.sub_name){
          const existing=ratingsMap[row.course_id]||{allSubs:{}};
          existing.allSubs={...(existing.allSubs||{}),[row.sub_name]:r};
          const subVals=Object.values(existing.allSubs);
          existing.overall=Math.round((subVals.reduce((s,x)=>s+x.overall,0)/subVals.length)*10)/10;
          ratingsMap[row.course_id]=existing;
        }else{
          ratingsMap[row.course_id]={...r,...(ratingsMap[row.course_id]?.allSubs?{allSubs:ratingsMap[row.course_id].allSubs}:{})};
        }
      });
      /* Statuses → keyed by course_id */
      const statusesMap={};
      (sts.data||[]).forEach(row=>{
        statusesMap[row.course_id]={play:row.play,wantSubs:row.want_subs||[]};
      });
      setProfile(nextProfile);
      /* Non-overwriting guard: if either query errored, DON'T wipe in-memory state.
         The "data disappeared after sign-in" bug was caused by this exact code path —
         a transient RLS/network race returned an error, ratingsMap stayed empty,
         setRatings({}) wiped everything. Now we only overwrite on confirmed success. */
      if(!rs.error)setRatings(ratingsMap);
      else{
        console.warn("[hydrate] ratings fetch failed, keeping cached state:",rs.error?.message);
        /* Retry once with a short delay; if it fails again, surface a toast. */
        setTimeout(async()=>{
          if(cancelled)return;
          const retry=await supabase.from("ratings").select("*").eq("user_id",uid);
          if(cancelled||retry.error)return;
          const retryMap={};
          (retry.data||[]).forEach(row=>{
            const r={overall:Number(row.overall),review:row.review||"",date:row.date||null,shotScore:row.shot_score,personalBest:row.personal_best,isHomeCourse:!!row.is_home_course,isEarly:!!row.is_early,firstImpression:!!row.first_impression,impressionLabel:row.impression_label,teeName:row.tee_name,courseRating:row.course_rating,slope:row.slope,tee:row.tee,playedWith:row.played_with||[],photos:row.photos||[],comparisons:row.comparisons||[],history:row.history||[]};
            if(row.sub_name){
              const ex=retryMap[row.course_id]||{allSubs:{}};
              ex.allSubs={...(ex.allSubs||{}),[row.sub_name]:r};
              const subVals=Object.values(ex.allSubs);
              ex.overall=Math.round((subVals.reduce((s,x)=>s+x.overall,0)/subVals.length)*10)/10;
              retryMap[row.course_id]=ex;
            }else retryMap[row.course_id]={...r,...(retryMap[row.course_id]?.allSubs?{allSubs:retryMap[row.course_id].allSubs}:{})};
          });
          setRatings(retryMap);
        },1500);
      }
      if(!sts.error)setStatuses(statusesMap);
      else console.warn("[hydrate] statuses fetch failed, keeping cached state:",sts.error?.message);
      setHydrated(true);
    })();
    return()=>{cancelled=true;};
  },[session?.user?.id]);

  /* Realtime — subscribes to four channels while we have a session:
       • notifications (recipient-side only via RLS) → drives bell badge live
       • reactions (target-side via RLS) → live emojis/comments on your ratings
       • friendships → live "follows you" badge updates and follower count
       • ratings → if a followee posts a rating, prepend to the activity feed
     We resolve the rating's author profile lazily (single-row users fetch) so the
     activity card has avatar/name without a second round-trip in the trigger payload. */
  useEffect(()=>{
    if(!session?.user?.id)return;
    const uid=session.user.id;
    const channels=[];
    /* `cancelled` guards async callbacks from updating state after the effect's cleanup
       has fired (sign-out, account switch). Without this, a pending users-fetch could
       resolve and call setNotifications on an unmounted component. */
    let cancelled=false;

    /* Notifications inserts → prepend to inbox + bump bell badge */
    channels.push(supabase.channel("rt-notifications-"+uid)
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:`user_id=eq.${uid}`},async payload=>{
        const row=payload.new;
        let actor=null;
        if(row.actor_id){
          const{data}=await supabase.from("users").select("id,username,name,profile_photo_url,profile_photo_pos").eq("id",row.actor_id).maybeSingle();
          if(cancelled)return;
          actor=data||null;
        }
        if(cancelled)return;
        setNotifications(prev=>[{...row,actor},...prev.filter(n=>n.id!==row.id)].slice(0,100));
      })
      .subscribe());

    /* Reactions on my ratings → append to the matching reactions bucket. The dedupe
       trick: the realtime push and the optimistic insert can both arrive. We dedupe
       by id (server) and by display+reactorId+pending (temp), and replace any pending
       temp rows with the canonical server row. */
    channels.push(supabase.channel("rt-reactions-"+uid)
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"reactions",filter:`target_user_id=eq.${uid}`},payload=>{
        if(cancelled)return;
        const row=payload.new;
        const key=`${row.target_user_id}-${row.course_id}`;
        const display=row.emoji||row.text;
        if(!display)return;
        setReactions(r=>{
          const cur=r[key]||{emojis:[],comments:[]};
          /* Server id already present → no-op */
          if((cur.comments||[]).some(c=>c.id===row.id))return r;
          /* Drop any pending temp rows that match this server row (same reactor, same
             display value, both emoji-shape vs comment-shape). This collapses optimistic
             + realtime pairs into one canonical entry. */
          const isEmoji=!!row.emoji;
          const cleaned=(cur.comments||[]).filter(c=>{
            if(!c.pending)return true;
            if(c.reactorId!==row.user_id)return true;
            const cIsEmoji=!!c.emoji;
            if(cIsEmoji!==isEmoji)return true;
            return c.text!==display;
          });
          return{...r,[key]:{...cur,comments:[...cleaned,{id:row.id,text:display,emoji:row.emoji||null,reactorId:row.user_id,date:row.created_at}]}};
        });
      })
      .subscribe());

    /* Friendships INSERT/DELETE where I'm involved → keep follower/following lists fresh */
    channels.push(supabase.channel("rt-friendships-"+uid)
      .on("postgres_changes",{event:"*",schema:"public",table:"friendships"},async payload=>{
        const r=payload.new||payload.old;
        if(!r)return;
        if(r.followee_id===uid){
          const flw=await dbLoadFollowers(uid);
          if(cancelled)return;
          /* Skip on error so a flaky realtime refresh doesn't blank the followers list. */
          if(!flw._error)setFollowers(flw.rows||[]);
        }
        if(r.follower_id===uid){
          const fol=await dbLoadFollowing(uid);
          if(cancelled)return;
          if(!fol._error)setFriends(fol.rows||[]);
        }
      })
      .subscribe());

    /* New ratings from followees → prepend to activity. RLS pre-filters to people I follow. */
    channels.push(supabase.channel("rt-ratings-followees")
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"ratings"},async payload=>{
        const row=payload.new;
        if(!row||row.user_id===uid)return;
        /* Invalidate the friend-profile cache so opening their profile after this push
           re-fetches fresh ratings instead of showing the stale snapshot from before
           they posted. The cache is per-session window-level state populated lazily by
           FriendProfile; deleting the entry forces dbLoadFriendDetails to refetch on
           next mount. Wrapped in try/catch — never let analytics-style cleanup fail
           the realtime handler. */
        try{if(window.__friendDetailsCache)delete window.__friendDetailsCache[row.user_id];}catch{}
        const{data}=await supabase.from("users").select("id,username,name,profile_photo_url,profile_photo_pos").eq("id",row.user_id).maybeSingle();
        if(cancelled)return;
        if(!data)return;
        const course=COURSES.find(c=>c.id===row.course_id);
        if(!course)return;
        const friend=_userToFriend(data);
        const item={
          friend,course,
          rating:{
            overall:Number(row.overall),review:row.review||"",date:row.date||null,
            shotScore:row.shot_score,photos:row.photos||[],
            playedWith:row.played_with||[],isHomeCourse:!!row.is_home_course,
          },
          date:row.date||row.created_at,
        };
        /* Build 5: dedup before prepending — realtime reconnect resends recent
           events, which previously created duplicate activity cards. Match on
           friend_id + course_id + date + subName (rating identity). */
        setActivity(prev=>{
          const itemSub=item.rating?.allSubs?Object.keys(item.rating.allSubs)[0]:null;
          const exists=prev.some(p=>{
            const pSub=p.rating?.allSubs?Object.keys(p.rating.allSubs)[0]:null;
            return p.friend?.id===item.friend?.id&&p.course?.id===item.course?.id&&p.date===item.date&&pSub===itemSub;
          });
          if(exists)return prev;
          return[item,...prev].slice(0,100);
        });
      })
      .subscribe());

    return()=>{
      cancelled=true;
      channels.forEach(ch=>{try{supabase.removeChannel(ch);}catch{}});
    };
  },[session?.user?.id]);

  /* Push notifications — register the device's APNs token with Supabase so the edge
     function can fan-out push when notifications get inserted. Only runs on native iOS
     (Capacitor); web sessions skip this entirely. Token can change between launches
     (especially after iOS reinstall), so re-register on every session establishment. */
  useEffect(()=>{
    if(!session?.user?.id)return;
    if(!IS_NATIVE)return;
    const Push=window.Capacitor?.Plugins?.PushNotifications;
    if(!Push)return;
    let removed=false;
    let listeners=[];
    (async()=>{
      try{
        const perm=await Push.checkPermissions();
        let granted=perm?.receive==="granted";
        if(!granted){
          const req=await Push.requestPermissions();
          granted=req?.receive==="granted";
        }
        if(!granted||removed)return;
        /* CRITICAL: attach listeners BEFORE calling register(). The "registration" event
           can fire synchronously inside register() — if listener attached after, we miss it. */
        listeners.push(await Push.addListener("registration",async tok=>{
          if(removed)return;
          /* Stash the token globally so handleSignOut + handleResetAccount can
             revoke it from device_tokens before tearing down the session. */
          try{window.__purePushToken=tok?.value||null;}catch{}
          await dbRegisterDeviceToken(tok?.value,"ios");
        }));
        listeners.push(await Push.addListener("registrationError",err=>{
          console.warn("[push] registration error:",err);
        }));
        listeners.push(await Push.addListener("pushNotificationActionPerformed",ev=>{
          /* User tapped a push from lockscreen — open the inbox + clear app badge. */
          if(removed)return;
          setShowNotifications(true);
          try{
            if(Push.removeAllDeliveredNotifications)Push.removeAllDeliveredNotifications();
            if(Push.setBadgeCount)Push.setBadgeCount({count:0});
          }catch{}
        }));
        await Push.register();
        /* Build 5: when the app foregrounds, clear the iOS app badge so the
           user doesn't see a stale red dot for notifications they've already
           seen in-app. Also refresh the Supabase session — backgrounding
           >70 min can leave a stale JWT that fails the first request. */
        try{
          const App=window.Capacitor?.Plugins?.App;
          if(App?.addListener){
            const stateHandle=await App.addListener("appStateChange",async({isActive})=>{
              if(!isActive||removed)return;
              try{
                if(Push.removeAllDeliveredNotifications)await Push.removeAllDeliveredNotifications();
                if(Push.setBadgeCount)await Push.setBadgeCount({count:0});
              }catch{}
              try{await supabase.auth.refreshSession();}catch{}
            });
            listeners.push(stateHandle);
          }
        }catch(e){console.warn("appStateChange wiring failed:",e?.message||e);}
      }catch(e){console.warn("Push setup failed:",e?.message||e);}
    })();
    return()=>{
      removed=true;
      listeners.forEach(l=>{try{l.remove&&l.remove();}catch{}});
    };
  },[session?.user?.id]);
  /* User-chosen hero photo overrides per course. Persisted to localStorage rather than
     Supabase since they're per-device aesthetic preferences (no real value syncing across
     devices) and avoiding the round-trip keeps the UI snappy. Keyed by Supabase user_id so
     resetting / switching accounts doesn't cross-contaminate. */
  const previewsStorageKey=session?.user?.id?`pure-course-previews-${session.user.id}`:null;

  const handleSignOut=async()=>{

       persists across the React tree teardown until reload completes. */
    try{delete window.__friendDetailsCache;}catch{}

    try{

      if(tok){await supabase.from("device_tokens").delete().eq("token",tok);}

     self_reported_handicap) so onboarding-style flows can run again. */
  const handleResetAccount=async()=>{
    if(!session?.user?.id)return;
    const uid=session.user.id;
    const ok=window.confirm("This will delete ALL your ratings, rounds, bucket list, and saved tees. Your account stays. Continue?");
    if(!ok)return;
    /* Second confirm — Pure had no recoverable backup of these rows, so we double-prompt
       to prevent accidental taps from wiping months of journal entries. */
    const reallyOk=window.confirm("Are you sure? This can't be undone.");
    if(!reallyOk)return;

       if anything failed. Otherwise the user thinks data is gone when it isn't.
       Also revoke this device's push token so future pushes don't go to the
       just-reset account if the user later signs in as someone else. */
    try{
      const tok=window.__purePushToken;
      if(tok)await supabase.from("device_tokens").delete().eq("token",tok);
    }catch{}

      supabase.from("ratings").delete().eq("user_id",uid),
      supabase.from("imported_rounds").delete().eq("user_id",uid),
      supabase.from("statuses").delete().eq("user_id",uid),
      supabase.from("user_tees").delete().eq("user_id",uid),
      supabase.from("reactions").delete().eq("user_id",uid),
      supabase.from("course_requests").delete().eq("user_id",uid),
    ]);
    const failed=results.filter(r=>r.error);
    if(failed.length){
      _dbFail("reset deletes",failed[0].error);
      window.alert("Couldn't fully reset your data — some items may still be there. Check your connection and try again.");
      return;
    }

      home_course_id:null,
      self_reported_handicap:null,
      self_reported_at:null,
      welcome_tour_seen:false,
    }).eq("id",uid);

      _dbFail("reset profile update",profErr);
      window.alert("Your data was deleted but we couldn't reset your profile. Try signing out and back in.");
      return;

    try{localStorage.removeItem(`pure-course-previews-${uid}`);}catch{}

  /* Set home course from Settings. If the user hasn't rated this course yet, open the

  const handleSetHomeCourse=(id)=>{
    setProfile(p=>p?{...p,homeCourseId:id}:p);
    dbWriteProfileFields({homeCourseId:id});
    if(!ratings[id])setPendingHomeRate(id);
  };
  const handleRequestCourse=(name,opts={})=>{
    const clean=(name||"").trim();if(!clean)return;
    setPendingRequests(prev=>prev.some(r=>norm(r.courseName||"")===norm(clean))?prev:[...prev,{courseName:clean,date:new Date().toISOString().split("T")[0],source:opts.source||null,_pendingDb:!profile}]);

       course_requests insert would fail with a foreign-key violation. Defer it —
       handleOnboardingComplete flushes pending requests after the users row insert. */
    if(profile){

         from (onboarding home picker, scores-row unmatched, future Discover empty state) so
         admins can prioritize courses with strong intent signals (home-course requests). */
      dbWriteCourseRequest({courseName:clean,source:opts.source||null});

    setTimeout(()=>setRequestToast(null),3200);
  };

  const setStatus=async(id,play,extras)=>{
    /* Snapshot current values for rollback if Supabase write fails. The dbWrite
       already surfaces a toast via _dbFail → "pure-db-error" event, so the user
       sees an error message; here we just make sure local state reflects that
       the mutation didn't actually take. */
    const prevStatus=statuses[id];
    const prevRating=ratings[id];
    let nextWantSubs=null;
    setStatuses(s=>{
      const next={...s[id],play};
      if(extras&&extras.wantSubs)next.wantSubs=extras.wantSubs;
      if(play!=="want")delete next.wantSubs;
      nextWantSubs=next.wantSubs||null;
      return{...s,[id]:next};
    });
    if(play==="none"){
      setRatings(p=>{const n={...p};delete n[id];return n;});
    }
    const okStatus=await dbWriteStatus(id,play,nextWantSubs);
    if(!okStatus){
      /* Rollback */
      setStatuses(s=>{const n={...s};if(prevStatus===undefined)delete n[id];else n[id]=prevStatus;return n;});
      if(play==="none"&&prevRating!==undefined)setRatings(p=>({...p,[id]:prevRating}));
      return;
    }
    if(play==="none"){
      const okDelete=await dbDeleteRating(id);
      if(!okDelete&&prevRating!==undefined)setRatings(p=>({...p,[id]:prevRating}));
    }
  };
  const saveRating=async(id,r,opts={})=>{
    const isRefine=!!opts.refine;
    /* Strong success haptic the moment a rating is committed — the most important
       moment in the app. iOS HIG calls this a "notification success" pattern. */
    tapSuccess();
    /* Snapshot for rollback. Without this, a network failure leaves the UI showing
       a saved rating that doesn't exist on the server. */
    const prevRatings=ratings;
    const prevStatuses=statuses;
    /* Unit count BEFORE this save decides if it's among the first 7 (build 5
       widened from 5 to 7 — calibration takes more samples than the original
       baseline thought; refine prompt at 15 still fires on these). */
    const prevUnitsCount=getRatedUnits(ratings).length;
    const isEarly=!isRefine&&prevUnitsCount>=3&&prevUnitsCount<=6;
    /* Analytics: capture the milestone the first time the user rates anything. Helps
       us see funnel dropoff between signup and first rating during TestFlight. */
    if(!isRefine&&prevUnitsCount===0)trackEvent("first_rating",{courseId:id});
    /* Compute the enriched rating outside the setter so we can also persist it */
    const existing=ratings[id];
    let enrichedSub=null;       // for multi-course saves
    let enrichedTopLevel=null;  // for single-course saves
    if(r.subcourse){
      const prevSubs=existing?.allSubs||{};
      const prevSub=prevSubs[r.subcourse];
      const subPlayCount=(prevSub?.playCount||(prevSub?1:0))+1;
      const shotNum=r.shotScore?Number(r.shotScore):null;
      const prevBest=prevSub?.personalBest??(prevSub?.shotScore?Number(prevSub.shotScore):null);
      const personalBest=shotNum!=null?(prevBest!=null?Math.min(prevBest,shotNum):shotNum):prevBest;
      const prevHistory=prevSub?.history||[];
      const historyEntry=prevSub?{score:prevSub.overall,date:prevSub.date,shotScore:prevSub.shotScore,...(isRefine?{label:"Initial anchor"}:{})}:null;
      const history=historyEntry?[...prevHistory,historyEntry]:prevHistory;
      enrichedSub={...r,playCount:subPlayCount,personalBest,history,prevScore:prevSub?prevSub.overall:null,isEarly:isRefine?false:(isEarly||prevSub?.isEarly||false)};
    }else{
      const playCount=(existing?.playCount||(existing?1:0))+1;
      const shotNum=r.shotScore?Number(r.shotScore):null;
      const prevBest=existing?.personalBest??(existing?.shotScore?Number(existing.shotScore):null);
      const personalBest=shotNum!=null?(prevBest!=null?Math.min(prevBest,shotNum):shotNum):prevBest;
      const prevHistory=existing?.history||[];
      const historyEntry=existing?{score:existing.overall,date:existing.date,shotScore:existing.shotScore,...(isRefine?{label:"Initial anchor"}:{})}:null;
      const history=historyEntry?[...prevHistory,historyEntry]:prevHistory;
      enrichedTopLevel={...r,playCount,personalBest,history,prevScore:existing?existing.overall:null,isEarly:isRefine?false:(isEarly||existing?.isEarly||false)};
    }
    setRatings(p=>{
      if(r.subcourse){
        const prevSubs=p[id]?.allSubs||{};
        const allSubs={...prevSubs,[r.subcourse]:enrichedSub};
        const subVals=Object.values(allSubs);
        const avg=subVals.reduce((s,x)=>s+x.overall,0)/subVals.length;
        const existingPlayCount=p[id]?.playCount||0;
        return{...p,[id]:{...r,playCount:Math.max(existingPlayCount,enrichedSub.playCount),overall:Math.round(avg*10)/10,allSubs}};
      }
      /* CRITICAL: when this course already has sub-course ratings, preserve them
         on the new top-level write. Without this, rating the parent course of a
         multi-course property (Bethpage, Bandon, Pinehurst) wipes all per-sub
         ratings from local state until the next reload. */
      const existingAllSubs=p[id]?.allSubs;
      return{...p,[id]:existingAllSubs?{...enrichedTopLevel,allSubs:existingAllSubs}:enrichedTopLevel};
    });

       Both writes awaited so we can roll back local state if either fails. _dbFail
       already surfaces a toast to the user via the pure-db-error event. */
    setStatuses(s=>({...s,[id]:{...s[id],play:"played"}}));

     Snapshots use spread clones so a later state mutation can't poison the rollback.

  const _pendingFollowOps=useRef(new Set());

    if(!f?.id)return;

    if(!f?.id)return;

  const handleOnboardingComplete=async({name,username,email,homeCourseId,homeArea,homeRating,homeBest,homePhotos,profilePhoto,profilePhotoPos})=>{
    /* Auth-canonical email overrides whatever was typed in onboarding (which may be empty now that we collect email at sign-up). */
    const authEmail=session?.user?.email||email||"";
    /* Persist the user's profile row.
       - First-time signup (no existing profile) → INSERT a fresh row

    if(session?.user?.id){

      const writePayload=(includeHomeArea)=>{

      }

        return;
      }
    }

       took (home course, area, or skipped both) for cohort comparison. */
    trackEvent("onboarding_complete",{

       requests in this session don't double-write. */
    setPendingRequests(prev=>{
      prev.forEach(r=>{if(r._pendingDb)dbWriteCourseRequest({courseName:r.courseName,source:r.source||null});});
      return prev.map(r=>r._pendingDb?{...r,_pendingDb:false}:r);
    });
    /* Save the home course as the anchor rating — only if the user chose one */
    if(homeCourseId&&homeRating!=null){
      const today=new Date().toISOString().split("T")[0];
      const homeRatingObj={overall:homeRating,comparisons:[],review:"",date:today,shotScore:homeBest||null,personalBest:homeBest?Number(homeBest):null,playCount:1,photos:homePhotos||[],firstImpression:true,isHomeCourse:true};

    if(initialLink.inviteUser){

      try{
        const{data}=await supabase.from("users").select("id,username,name,profile_photo_url,profile_photo_pos").eq("username",inv).maybeSingle();
        if(data&&data.id!==session?.user?.id){

  };

  /* Track keyboard visibility + height on native iOS. Must live BEFORE the auth-gate

     timing UIKit uses internally (~250ms ease-out). The result: the keyboard's own
     white backing animates IN over our cream layer that's transitioning to white at
     the same moment, so the user sees one unified color shift instead of two slightly-
     offset animations. */
  const[keyboardOpen,setKeyboardOpen]=useState(false);

          setKeyboardHeight(e?.keyboardHeight||0);

           still-animating keyboard for ~250ms, which looks like a flash. */
        subs.push(await Keyboard.addListener("keyboardDidHide",()=>{
          setKeyboardOpen(false);
          setKeyboardHeight(0);
        }));
      }catch{}
    })();

  },[]);

  /* AUTH GATE — waiting for Supabase to verify session, then either show
     LoginScreen (no session), Onboarding (session but no profile row yet),
     or the main app (session + profile loaded).
     We treat authLoading the same as !hydrated visually — both render the branded
     loader. Returning null during authLoading caused users to land on a blank cream
     screen if getSession() took longer than the HTML splash hold. */
  if(authLoading)return null;

  if(!hydrated)return(
    <div style={{width:"100%",height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"var(--c-bg)",fontFamily:"var(--font-body)"}}>
      <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontStyle:"italic",fontWeight:400,fontSize:64,color:"var(--c-green)",lineHeight:1,letterSpacing:-0.5,paddingRight:6}}>Pure</div>
      <div style={{fontSize:11,color:"var(--c-muted)",marginTop:8,fontWeight:600,letterSpacing:2.6,textTransform:"uppercase"}}>Golf Journal</div>
      <div style={{marginTop:32,width:24,height:24,borderRadius:"50%",border:"2.5px solid var(--c-border)",borderTopColor:"var(--c-green)",animation:"spin 800ms linear infinite"}}/>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>

  if(!profile){

        </div>

      </div>);

  /* Two separate flags: header (Pure logo + bell) stays visible while typing so the

  const showHeader=!course&&!viewFriend&&!showSettings;

  return(
    <div style={{width:"100%",height:"100vh",display:"flex",flexDirection:"column",fontFamily:"var(--font-body)",overflow:"hidden",background:"var(--c-bg)",position:"relative"}}>
      {showHeader&&<div style={{padding:"calc(env(safe-area-inset-top, 0px) + 16px) 18px 10px",flexShrink:0,position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:32,fontWeight:400,fontFamily:"var(--font-display)",fontStyle:"italic",lineHeight:1,color:"var(--c-green)",letterSpacing:-0.3}}>Pure</div>
          <div style={{fontSize:10,color:"var(--c-muted)",marginTop:4,fontWeight:600,letterSpacing:2,textTransform:"uppercase"}}>Golf Journal</div>
        </div>

        }} onClose={()=>setPendingHomeRate(null)}/>;

          <div onClick={e=>e.stopPropagation()} style={{background:"var(--c-bg)",borderRadius:"20px 20px 0 0",padding:"22px 20px calc(env(safe-area-inset-bottom, 0px) + 26px)",maxWidth:440,width:"100%",maxHeight:"calc(100dvh - env(safe-area-inset-top, 0px) - 80px)",overflowY:"auto",overscrollBehavior:"contain",touchAction:"pan-y",animation:batchClosing?"slideDown 260ms var(--ease-out) both":"slideUp 300ms var(--ease-out)"}}>
            <div style={{width:40,height:4,background:"var(--c-border)",borderRadius:2,margin:"0 auto 14px"}}/>

            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>

      {handicapOpen&&ReactDOM.createPortal((
        <div onClick={closeHandicapModal} style={{position:"fixed",inset:0,background:"rgba(28,25,23,0.72)",zIndex:180,display:"flex",alignItems:"flex-start",justifyContent:"center",animation:handicapClosing?"fadeOut 200ms var(--ease-out) both":"fadeIn 200ms var(--ease-out)"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"var(--c-bg)",borderRadius:18,padding:"22px 20px 20px",maxWidth:420,width:"calc(100% - 24px)",margin:"calc(env(safe-area-inset-top, 0px) + 80px) 12px 0",boxShadow:"0 24px 60px rgba(0,0,0,0.18)",border:"1px solid var(--c-border)",animation:handicapClosing?"fadeOut 200ms var(--ease-out) both":"slideUp 280ms var(--ease-out)"}}>

            <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"stretch"}}>
              <button type="button" onClick={()=>{
                setHandicapDraft(d=>{

          </div>
        </div>
      ),document.body)}
      {ratePrompt&&!showBaselineDone&&!showBaselineIntro&&!showWelcomeTour&&ReactDOM.createPortal((
        /* pointerEvents:none on the flex wrapper so empty space around the card doesn't
           swallow taps to anything below it (e.g. the Share modal's Cancel/Share buttons,
           which sit in this same bottom strip). The card itself re-enables pointerEvents. */
        <div style={{position:"fixed",left:16,right:16,bottom:"calc(env(safe-area-inset-bottom, 0px) + 20px)",zIndex:190,display:"flex",justifyContent:"center",animation:"slideUp 300ms var(--ease-out)",pointerEvents:"none"}}>

            <div style={{fontSize:13,fontWeight:600,marginBottom:4,color:"var(--c-text)"}}>Rate {ratePrompt.course.name}{ratePrompt.subName?` — ${ratePrompt.subName}`:""}?</div>
            <div style={{fontSize:11,color:"var(--c-muted)",marginBottom:12,lineHeight:1.5}}>Your round is saved. Want to rate the course while it's fresh?</div>
            <div style={{display:"flex",gap:8}}>

      {handicapToast&&!ratePrompt&&!dbErrorToast&&!isOffline&&!quickLogToast&&!showBaselineDone&&!showBaselineIntro&&!showWelcomeTour&&ReactDOM.createPortal((

/* Top-level error boundary so an uncaught render error in any modal/component
   doesn't white-screen the whole app. Class component because hooks can't catch errors.
   Logs full details to console + shows a recovery card with a Reload button. */
class AppErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){
    console.error("App error boundary caught:",error,info);
    try{window.dispatchEvent(new CustomEvent("pure-db-error",{detail:{label:"render",message:"Something went wrong. Reload to recover."}}));}catch{}
  }
  render(){
    if(this.state.error){
      return(
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",background:"var(--c-bg)",fontFamily:"var(--font-body)"}}>
          <div style={{maxWidth:380,textAlign:"center"}}>
            <div style={{fontSize:36,marginBottom:14}}>⛳</div>
            <div style={{fontSize:18,fontWeight:600,fontFamily:"var(--font-display)",marginBottom:8,color:"var(--c-text)"}}>Something went sideways</div>
            <div style={{fontSize:13,color:"var(--c-muted)",lineHeight:1.5,marginBottom:20}}>The app hit an unexpected error. Your data is safe — just reload to get back in.</div>
            <button type="button" onClick={()=>window.location.reload()} style={{background:"var(--c-green)",color:"#fff",border:"none",borderRadius:12,padding:"12px 24px",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"var(--font-body)"}}>Reload</button>
            {this.state.error?.message&&<div style={{fontSize:11,color:"var(--c-muted)",marginTop:18,fontFamily:"monospace",opacity:0.6,wordBreak:"break-word"}}>{String(this.state.error.message)}</div>}
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<AppErrorBoundary><App/></AppErrorBoundary>);
</script>
