   AUTH — Supabase session + login screen
═══════════════════════════════════════════════════════════ */

/* Watches the Supabase auth session. Returns {session, loading}.
   Persists across reloads via Supabase's built-in localStorage. */
function useAuthSession(){
  const[session,setSession]=useState(null);
  const[loading,setLoading]=useState(true);
  useEffect(()=>{
    let mounted=true;
    /* Race getSession against a 5s timeout so a hung Supabase auth network call doesn't
       leave us on the launch loader forever. If timeout wins we treat session as null
       (LoginScreen renders); if the real call eventually resolves later, the auth state
       listener below picks it up. */
    Promise.race([
      supabase.auth.getSession().then(({data})=>data.session),
      new Promise(res=>setTimeout(()=>res(null),5000)),
    ]).then(s=>{
      if(!mounted)return;
      setSession(s||null);
      setLoading(false);
    }).catch(()=>{
      if(!mounted)return;
      setSession(null);
      setLoading(false);
    });
    const{data:{subscription}}=supabase.auth.onAuthStateChange((_,s)=>{
      if(!mounted)return;
      setSession(s);
    });
    return()=>{mounted=false;subscription.unsubscribe();};
  },[]);
  return{session,loading};
}

/* Pre-onboarding screen — collects auth credentials. After successful
   sign-up the app routes to Onboarding to collect profile fields, then
   inserts the users row. After successful sign-in it skips to the main app. */
function LoginScreen(){
  /* Default to sign-up for first-time visitors (no Supabase session ever stored locally),
     and to sign-in for returning users who logged out. The Supabase client persists its
     session under a key like sb-<project-ref>-auth-token, so its presence means they've
     been here before. */
  const[mode,setMode]=useState(()=>{
    try{
      for(const k of Object.keys(localStorage)){
        if(k.startsWith("sb-")&&k.endsWith("-auth-token"))return"signin";
      }
    }catch{}
    return"signup";
  }); // 'signin' | 'signup'
  const[email,setEmail]=useState("");
  const[password,setPassword]=useState("");
  const[error,setError]=useState(null);
  const[busy,setBusy]=useState(false);
  const[notice,setNotice]=useState(null);
  /* Build 5: track when the notice is specifically the email-confirmation
     prompt so we can show a Resend button. Stuck users (typo'd email,
     spam folder) had no recovery path before. */
  const[confirmPending,setConfirmPending]=useState(false);
  const[resending,setResending]=useState(false);
  const resendConfirmation=async()=>{
    if(!email.trim()||resending)return;
    setResending(true);setError(null);
    try{
      const{error}=await supabase.auth.resend({type:"signup",email:email.trim()});
      if(error)throw error;
      setNotice("Sent again — check your inbox (and spam folder).");
    }catch(e){setError(e.message||"Couldn't resend. Try again in a minute.");}
    setResending(false);
  };
  /* If the user tapped "Continue with Apple/Google" but bailed out (failed sign-in,
     hit cancel, etc.) and came back to the app, the OAuth promise never resolves so
     setBusy(false) never fires — leaving the buttons stuck in disabled/grayed state.
     Reset busy whenever the app regains foreground/visibility. */
  useEffect(()=>{
    const reset=()=>{if(document.visibilityState==="visible")setBusy(false);};
    document.addEventListener("visibilitychange",reset);
    window.addEventListener("focus",reset);
    return()=>{
      document.removeEventListener("visibilitychange",reset);
      window.removeEventListener("focus",reset);
    };
  },[]);
  const submit=async()=>{
    setError(null);setNotice(null);
    if(!email.trim()||!password){setError("Email and password are required.");return;}
    if(password.length<6){setError("Password must be at least 6 characters.");return;}
    setBusy(true);
    try{
      if(mode==="signin"){
        const{error}=await supabase.auth.signInWithPassword({email:email.trim(),password});
        if(error)throw error;
        /* onAuthStateChange will swap App into the authenticated path */
      }else{
        const{data,error}=await supabase.auth.signUp({email:email.trim(),password});
        if(error)throw error;
        if(data.user&&!data.session){
          /* Email confirmation is on — user needs to verify before sign-in works.
             Show a friendly message rather than silently doing nothing. */
          setNotice("Check your email — we sent you a confirmation link.");
          setConfirmPending(true);
        }
      }
    }catch(e){setError(e.message||"Something went wrong.");}
    setBusy(false);
  };
  /* OAuth dispatch — uses the native Capacitor flow (in-app browser + deep link)
     when running inside the iOS app, falls back to plain web OAuth in browser preview.
     The native path resolves on success vs the web path which navigates away. */
  const signInWithApple=async()=>{
    setError(null);setNotice(null);setBusy(true);
    try{
      if(IS_NATIVE){
        await nativeOAuth("apple");
        /* onAuthStateChange will fire and swap App into authenticated path */
      }else{
        const{error}=await supabase.auth.signInWithOAuth({
          provider:"apple",
          options:{redirectTo:window.location.origin}
        });
        if(error)throw error;
      }
    }catch(e){setError(e.message||"Apple sign-in failed.");setBusy(false);}
  };
  const signInWithGoogle=async()=>{
    setError(null);setNotice(null);setBusy(true);
    try{
      if(IS_NATIVE){
        await nativeOAuth("google");
      }else{
        const{error}=await supabase.auth.signInWithOAuth({
          provider:"google",
          options:{redirectTo:window.location.origin}
        });
        if(error)throw error;
      }
    }catch(e){setError(e.message||"Google sign-in failed.");setBusy(false);}
  };
  return(<div style={{width:"100%",height:"100vh",display:"flex",flexDirection:"column",background:"var(--c-bg)",fontFamily:"var(--font-body)"}}>
    <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",padding:"24px",maxWidth:420,margin:"0 auto",width:"100%"}}>
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{fontSize:64,fontWeight:400,fontFamily:"var(--font-display)",fontStyle:"italic",color:"var(--c-green)",lineHeight:1,letterSpacing:-0.5,paddingRight:6}}>Pure</div>
        <div style={{fontSize:11,color:"var(--c-muted)",marginTop:8,fontWeight:600,letterSpacing:2.6,textTransform:"uppercase"}}>Golf Journal</div>
      </div>
      <div style={{fontSize:22,fontWeight:500,fontFamily:"var(--font-display)",lineHeight:1.2,marginBottom:6,textAlign:"center"}}>{mode==="signin"?"Welcome back":"Create your account"}</div>
      <div style={{color:"var(--c-muted)",fontSize:13,marginBottom:24,textAlign:"center",lineHeight:1.5}}>{mode==="signin"?"Sign in to your Pure Golf Journal.":"Start your golf rating journal in under a minute."}</div>
      <button type="button" onClick={signInWithApple} disabled={busy} className="pressable" style={{width:"100%",background:"#000",color:"#fff",border:"none",borderRadius:12,padding:"13px 14px",fontWeight:600,fontSize:15,cursor:busy?"default":"pointer",fontFamily:"-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center",gap:8,opacity:busy?0.6:1}}>
        <svg width="16" height="20" viewBox="0 0 16 20" fill="currentColor" style={{marginTop:-2}} aria-hidden="true">
          <path d="M13.288 10.553c-.025-2.502 2.043-3.706 2.137-3.764-1.166-1.704-2.978-1.937-3.622-1.964-1.541-.156-3.01.91-3.793.91-.79 0-1.987-.888-3.27-.864C2.97 4.896 1.401 5.873.547 7.413c-1.799 3.115-.46 7.71 1.288 10.235.851 1.234 1.866 2.62 3.196 2.572 1.286-.052 1.77-.83 3.323-.83 1.553 0 1.99.83 3.346.802 1.382-.024 2.258-1.253 3.103-2.494.978-1.43 1.38-2.815 1.404-2.886-.03-.014-2.694-1.034-2.72-4.099zM10.96 3.205c.71-.86 1.19-2.054 1.058-3.245-1.022.041-2.262.68-2.997 1.539-.659.762-1.236 1.978-1.081 3.146 1.142.088 2.308-.58 3.02-1.44z"/>
        </svg>
        Continue with Apple
      </button>
      <button type="button" onClick={signInWithGoogle} disabled={busy} className="pressable" style={{width:"100%",background:"#fff",color:"#1f1f1f",border:"1px solid #dadce0",borderRadius:12,padding:"13px 14px",fontWeight:500,fontSize:15,cursor:busy?"default":"pointer",fontFamily:"'Roboto','Segoe UI',Arial,sans-serif",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"center",gap:10,opacity:busy?0.6:1,letterSpacing:0.25}}>
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>
      <div style={{display:"flex",alignItems:"center",gap:10,margin:"4px 0 14px"}}>
        <div style={{flex:1,height:1,background:"var(--c-border)"}}/>
        <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:1.6,textTransform:"uppercase"}}>Or</div>
        <div style={{flex:1,height:1,background:"var(--c-border)"}}/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:18}}>
        <div>
          <label style={{fontSize:11,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase",display:"block",marginBottom:6}}>Email</label>
          <input type="email" inputMode="email" autoCapitalize="none" autoCorrect="off" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@email.com" style={{width:"100%",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:10,padding:"12px 14px",fontSize:14,fontFamily:"var(--font-body)",boxSizing:"border-box",outline:"none",color:"var(--c-text)"}}/>
        </div>
        <div>
          <label style={{fontSize:11,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase",display:"block",marginBottom:6}}>Password</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder={mode==="signup"?"At least 6 characters":""} onKeyDown={e=>{if(e.key==="Enter"&&!busy)submit();}} style={{width:"100%",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:10,padding:"12px 14px",fontSize:14,fontFamily:"var(--font-body)",boxSizing:"border-box",outline:"none",color:"var(--c-text)"}}/>
        </div>
      </div>
      {error&&<div style={{fontSize:12,color:"#b45309",marginBottom:12,padding:"10px 12px",background:"rgba(180,83,9,0.10)",borderRadius:8,lineHeight:1.5}}>{error}</div>}
      {notice&&<div style={{marginBottom:12,padding:"10px 12px",background:"var(--c-green-dim)",borderRadius:8,lineHeight:1.5}}>
        <div style={{fontSize:12,color:"var(--c-green)"}}>{notice}</div>
        {confirmPending&&<button type="button" onClick={resendConfirmation} disabled={resending} style={{marginTop:6,background:"transparent",border:"none",color:"var(--c-green)",fontSize:11,fontWeight:700,cursor:resending?"default":"pointer",padding:"4px 0",fontFamily:"var(--font-body)",textDecoration:"underline",opacity:resending?0.6:1}}>{resending?"Sending...":"Didn't get it? Resend confirmation"}</button>}
      </div>}
      <button type="button" onClick={submit} disabled={busy} className="pressable" style={{width:"100%",background:busy?"var(--c-card)":"var(--c-green)",color:busy?"var(--c-muted)":"#fff",border:"none",borderRadius:12,padding:"14px",fontWeight:700,fontSize:14,cursor:busy?"default":"pointer",fontFamily:"var(--font-body)",marginBottom:14}}>{busy?"…":(mode==="signin"?"Sign In":"Create Account")}</button>
      <button type="button" onClick={()=>{setMode(mode==="signin"?"signup":"signin");setError(null);setNotice(null);}} style={{width:"100%",background:"transparent",color:"var(--c-sub)",border:"none",padding:"8px",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"var(--font-body)"}}>{mode==="signin"?"Need an account? Sign up":"Already have an account? Sign in"}</button>
    </div>
  </div>);
}

/* ═══════════════════════════════════════════════════════════
   ONBOARDING
═══════════════════════════════════════════════════════════ */
function Onboarding({onComplete,inviteUser,onRequestCourse,existingProfile}){
  /* Pre-fill from existing profile if user already finished step 0 (e.g. after Reset Data).
     If they have a name + username already, skip step 0 entirely and start at home course. */
  const hasIdentity=!!(existingProfile?.name&&existingProfile?.username);
  const[step,setStep]=useState(hasIdentity?1:0); // 0=name, 1=home course, 2=rate it
  const initialNames=(existingProfile?.name||"").split(/\s+/);
  const[firstName,setFirstName]=useState(initialNames[0]||"");
  const[lastName,setLastName]=useState(initialNames.slice(1).join(" ")||"");
  const[username,setUsername]=useState(existingProfile?.username||"");
  const[email,setEmail]=useState(existingProfile?.email||"");
  const[profilePhoto,setProfilePhoto]=useState(existingProfile?.profilePhoto||null);
  const[showCropper,setShowCropper]=useState(false);
  const[photoScale,setPhotoScale]=useState(existingProfile?.profilePhotoPos?.scale||1);
  const[photoX,setPhotoX]=useState(existingProfile?.profilePhotoPos?.x??50);
  const[photoY,setPhotoY]=useState(existingProfile?.profilePhotoPos?.y??50);
  const photoRef=useRef(null);
  const[homeCourse,setHomeCourse]=useState("");
  const[homeRating,setHomeRating]=useState(7.0);
  const[homeBest,setHomeBest]=useState("");
  const[homePhotos,setHomePhotos]=useState([]);
  /* When user picks "I don't have a home course", we route them to a small area
     picker (instead of skipping calibration entirely). The chosen area drives
     "Courses Near You" suggestions just like a home course's coords would. */
  const[pickingArea,setPickingArea]=useState(false);
  const[homeArea,setHomeArea]=useState("");
  const[areaSearch,setAreaSearch]=useState("");
  /* "My home course isn't here" — opens a friendly modal that logs a course request,
     so when we add the course later the user gets a heads-up and we know demand. */
  const[requestOpen,setRequestOpen]=useState(false);
  const[requestClosing,setRequestClosing]=useState(false);
  const[requestDraft,setRequestDraft]=useState("");
  const[requestSubmitted,setRequestSubmitted]=useState(false);
  const openRequestDialog=()=>{
    /* Dismiss the iOS keyboard before the modal slides up. Without this, the soft keyboard
       stays docked over the modal and the user has to tap elsewhere to dismiss it. */
    if(document.activeElement&&typeof document.activeElement.blur==="function")document.activeElement.blur();
    setRequestDraft(q||"");setRequestSubmitted(false);setRequestOpen(true);
  };
  const closeRequestDialog=()=>{if(requestClosing)return;setRequestClosing(true);setTimeout(()=>{setRequestClosing(false);setRequestOpen(false);setRequestSubmitted(false);},260);};
  const submitRequest=()=>{
    const clean=requestDraft.trim();
    if(clean&&onRequestCourse)onRequestCourse(clean);
    setRequestSubmitted(true);
  };
  const homePhotoRef=useRef(null);
  const handleHomePhotos=async e=>{
    /* Build 3: route through compressPhoto to avoid 8-12MB iPhone photos
       blowing past Supabase row size + localStorage quota. */
    const files=Array.from(e.target.files||[]);
    for(const file of files){
      const compressed=await compressPhoto(file);
      if(!compressed)continue;
      setHomePhotos(prev=>[...prev,{id:Date.now()+Math.random(),src:compressed}]);
    }
    e.target.value="";
  };
  const[q,setQ]=useState("");
  const[qDebounced,setQDebounced]=useState("");
  useEffect(()=>{const t=setTimeout(()=>setQDebounced(q),120);return()=>clearTimeout(t);},[q]);
  const name=`${firstName.trim()} ${lastName.trim()}`.trim();
  const handlePhoto=e=>{const file=e.target.files?.[0];if(!file){e.target.value="";return;}
    /* Canvas re-encoding strips the embedded color profile (iPhone photos are Display P3),
       which makes colors shift brighter/more saturated. Skip the canvas path entirely when
       the image is already reasonable size — preserves the original color profile. */
    const readAsDataUrl=()=>{const r=new FileReader();r.onload=ev=>{setProfilePhoto(String(ev.target.result||""));setPhotoScale(1);setPhotoX(50);setPhotoY(50);setShowCropper(true);};r.readAsDataURL(file);};
    const SMALL_ENOUGH_BYTES=2.5*1024*1024;
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const {naturalWidth:w,naturalHeight:h}=img;
      /* Warn on tiny source — anything under 300px will look blurry once cropped to a circle */
      if(Math.min(w,h)<300){
        try{window.dispatchEvent(new CustomEvent("pure-db-error",{detail:{message:"That photo is small — it may look blurry. Try a larger one if you can."}}));}catch{}
      }
      if(file.size<SMALL_ENOUGH_BYTES&&Math.max(w,h)<=1800){
        /* No re-encode needed — keep original bytes (and original color profile) */
        URL.revokeObjectURL(url);readAsDataUrl();return;
      }
      const MAX=1600;
      const s=Math.min(1,MAX/Math.max(w,h));
      const cw=Math.round(w*s),ch=Math.round(h*s);
      const canvas=document.createElement("canvas");canvas.width=cw;canvas.height=ch;
      /* Ask for display-p3 colorspace where supported (Safari 16.4+) so colors don't shift on re-encode */
      let ctx;try{ctx=canvas.getContext("2d",{colorSpace:"display-p3"});}catch{ctx=canvas.getContext("2d");}
      if(!ctx)ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,cw,ch);
      const out=canvas.toDataURL("image/jpeg",0.95);
      URL.revokeObjectURL(url);
      setProfilePhoto(out);setPhotoScale(1);setPhotoX(50);setPhotoY(50);setShowCropper(true);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);};
    img.src=url;
    e.target.value="";};

  const sortedCourses=useMemo(()=>[...COURSES].sort((a,b)=>{
    const aFame=(a.gdWorld?3:0)+(a.gdUS?2:0)+(a.majors?.length?2:0)+(a.pgaTour?1:0);
    const bFame=(b.gdWorld?3:0)+(b.gdUS?2:0)+(b.majors?.length?2:0)+(b.pgaTour?1:0);
    return bFame-aFame;
  }),[]);
  const filtered=useMemo(()=>{
    if(!qDebounced.trim())return sortedCourses.slice(0,40);
    const s=norm(qDebounced);
    const scored=sortedCourses.map(c=>{
      const name=norm(c.name);
      if(name.startsWith(s))return{c,score:4};
      if(name.includes(s))return{c,score:3};
      if(norm(c.city).includes(s)||norm(c.state).includes(s))return{c,score:2};
      return null;
    }).filter(Boolean);
    scored.sort((a,b)=>b.score-a.score);
    return scored.slice(0,60).map(x=>x.c);
  },[qDebounced,sortedCourses]);

  const inputStyle={width:"100%",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,padding:"14px 16px",fontSize:15,fontWeight:500,outline:"none",fontFamily:"var(--font-body)",transition:"border-color 200ms var(--ease-out)"};
  const usernameClean=username.trim().replace(/^@/,"").toLowerCase();
  /* Real-time username availability check — debounces 350ms after typing,
     queries public.users for a row with the same username (excluding the
     current user's own row so existing usernames don't show as "taken"). */
  const[usernameStatus,setUsernameStatus]=useState("idle"); // 'idle' | 'checking' | 'available' | 'taken'
  useEffect(()=>{
    if(!usernameClean||usernameClean.length<3||!/^[a-z0-9_.]+$/.test(usernameClean)){
      setUsernameStatus("idle");return;
    }
    /* If user already owns this username on their existing row, no need to query — it's theirs. */
    if(existingProfile?.username&&existingProfile.username.toLowerCase()===usernameClean){
      setUsernameStatus("available");return;
    }
    setUsernameStatus("checking");
    /* `cancelled` guards against the type-fast race: clearing the timeout cancels
       the not-yet-started query, but if the timer already fired and the Supabase
       request is in flight, only `cancelled` prevents a stale response from
       overwriting the status for the latest typed value. */
    let cancelled=false;
    const t=setTimeout(async()=>{
      const{data:sessData}=await supabase.auth.getSession();
      if(cancelled)return;
      const myId=sessData.session?.user?.id;
      let q=supabase.from("users").select("id").eq("username",usernameClean).limit(1);
      if(myId)q=q.neq("id",myId);
      const{data,error}=await q;
      if(cancelled)return;
      if(error){setUsernameStatus("idle");return;}
      setUsernameStatus(data&&data.length>0?"taken":"available");
    },350);
    return()=>{cancelled=true;clearTimeout(t);};
  },[usernameClean,existingProfile?.username]);
  /* Email already collected at sign-up — onboarding only needs name + username + an available username. */
  const canContinue=firstName.trim()&&lastName.trim()&&usernameClean.length>=3&&/^[a-z0-9_.]+$/.test(usernameClean)&&usernameStatus!=="taken"&&usernameStatus!=="checking";

  /* Build 3: lets the user back out of onboarding to switch accounts.
     Confirms before signing out so a misclick doesn't dump them. The auth
     state change listener routes them back to LoginScreen automatically. */
  const switchAccount=async()=>{
    if(!window.confirm("Sign out and use a different account? Your in-progress info will be lost."))return;
    try{await supabase.auth.signOut();}catch{}
    try{window.location.reload();}catch{}
  };

  if(step===0) return(
    <div className="fade-up" style={{padding:"calc(env(safe-area-inset-top, 0px) + 14px) 24px 40px",textAlign:"center"}}>
      {showCropper&&profilePhoto&&<PhotoCropper photo={profilePhoto} initialX={photoX} initialY={photoY} initialScale={photoScale} onSave={({dataUrl,x,y,scale})=>{if(dataUrl&&dataUrl!==profilePhoto){setProfilePhoto(dataUrl);setPhotoX(50);setPhotoY(50);setPhotoScale(1);}else{setPhotoX(x);setPhotoY(y);setPhotoScale(scale);}setShowCropper(false);}} onCancel={()=>setShowCropper(false)}/>}
      <div style={{display:"flex",justifyContent:"flex-start",marginBottom:18}}>
        <button type="button" onClick={switchAccount} className="pressable" style={{background:"none",border:"none",color:"var(--c-muted)",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"var(--font-body)",padding:"6px 0"}}>Use a different account</button>
      </div>
      <div style={{marginBottom:inviteUser?14:28,marginTop:0}}>
        <div style={{fontSize:48,fontWeight:400,fontFamily:"var(--font-display)",fontStyle:"italic",color:"var(--c-green)",lineHeight:1,marginBottom:6,letterSpacing:-0.5}}>Pure</div>
        <div style={{fontSize:11,color:"var(--c-muted)",fontWeight:600,letterSpacing:2.4,textTransform:"uppercase"}}>Golf Journal</div>
      </div>
      {inviteUser&&<div style={{background:"var(--c-green-dim)",border:"1px solid var(--c-green-border)",borderRadius:10,padding:"10px 14px",marginBottom:22,textAlign:"left",display:"flex",alignItems:"center",gap:10}}>
        <div style={{fontSize:20}}>👋</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12,fontWeight:700,color:"var(--c-green)"}}>You were invited by @{inviteUser}</div>
          <div style={{fontSize:10,color:"var(--c-sub)",marginTop:2}}>We'll add them automatically when you finish setup.</div>
        </div>
      </div>}
      <div style={{marginBottom:24}}>
        <input ref={photoRef} type="file" accept="image/*" onChange={handlePhoto} style={{display:"none"}}/>
        <button type="button" className="pressable" onClick={()=>photoRef.current?.click()} style={{
          width:90,height:90,borderRadius:"50%",border:`2px dashed ${profilePhoto?"var(--c-green)":"var(--c-border)"}`,
          background:profilePhoto?"none":"var(--c-surface)",cursor:"pointer",overflow:"hidden",position:"relative",
          display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto",
          transition:"border-color 200ms var(--ease-out)"}}>
          {profilePhoto?<img src={profilePhoto} alt="" style={{position:"absolute",left:"50%",top:"50%",width:"100%",height:"100%",objectFit:"cover",objectPosition:`${photoX}% ${photoY}%`,transform:`translate(-50%,-50%) scale(${photoScale})`,transformOrigin:"center center"}}/>
          :<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--c-muted)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>}
        </button>
        <div style={{fontSize:10,color:"var(--c-muted)",marginTop:6,fontWeight:500}}>
          {profilePhoto?"Tap to change":"Add a profile photo"}
        </div>
        {profilePhoto&&<div style={{marginTop:8,display:"flex",justifyContent:"center"}}>
          <button type="button" onClick={()=>setShowCropper(true)} style={{padding:"5px 12px",borderRadius:6,border:"1px solid var(--c-border)",background:"var(--c-card)",cursor:"pointer",fontSize:10,fontWeight:600,fontFamily:"var(--font-body)",color:"var(--c-muted)"}}>Adjust</button>
        </div>}
      </div>
      <div style={{textAlign:"left",display:"flex",flexDirection:"column",gap:14,marginBottom:28}}>
        <div style={{display:"flex",gap:10}}>
          <div style={{flex:1}}>
            <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>First Name</div>
            <input value={firstName} onChange={e=>setFirstName(e.target.value)} placeholder="First" autoFocus style={inputStyle}
              onFocus={e=>e.target.style.borderColor="var(--c-green)"} onBlur={e=>e.target.style.borderColor=""}/>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Last Name</div>
            <input value={lastName} onChange={e=>setLastName(e.target.value)} placeholder="Last" style={inputStyle}
              onFocus={e=>e.target.style.borderColor="var(--c-green)"} onBlur={e=>e.target.style.borderColor=""}/>
          </div>
        </div>
        <div>
          <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Username</div>
          <div style={{position:"relative"}}>
            <span style={{position:"absolute",left:16,top:"50%",transform:"translateY(-50%)",color:"var(--c-muted)",fontSize:15,fontWeight:500,pointerEvents:"none"}}>@</span>
            <input value={username} onChange={e=>setUsername(e.target.value.replace(/^@/,""))} placeholder="yourname" style={{...inputStyle,paddingLeft:30}}
              onFocus={e=>e.target.style.borderColor="var(--c-green)"} onBlur={e=>e.target.style.borderColor=""}/>
          </div>
          {username.trim()&&!(/^[a-z0-9_.]+$/.test(usernameClean))&&<div style={{fontSize:10,color:"#b45309",marginTop:4,fontWeight:500}}>Lowercase letters, numbers, _ and . only</div>}
          {usernameClean.length>=3&&/^[a-z0-9_.]+$/.test(usernameClean)&&<div style={{fontSize:10,marginTop:4,fontWeight:600,display:"flex",alignItems:"center",gap:5,color:usernameStatus==="taken"?"#b45309":usernameStatus==="available"?"var(--c-green)":"var(--c-muted)"}}>
            {usernameStatus==="checking"&&<><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:"var(--c-muted)",opacity:0.5}}/>Checking…</>}
            {usernameStatus==="available"&&<><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Available</>}
            {usernameStatus==="taken"&&<><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Already taken — try another</>}
          </div>}
        </div>
      </div>
      <PrimaryBtn disabled={!canContinue} onClick={()=>setStep(1)}>Continue</PrimaryBtn>
    </div>);

  /* "I don't have a home course" routes here — we still ask for an area so the
     suggestions engine has something to anchor to. Onboarding completes when the
     user picks an area or explicitly skips it. */
  if(pickingArea) return(
    /* Fixed top (title + search), scrollable middle (area list), fixed bottom
       (Back/Continue + Skip). Uses height:100% + flex column so only the list
       scrolls — top + bottom stay anchored. Filling parent's available space
       (the Onboarding wrapper) avoids fighting its own overflow behavior. */
    <div className="fade-up" style={{height:"100%",display:"flex",flexDirection:"column"}}>
      <div style={{flexShrink:0,padding:"calc(env(safe-area-inset-top, 0px) + 30px) 24px 14px"}}>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:22,fontWeight:500,fontFamily:"var(--font-display)",lineHeight:1.2}}>Where do you usually play?</div>
          <div style={{color:"var(--c-muted)",fontSize:13,marginTop:6,lineHeight:1.5}}>We'll use this to suggest courses near you. You can change it later in Settings.</div>
        </div>

  if(step===2){

      <PrimaryBtn onClick={()=>onComplete({name:name.trim(),username:usernameClean,email:email.trim(),homeCourseId:homeCourse,homeRating,homeBest:homeBest.trim()||null,homePhotos:homePhotos.map(p=>p.src),profilePhoto,profilePhotoPos:profilePhoto?{x:photoX,y:photoY,scale:photoScale}:null})}>

      <div style={{textAlign:"center",marginTop:12}}>
        <span style={{fontSize:11,color:"var(--c-muted)"}}>You can re-rate this later with head-to-head comparisons</span>

  }
  return null;
}

/* ═══════════════════════════════════════════════════════════
   US MAP COMPONENT
═══════════════════════════════════════════════════════════ */
function GolfMap({playedCourses,onSelectCourse}){
  const mapRef=useRef(null);
  const mapInstance=useRef(null);
  const markersRef=useRef([]);
  /* Keep latest onSelectCourse in a ref so the popup click handlers always call the
     current callback without needing to rebuild markers when the callback identity changes. */
  const onSelectRef=useRef(onSelectCourse);
  useEffect(()=>{onSelectRef.current=onSelectCourse;});

  useEffect(()=>{
    if(!mapRef.current||mapInstance.current)return;
    /* Initialize Leaflet map */
    const map=L.map(mapRef.current,{
      zoomControl:false,
      attributionControl:false,
      scrollWheelZoom:true,
      dragging:true,
      doubleClickZoom:true,
      touchZoom:true,
      worldCopyJump:true
    }).setView([39,-98],4);

    /* Light minimalist Positron tiles — clean white background with subtle road network.
       We layer a CSS filter on the map container (see leaflet-pure-tint class) to tint
       the whole thing into Pure's cream/green palette, giving it an Apple-Maps-like
       warm aesthetic without the licensing/registration overhead of MapKit JS. */
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',{
      maxZoom:18,minZoom:2,noWrap:false,
    }).addTo(map);
    /* Labels rendered on top so the tint affects the base only, keeping label legibility */
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',{
      maxZoom:18,minZoom:2,noWrap:false,pane:"shadowPane",
    }).addTo(map);

    /* Minimal zoom control bottom-right */
    L.control.zoom({position:'bottomright'}).addTo(map);

    mapInstance.current=map;

    /* Fix Leaflet rendering when container resizes */
    setTimeout(()=>map.invalidateSize(),100);
    return()=>{try{map.closePopup();}catch{}map.remove();mapInstance.current=null;};
  },[]);

  /* Update markers when courses change */
  useEffect(()=>{
    const map=mapInstance.current;if(!map)return;
    /* Clear old markers */
    markersRef.current.forEach(m=>map.removeLayer(m));
    markersRef.current=[];
    if(!playedCourses.length)return;
    /* Custom green dot icon */
    const dotIcon=L.divIcon({
      className:'',
      html:'<div style="width:14px;height:14px;border-radius:50%;background:#15803d;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.2),0 0 0 6px rgba(21,128,61,0.15);"></div>',
      iconSize:[14,14],iconAnchor:[7,7]
    });
    playedCourses.forEach(c=>{
      if(!c.lat||!c.lng)return;
      /* Popup HTML escapes user-controlled fields by replacing the four characters that
         break out of HTML attribute/text contexts. Course data is internal but defensive. */
      const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      const popupHtml=`<div class="pure-popup-tap" style="font-family:Outfit,sans-serif;text-align:center;padding:6px 6px 4px;cursor:pointer;-webkit-tap-highlight-color:transparent">
        <strong style="font-size:12px;color:#15803d;display:block">${esc(c.name)}</strong>
        <span style="font-size:10px;color:#888">${esc(c.city)}, ${esc(c.state)}</span>
        <span style="display:block;font-size:9px;color:#15803d;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-top:5px">View course &rarr;</span>
      </div>`;
      const m=L.marker([c.lat,c.lng],{icon:dotIcon})
        .bindPopup(popupHtml,{closeButton:false,className:'pure-popup'})
        .addTo(map);
      /* Wire the popup content to navigate when tapped. We attach on every popupopen
         (not just once) because Leaflet recreates the DOM each time the popup re-opens. */
      m.on('popupopen',e=>{
        const root=e.popup.getElement();
        const tap=root&&root.querySelector('.pure-popup-tap');
        if(!tap)return;
        tap.onclick=()=>{const fn=onSelectRef.current;if(fn)fn(c);};
      });
      markersRef.current.push(m);
    });
    /* Center on the BIGGEST cluster of played courses (rather than the centroid of all
       of them). Avoids the outlier-pull problem: 8 courses in LA + 1 in Florida should
       open zoomed on LA, not somewhere over Texas.

       Algorithm: bucket courses into ~1° lat/lng cells (~70 miles at mid-latitudes),
       find the cell with the most courses, then center on the centroid of just THAT
       cluster's courses. Single courses or tied clusters fall back to a simple centroid
       of the largest group, so behavior degrades smoothly. */
    const withCoords=playedCourses.filter(c=>c.lat&&c.lng);
    if(withCoords.length>=1){
      /* Bucket key: floor(lat) + "," + floor(lng) groups everything within roughly a
         70-mile square. Big enough that LA + OC + LB land in one or two adjacent cells,
         small enough that LA + Phoenix don't get confused as one cluster. */
      const buckets=new Map();
      for(const c of withCoords){
        const key=Math.floor(c.lat)+","+Math.floor(c.lng);
        const arr=buckets.get(key)||[];
        arr.push(c);
        buckets.set(key,arr);
      }
      /* Find the densest bucket. Ties resolve to the first encountered (deterministic
         since Map preserves insertion order, and COURSES iteration order is stable). */
      let biggest=null,biggestCount=0;
      for(const arr of buckets.values()){
        if(arr.length>biggestCount){biggest=arr;biggestCount=arr.length;}
      }
      const cluster=biggest||withCoords;
      /* Centroid of just the densest cluster — gives the natural "where I usually
         play" focal point without being skewed by far-off outliers. */
      const avgLat=cluster.reduce((s,c)=>s+c.lat,0)/cluster.length;
      const avgLng=cluster.reduce((s,c)=>s+c.lng,0)/cluster.length;
      /* Zoom 7 ≈ metro/regional view. Tight enough that nearby clusters render as
         distinct markers, loose enough that a 200-mile radius fits on screen. */
      map.setView([avgLat,avgLng],7);
    }
  },[playedCourses]);

  return(
    <div style={{background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:14,overflow:"hidden"}}>
      <div style={{padding:"12px 14px 8px"}}>
        <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase"}}>Your Golf Map</div>
      </div>
      <div ref={mapRef} className="leaflet-pure-tint" style={{width:"100%",height:220}}/>
      {playedCourses.length>0&&<div style={{textAlign:"center",padding:"6px 0 10px"}}>
        <span style={{fontSize:10,color:"var(--c-muted)",fontWeight:500}}>{playedCourses.length} course{playedCourses.length!==1?"s":""} played</span>
      </div>}
    </div>);
}

    <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"20px 18px calc(env(safe-area-inset-bottom, 0px) + 32px)"}}>
      <p style={{fontSize:13,color:"var(--c-text)",lineHeight:1.6,marginBottom:14}}>Pure Golf Journal uses course photography sourced from open-license providers. We are grateful to the photographers and contributors who make their work freely available.</p>

      <div style={{marginBottom:22,padding:"12px 14px",background:"var(--c-green-dim)",border:"1px solid var(--c-green-border)",borderRadius:12}}>
        <div style={{fontWeight:600,fontSize:13,marginBottom:4,color:"var(--c-green)"}}>About course photos</div>
        <div style={{fontSize:12,color:"var(--c-text)",lineHeight:1.55}}>Some courses — especially private clubs and lesser-known tracks — don't have publicly licensed photos available. In those cases we use a regional landscape photo or, rarely, no photo at all. As Pure grows, your uploaded photos will help fill these gaps for the whole community.</div>
      </div>

      <div style={{marginBottom:24,padding:"12px 14px",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12}}>
        <div style={{fontWeight:600,fontSize:13,marginBottom:4}}>User-uploaded photos</div>
        <div style={{fontSize:12,color:"var(--c-muted)",lineHeight:1.5}}>Photos you upload while rating courses remain yours. Pure only displays them within your account and to friends you share with.</div>
      </div>

      <div style={{marginBottom:24,padding:"12px 14px",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12}}>
        <div style={{fontWeight:600,fontSize:13,marginBottom:4}}>Unsplash & Pexels <span style={{color:"var(--c-muted)",fontWeight:500}}>({stockCount} photos)</span></div>
        <div style={{fontSize:12,color:"var(--c-muted)",lineHeight:1.5}}>Generic golf scenery used as placeholders where course-specific imagery was not available. Provided under the Unsplash and Pexels licenses — free for commercial use, no attribution required.</div>

        <div style={{fontSize:12,color:"var(--c-muted)",lineHeight:1.5,marginBottom:10}}>Images sourced from Wikimedia Commons, licensed under various open licenses (most commonly Creative Commons Attribution-ShareAlike). Full license details for each image are available on <a href="https://commons.wikimedia.org" target="_blank" rel="noopener noreferrer" style={{color:"var(--c-green)",textDecoration:"none",fontWeight:600}}>commons.wikimedia.org</a>.</div>
      </div>

      <div style={{background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,overflow:"hidden"}}>
        {wikimediaCourses.map((x,i)=>(
          <div key={x.course.id} style={{padding:"10px 14px",borderBottom:i<wikimediaCourses.length-1?"1px solid var(--c-border)":"none"}}>
            <div style={{fontWeight:600,fontSize:12}}>{x.course.name}</div>

        Pure Golf Journal is an independent app and is not affiliated with, endorsed by, or sponsored by any golf club, golf association, or organization mentioned herein.
      </div>

  </div>),document.body);
}

function SettingsView({settings,onUpdate,onBack,profile,onUpdateProfile,onSetHomeCourse,refineState,onStartRefine,ratings,onQuickLog,onOpenBatchEntry,onOpenHandicapEntry,onStartTour,onSignOut,onResetAccount,onOpenFeedback}){
  const[editField,setEditField]=useState(null); // null | "name" | "email" | "home"
  const[showCredits,setShowCredits]=useState(false);
  /* Audience picker for "Hide My Ratings" — appears when toggling ON. Two
     choices: hide from everyone, or hide from non-friends only. */
  const[hideRatingsPicker,setHideRatingsPicker]=useState(false);
  const[draft,setDraft]=useState("");
  const[courseSearch,setCourseSearch]=useState("");
  const[ghinResult,setGhinResult]=useState(null); // {imported, matched, skipped} on successful import
  const[ghinError,setGhinError]=useState(null);
  const[ghinHelp,setGhinHelp]=useState(false);
  const[ghinPaste,setGhinPaste]=useState(false);
  const[pasteText,setPasteText]=useState("");
  /* Batch entry: same course/rating/slope, many rounds */
  /* Batch + Handicap modals are now App-level (opened via onOpenBatchEntry /
     onOpenHandicapEntry props). Removed: local state, body-scroll lock for those
     modals, initialModal/autoOpenList round-trip machinery — all unnecessary now
     that the modals overlay rather than navigate. */
  const ghinInputRef=useRef(null);
  const processCsvText=text=>{
    setGhinError(null);setGhinResult(null);
    try{
      const {rounds,stats}=parseGhinCsv(text);
      if(!rounds.length){setGhinError("Couldn't find any scores in that text. Each row needs at least a score between 50 and 200.");return false;}
      /* Quality guardrail: if more than half of rows were skipped AND we found fewer than
         3 valid rounds, the file is likely not a handicap export. Reject rather than silently
         importing a tiny garbage sample that would pollute their handicap. */
      if(stats.skipped>rounds.length&&rounds.length<3){
        setGhinError(`Only ${rounds.length} valid round${rounds.length===1?"":"s"} found out of ${rounds.length+stats.skipped} rows. Make sure this is a scores CSV from your handicap service.`);
        return false;
      }
      /* Match each round to a Pure course by name (fuzzy) */
      let matched=0;
      const enriched=rounds.map(r=>{
        if(!r.courseName)return r;
        const needle=norm(r.courseName);
        const hit=COURSES.find(c=>norm(c.name)===needle)||COURSES.find(c=>norm(c.name).includes(needle)||needle.includes(norm(c.name)));
        if(hit){matched++;return{...r,courseId:hit.id};}
        return r;
      });
      /* Merge with any existing imported rounds, dedupe by date+score+courseName */
      const prev=profile?.ghinRounds||[];
      const seen=new Set(prev.map(r=>`${r.date||""}|${r.score}|${(r.courseName||"").toLowerCase()}`));
      const novel=enriched.filter(r=>!seen.has(`${r.date||""}|${r.score}|${(r.courseName||"").toLowerCase()}`));
      onUpdateProfile({...profile,ghinRounds:[...prev,...novel]});
      /* Persist novel rounds to Supabase (skip duplicates already in state) */
      novel.forEach(r=>dbWriteImportedRound(r));
      setGhinResult({imported:novel.length,matched,skipped:stats.skipped,duplicates:enriched.length-novel.length});
      return true;
    }catch(err){setGhinError("Could not parse the text. Make sure it's valid CSV.");return false;}
  };
  const handleGhinImport=e=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{processCsvText(String(ev.target.result||""));e.target.value="";};
    reader.onerror=()=>{setGhinError("Failed to read file.");e.target.value="";};
    reader.readAsText(file);
  };
  const handlePasteImport=()=>{
    if(!pasteText.trim()){setGhinError("Paste the CSV contents first.");return;}
    if(processCsvText(pasteText)){setPasteText("");setGhinPaste(false);}
  };
  /* handleBatchAdd + handleHandicapSave moved to App (handleBatchSave /
     handleHandicapSaveTop) so they own the App-level state. */
  const clearGhin=async()=>{
    /* Confirm before destructive action — these rounds count toward the user's handicap. */
    const ok=window.confirm("Clear all imported rounds? This will permanently remove them from your handicap calculation.");
    if(!ok)return;
    /* Delete in DB first; only mirror to React state if it succeeded. Otherwise the local
       clear would create a hydration mismatch — rounds reappear on next reload. */
    const success=await dbDeleteAllImportedRounds();
    if(!success)return;
    onUpdateProfile({...profile,ghinRounds:[]});
    setGhinResult(null);setGhinError(null);
  };
  const startEdit=(field,currentVal)=>{setEditField(field);setDraft(field==="username"?(profile?.username||""):(currentVal||""));setCourseSearch("");};
  /* All saveEdit/saveHomeCourse/saveHomeArea paths now persist to Supabase via
     dbWriteProfileFields. Without this, edits only updated local React state and
     evaporated on next reload — which is why "Courses Near You" appeared not to
     change after a home-course edit (the change DID apply in-session via the
     suggestions useMemo, but reloading restored the old value from the DB). */
  const saveEdit=()=>{
    if(!editField)return;
    if(editField==="name"&&draft.trim()){
      const v=draft.trim();
      onUpdateProfile({...profile,name:v});
      dbWriteProfileFields({name:v});
    }else if(editField==="email"&&draft.trim()){
      const v=draft.trim();
      onUpdateProfile({...profile,email:v});
      dbWriteProfileFields({email:v});
    }else if(editField==="username"){
      const u=draft.trim().replace(/^@/,"").toLowerCase();
      if(u.length>=3&&/^[a-z0-9_.]+$/.test(u)){
        onUpdateProfile({...profile,username:u});
        dbWriteProfileFields({username:u});
      }
    }
    setEditField(null);setDraft("");
  };
  const saveHomeCourse=(id)=>{
    /* Delegate to App-level handler so it can also pop the first-impression rating page
       for unrated home courses. Falls back to local update if prop isn't passed (defensive). */
    if(onSetHomeCourse){
      onSetHomeCourse(id);
    }else{
      onUpdateProfile({...profile,homeCourseId:id});
      dbWriteProfileFields({homeCourseId:id});
    }
    setEditField(null);setCourseSearch("");
  };
  const saveHomeArea=(areaKey)=>{
    onUpdateProfile({...profile,homeArea:areaKey});
    dbWriteProfileFields({homeArea:areaKey});
    setEditField(null);
  };
  const clearHomeCourse=()=>{
    onUpdateProfile({...profile,homeCourseId:null});
    dbWriteProfileFields({homeCourseId:null});
    setEditField(null);setCourseSearch("");
  };
  const Toggle=({on,onToggle})=>(
    <button onClick={onToggle} style={{width:44,height:26,borderRadius:13,border:"none",cursor:"pointer",
      background:on?"var(--c-green)":"var(--c-surface)",padding:2,display:"flex",alignItems:"center",
      transition:"background 200ms var(--ease-out)"}}>
      <div style={{width:22,height:22,borderRadius:11,background:"#fff",boxShadow:"0 1px 3px rgba(0,0,0,0.15)",
        transform:on?"translateX(18px)":"translateX(0)",transition:"transform 200ms var(--ease-out)"}}/>
    </button>);
  const EditRow=({label,value,field,isLast})=>(
    <div style={{padding:"14px 16px",borderBottom:isLast?"none":"1px solid var(--c-border)",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:11,color:"var(--c-muted)",marginBottom:2}}>{label}</div>
        <div style={{fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{value||"\u2014"}</div>
      </div>
      <button type="button" onClick={()=>startEdit(field,field==="home"?null:value)} style={{background:"var(--c-green-dim)",color:"var(--c-green)",border:"1px solid var(--c-green-border)",borderRadius:8,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"var(--font-body)"}}>Edit</button>
    </div>);
  return(
    <div className="slide-over" style={{height:"100%",overflowY:"auto",WebkitOverflowScrolling:"touch",overscrollBehavior:"contain",background:"var(--c-bg)",position:"relative"}}>
    <div style={{padding:"calc(env(safe-area-inset-top, 0px) + 16px) 18px 16px"}}>
      <button className="pressable" onClick={onBack} style={{background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:10,padding:"7px 12px",cursor:"pointer",fontWeight:600,fontSize:13,fontFamily:"var(--font-body)",marginBottom:20,display:"flex",alignItems:"center",gap:4}}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div style={{fontSize:22,fontWeight:500,fontFamily:"var(--font-display)",marginBottom:24}}>Settings</div>

      <div style={{display:"flex",flexDirection:"column",gap:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 0",borderBottom:"1px solid var(--c-border)"}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:14}}>Hide My Ratings</div>
            <div style={{color:"var(--c-muted)",fontSize:11,marginTop:2}}>{
              settings.hideRatings==="everyone"?"Hidden from everyone":
              settings.hideRatings==="non-friends"?"Hidden from non-friends only":
              "Others can see your ratings"
            }</div>
          </div>
          <Toggle on={settings.hideRatings!=="off"} onToggle={()=>{
            if(settings.hideRatings!=="off"){onUpdate({...settings,hideRatings:"off"});}
            else{setHideRatingsPicker(true);}
          }}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 0",borderBottom:"1px solid var(--c-border)"}}>
          <div><div style={{fontWeight:600,fontSize:14}}>Hide Shot Scores</div>
            <div style={{color:"var(--c-muted)",fontSize:11,marginTop:2}}>Keep your stroke counts private</div></div>
          <Toggle on={settings.hideShots} onToggle={()=>onUpdate({...settings,hideShots:!settings.hideShots})}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 0",borderBottom:"1px solid var(--c-border)"}}>
          <div><div style={{fontWeight:600,fontSize:14}}>Private Profile</div>
            <div style={{color:"var(--c-muted)",fontSize:11,marginTop:2}}>Only friends can see your profile</div></div>
          <Toggle on={settings.privateProfile} onToggle={()=>onUpdate({...settings,privateProfile:!settings.privateProfile})}/>
        </div>
      </div>

      <div style={{marginTop:32}}>
        <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Account</div>
        <div style={{background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,overflow:"hidden"}}>
          <EditRow label="Name" value={profile?.name||"Golfer"} field="name"/>
          <EditRow label="Username" value={profile?.username?"@"+profile.username:""} field="username"/>
          <EditRow label="Email" value={profile?.email||""} field="email"/>
          <EditRow label="Home Course" value={profile?.homeCourseId?COURSES.find(c=>c.id===profile.homeCourseId)?.name:"None"} field="home"/>
          {/* Home Area only shown when there's no home course — gives the suggestions
              engine something to work with so "Courses Near You" stays accurate. */}
          {!profile?.homeCourseId&&<EditRow label="Home Area" value={profile?.homeArea?(HOME_AREA_BY_KEY[profile.homeArea]?.label||"Set"):"None"} field="area" isLast/>}
        </div>
      </div>

      {refineState&&(()=>{
        const paused=refineState.pausedIndex!=null;
        const done=refineState.promptStage==="done"&&!paused;
        const count=refineState.earlyRefs.length;
        /* Refine unlocks at 10 rated units — prevents users from refining their first
           few ratings while their internal scale is still calibrating. The auto-prompt
           fires at 15, but the manual entry opens at 10 so users who feel ready can
           start early. Computed here from the `ratings` prop so the gate updates live. */
        const REFINE_UNLOCK=10;
        const totalUnits=getRatedUnits(ratings).length;
        const unlocked=totalUnits>=REFINE_UNLOCK;
        const canStart=!done&&count>0&&unlocked;
        const remaining=Math.max(0,REFINE_UNLOCK-totalUnits);
        const sub=paused
          ?`Paused — resume at ${refineState.pausedIndex+1} of ${count}`
          :(done?"Complete — your early ratings are refined"
          :(!unlocked?`Unlocks after ${REFINE_UNLOCK} ratings · ${remaining} to go`
          :(count>0?`${count} ${count===1?"rating":"ratings"} to revisit`:"No early ratings to refine")));
        return(
        <div style={{marginTop:32}}>
          <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Rating System</div>
          <div style={{background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,overflow:"hidden"}}>
            <button type="button" disabled={!canStart} onClick={canStart?onStartRefine:undefined} className={canStart?"pressable":""} style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",background:"none",border:"none",cursor:canStart?"pointer":"default",fontFamily:"var(--font-body)",textAlign:"left",opacity:canStart?1:0.5}}>
              <div>
                <div style={{fontWeight:600,fontSize:14}}>{paused?"Resume refining":"Refine early ratings"}</div>
                <div style={{color:paused?"var(--c-green)":"var(--c-muted)",fontSize:11,marginTop:2,fontWeight:paused?600:400}}>{sub}</div>
              </div>
              {canStart&&<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={paused?"var(--c-green)":"var(--c-muted)"} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>}
              {done&&<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-green)" strokeWidth="2.75" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}
            </button>
          </div>
          <div style={{marginTop:18}}>
            <div style={{background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,overflow:"hidden"}}>
              {onQuickLog&&<button type="button" onClick={onQuickLog} className="pressable" style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderBottom:"1px solid var(--c-border)",background:"none",border:"none",cursor:"pointer",fontFamily:"var(--font-body)",textAlign:"left"}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:14}}>Log a round</div>
                  <div style={{color:"var(--c-muted)",fontSize:11,marginTop:2,lineHeight:1.45}}>{(profile?.ghinRounds||[]).length>0?`${(profile.ghinRounds||[]).length} round${(profile.ghinRounds||[]).length===1?"":"s"} logged · tap to add another`:"Add a score from any course — updates your handicap"}</div>
                </div>
                <span style={{background:"var(--c-green)",color:"#fff",borderRadius:8,padding:"6px 12px",fontSize:11,fontWeight:700,fontFamily:"var(--font-body)",letterSpacing:0.3}}>+ Round</span>
              </button>}
              {onOpenBatchEntry&&<button type="button" onClick={onOpenBatchEntry} className="pressable" style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderBottom:"1px solid var(--c-border)",background:"none",border:"none",cursor:"pointer",fontFamily:"var(--font-body)",textAlign:"left"}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:14}}>Batch add rounds</div>
                  <div style={{color:"var(--c-muted)",fontSize:11,marginTop:2,lineHeight:1.45}}>Same course, multiple scores — fastest for your home rounds</div>
                </div>
                <span style={{background:"var(--c-green-dim)",color:"var(--c-green)",border:"1px solid var(--c-green-border)",borderRadius:8,padding:"6px 12px",fontSize:11,fontWeight:700,fontFamily:"var(--font-body)",letterSpacing:0.3}}>Batch</span>
              </button>}
              {onOpenHandicapEntry&&(()=>{
                /* Build 3: show the LIVE blended handicap, not just the static
                   self-reported number. Lets the user see how their rounds are
                   actually shifting the value. Falls back to the original copy
                   when no self-report exists. */
                const self=profile?.selfReportedHandicap;
                const fmt=(v)=>v<0?"+"+Math.abs(v).toFixed(1):v.toFixed(1);
                let subtitle="Enter it directly — no rounds needed";
                if(self!=null){
                  const allRounds=getRoundsFromRatings(ratings||{},profile?.ghinRounds);
                  const info=resolveHandicap(allRounds,profile);
                  if(info.value!=null&&info.source!=="self"){
                    subtitle=`Now ${fmt(info.value)} · started at ${fmt(self)}`;
                  }else{
                    subtitle=`Set to ${fmt(self)} · updates as you log rounds`;
                  }
                }
                return(
                <button type="button" onClick={onOpenHandicapEntry} className="pressable" style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderBottom:"1px solid var(--c-border)",background:"none",border:"none",cursor:"pointer",fontFamily:"var(--font-body)",textAlign:"left"}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:14}}>Know your handicap?</div>
                    <div style={{color:"var(--c-muted)",fontSize:11,marginTop:2,lineHeight:1.45}}>{subtitle}</div>
                  </div>
                  <span style={{background:"var(--c-card)",color:"var(--c-sub)",border:"1px solid var(--c-border)",borderRadius:8,padding:"6px 12px",fontSize:11,fontWeight:700,fontFamily:"var(--font-body)",letterSpacing:0.3}}>Enter</span>

/* ═══════════════════════════════════════════════════════════
   PROFILE TAB
═══════════════════════════════════════════════════════════ */
function ProfileTab({statuses,ratings,profile,onOpenSettings,onGoToTab,onSelect,friends,followers:appFollowers,onViewFriend,onRequestCourse,pendingRequests,onQuickLog,onOpenBatchEntry,onOpenHandicapEntry,autoOpenList,onConsumeAutoOpenList}){
  const played=COURSES.filter(c=>statuses[c.id]?.play==="played");const want=COURSES.filter(c=>statuses[c.id]?.play==="want");
  /* Played stat counts each sub-course separately (Bethpage with 4 played subs = 4),
     so the number on Profile reflects what users feel they've actually played. */
  const playedExpandedCount=played.reduce((sum,c)=>{
    const r=ratings[c.id];
    if(c.subcourses&&r?.allSubs&&Object.keys(r.allSubs).length)return sum+Object.keys(r.allSubs).length;
    return sum+1;
  },0);
  const rounds=useMemo(()=>getRoundsFromRatings(ratings,profile?.ghinRounds),[ratings,profile?.ghinRounds]);
  const handicapInfo=useMemo(()=>resolveHandicap(rounds,profile),[rounds,profile?.selfReportedHandicap,profile?.selfReportedAt]);
  const handicap=handicapInfo.value;
  const shotScores=rounds.map(r=>r.score);
  const avgShot=shotScores.length?shotScores.reduce((a,b)=>a+b,0)/shotScores.length:null;
  const bestRound=Object.entries(ratings).filter(([,r])=>r.shotScore).sort((a,b)=>Number(a[1].shotScore)-Number(b[1].shotScore))[0];
  /* Enriched round list for the scores modal — each row knows whether the course is in Pure, whether rated, and what action to show */
  const roundsList=useMemo(()=>{
    const items=[];
    /* Pure-logged rounds (from ratings) — for multi-course properties, skip the top-level
       shotScore (it's a copy from the last save) and only list per-sub rounds. */
    Object.entries(ratings||{}).forEach(([cid,r])=>{
      const course=COURSES.find(c=>c.id===Number(cid));if(!course)return;
      /* Skip home course baseline — it's a self-reported personal best, not a logged round. */
      if(r.isHomeCourse)return;
      const hasSubs=r.allSubs&&Object.keys(r.allSubs).length;
      if(hasSubs){
        Object.entries(r.allSubs).forEach(([sn,sub])=>{if(sub.shotScore)items.push({score:Number(sub.shotScore),date:sub.date||null,course,courseId:course.id,subName:sn,courseName:`${course.name} — ${sn}`,source:"pure",rated:true,rating:sub,isEarly:sub.isEarly||false,scoreOnly:sub.tee?.source==="score-only"});});
      }else if(r.shotScore){
        items.push({score:Number(r.shotScore),date:r.date||null,course,courseId:course.id,courseName:course.name,source:"pure",rated:true,rating:r,isEarly:r.isEarly||false,scoreOnly:r.tee?.source==="score-only"});
      }
    });
    /* Imported / manually-entered rounds */
    (profile?.ghinRounds||[]).forEach(r=>{
      if(r.courseId){
        const course=COURSES.find(c=>c.id===r.courseId);
        const hasRating=!!ratings[r.courseId]?.overall;
        const displayName=r.subName?`${course?.name||r.courseName} — ${r.subName}`:(course?.name||r.courseName);
        items.push({score:Number(r.score),date:r.date||null,course,courseId:r.courseId,subName:r.subName||null,courseName:displayName,source:"ghin",rated:hasRating,rating:ratings[r.courseId]||null,isEarly:ratings[r.courseId]?.isEarly||false,scoreOnly:r.source==="score-only"});
      }else{
        items.push({score:Number(r.score),date:r.date||null,course:null,courseId:null,courseName:r.courseName||"Unknown course",source:"ghin",rated:false,rating:null,unmatched:true,scoreOnly:r.source==="score-only"});
      }
    });

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--c-muted)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

              const match=(friends||[]).find(f=>f.name===p.name);

            {fullList.length>0&&filtered.length===0&&<div style={{textAlign:"center",padding:"30px 0",color:"var(--c-muted)",fontSize:12}}>No matches for "{listSearch}"</div>}
          </div>);})()

    {(pgaCount>0||gdCount>0)&&<div className="fade-up" style={{display:"flex",gap:8,marginBottom:16}}>
      {pgaCount>0&&<button className="pressable" onClick={()=>setShowList("pga")} style={{display:"flex",alignItems:"center",gap:8,flex:1,background:"rgba(251,191,36,0.06)",border:"1px solid rgba(251,191,36,0.18)",borderRadius:10,padding:"10px 14px",cursor:"pointer",fontFamily:"var(--font-body)",textAlign:"left"}}>

        <svg style={{marginLeft:"auto",opacity:0.4}} width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#b45309" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>}
      {gdCount>0&&<button className="pressable" onClick={()=>setShowList("gd")} style={{display:"flex",alignItems:"center",gap:8,flex:1,background:"rgba(21,128,61,0.05)",border:"1px solid rgba(21,128,61,0.13)",borderRadius:10,padding:"10px 14px",cursor:"pointer",fontFamily:"var(--font-body)",textAlign:"left"}}>
        <div style={{fontSize:20,fontWeight:300,fontFamily:"var(--font-display)",color:"var(--c-green)",letterSpacing:-0.5,lineHeight:1}}>{gdCount}</div>
        <div style={{fontSize:9,color:"var(--c-green)",fontWeight:700,letterSpacing:0.3,textTransform:"uppercase",lineHeight:1.3}}>Top 100<br/>Courses</div>

    {homeCourse&&ratings[homeCourse.id]&&<div className="fade-up" style={{marginBottom:16}}>

      <div className="pressable" onClick={()=>onSelect&&onSelect(homeCourse)} style={{display:"flex",alignItems:"center",gap:12,background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,padding:"12px 14px",cursor:"pointer"}}>

          <div style={{color:"var(--c-muted)",fontSize:11,marginTop:1}}>{homeCourse.city}, {homeCourse.state}</div>
        </div>
        <ScorePill score={ratings[homeCourse.id].overall}/>

    </div>}

    {bestRound&&(()=>{const course=COURSES.find(c=>c.id===Number(bestRound[0]));return(
      <div className="fade-up" style={{marginBottom:16}}>
        <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Best Round</div>
        <div className="pressable" onClick={()=>course&&onSelect&&onSelect(course)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,padding:"14px 16px",cursor:"pointer"}}>
          <div><div style={{fontWeight:600,fontSize:14}}>{course?.name}</div><div style={{color:"var(--c-muted)",fontSize:11,marginTop:2}}>{course?.city}, {course?.state}</div></div>

            <div style={{fontSize:9,color:"var(--c-muted)",letterSpacing:0.5,textTransform:"uppercase",fontWeight:700,marginBottom:2}}>Personal Best</div>
            <div style={{fontSize:22,fontWeight:300,fontFamily:"var(--font-display)",color:"var(--c-green)",letterSpacing:-1}}>{bestRound[1].shotScore}</div>
          </div>
        </div>
      </div>);})()}
    {played.length>0?(()=>{
      /* Expand sub-courses into separate ranking entries so a multi-course
         property like Bethpage shows each sub (Black, Red, etc.) ranked on
         its own merit, not a rolled-up average. */
      const rankUnits=[];
      played.forEach(c=>{
        const r=ratings[c.id];
        if(c.subcourses&&r?.allSubs&&Object.keys(r.allSubs).length){
          Object.entries(r.allSubs).forEach(([subName,sub])=>{
            rankUnits.push({course:c,subName,score:sub.overall,key:c.id+":"+subName});
          });
        }else if(r?.overall!=null){
          rankUnits.push({course:c,subName:null,score:r.overall,key:String(c.id)});
        }
      });
      rankUnits.sort((a,b)=>(b.score??0)-(a.score??0));
      const top=rankUnits.slice(0,5);
      return(<div className="fade-up">
      <div style={{fontSize:10,fontWeight:700,color:"var(--c-muted)",letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Rankings</div>
      {top.map((u,i)=>(
        <div key={u.key} className="pressable" onClick={()=>onSelect&&onSelect(u.course)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:i<top.length-1?"1px solid var(--c-border)":"none",cursor:"pointer"}}>
          <span style={{fontSize:11,fontWeight:700,color:"var(--c-muted)",width:20,flexShrink:0,textAlign:"right"}}>#{i+1}</span>
          <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:13}}>{u.course.name}{u.subName?` — ${u.subName}`:""}</div><div style={{color:"var(--c-muted)",fontSize:11,marginTop:1}}>{u.course.city}, {u.course.state}</div></div>
          <ScorePill score={u.score}/>
        </div>))}
    </div>);})():<div className="fade-up" style={{textAlign:"center",padding:"36px 20px 10px",color:"var(--c-muted)"}}>
      <div style={{fontSize:36,marginBottom:10}}>⛳</div>
      <div style={{fontWeight:500,fontFamily:"var(--font-display)",color:"var(--c-text)",fontSize:20,marginBottom:6}}>Start your golf journal</div>
      <div style={{fontSize:12,lineHeight:1.5,marginBottom:18,maxWidth:260,marginLeft:"auto",marginRight:"auto"}}>Rate a course to begin ranking your rounds and track your personal bests over time.</div>
      <button type="button" className="pressable" onClick={()=>onGoToTab&&onGoToTab("discover")} style={{background:"var(--c-green)",color:"#fff",border:"none",borderRadius:12,padding:"11px 24px",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"var(--font-body)"}}>Rate a Course</button>
    </div>}
  </div>);
}

/* Standalone activity card for Clubhouse recent activity — handles reactions + comments cleanly */
function ClubhouseActivityCard({item,rxKey,reactions,toggleEmoji,addComment,onSelect,onViewFriend,isLast,onOpenLightbox,friends,myUid}){
  const REACTION_EMOJIS=["\u{1F525}","\u{1F44F}","\u{1F44D}","\u2764\uFE0F","\u26F3\uFE0F"];
  const rx=reactions[rxKey]||{emojis:[],comments:[]};
  const cmts=rx.comments||[];
  const[draft,setDraft]=useState("");
  const[showInput,setShowInput]=useState(false);
  const submitComment=()=>{if(!draft.trim())return;addComment(rxKey,draft);setDraft("");setShowInput(false);};
  /* Pressing a reaction emoji posts it as a comment */
  const sendReaction=(em)=>addComment(rxKey,em);
  return(
    <div style={{padding:"14px 0",borderBottom:isLast?"none":"1px solid var(--c-border)"}}>
      {/* Header row: avatar + text + score */}
      <div style={{display:"flex",gap:10,alignItems:"center"}}>
        <div className="pressable" onClick={e=>{e.stopPropagation();onViewFriend&&onViewFriend(item.friend);}} style={{cursor:"pointer"}}><Avatar name={item.friend.name} initials={item.friend.initials} color={item.friend.color} size={32}/></div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12,lineHeight:1.4}}>
            <span className="pressable" onClick={()=>onViewFriend&&onViewFriend(item.friend)} style={{fontWeight:600,cursor:"pointer"}}>{item.friend.name.split(" ")[0]}</span>
            <span style={{color:"var(--c-muted)"}}> rated </span>
            <span className="pressable" onClick={()=>onSelect(item.course)} style={{fontWeight:600,cursor:"pointer",color:"var(--c-green)"}}>{item.course.name}</span>
          </div>
        </div>
        <div className="pressable" onClick={()=>onSelect(item.course)} style={{cursor:"pointer"}}><ScorePill score={item.rating.overall}/></div>
      </div>
      {item.rating.photos?.length>0&&<div data-allow-horizontal style={{marginTop:10,paddingLeft:42,display:"flex",gap:6,overflowX:"auto"}}>
        {item.rating.photos.map((src,i)=>(
          <button key={`${i}-${src.slice(-24)}`} type="button" className="pressable" onClick={()=>onOpenLightbox&&onOpenLightbox(item.rating.photos,i)} style={{width:88,height:88,borderRadius:10,overflow:"hidden",flexShrink:0,border:"1px solid var(--c-border)",padding:0,background:"none",cursor:"pointer"}}>
            <img src={src} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
          </button>
        ))}
      </div>}
      {/* Friend's own review (and any sub-course reviews) */}
      {(()=>{
        const friendComments=[];
        if(item.rating.review)friendComments.push({text:item.rating.review,sub:null});
        if(item.rating.allSubs)Object.entries(item.rating.allSubs).forEach(([name,r])=>{if(r.review&&r.review!==item.rating.review)friendComments.push({text:r.review,sub:name});});
        if(!friendComments.length)return null;
        return(<div style={{marginTop:10,paddingLeft:42,display:"flex",flexDirection:"column",gap:6}}>
          {friendComments.map((co,i)=>(
            <div key={`rvw-${i}`}>
              {co.sub&&<div style={{fontSize:9,fontWeight:700,color:"var(--c-green)",letterSpacing:0.5,textTransform:"uppercase",marginBottom:3}}>{co.sub}</div>}
              <p style={{color:"var(--c-text)",fontSize:12,fontStyle:"italic",lineHeight:1.5,fontFamily:"var(--font-display)"}}>&ldquo;{co.text}&rdquo;</p>
            </div>
          ))}
        </div>);
      })()}
      {/* Reactions row — each press posts the emoji as a comment */}
      <div style={{display:"flex",gap:5,marginTop:10,flexWrap:"wrap",alignItems:"center",paddingLeft:42}}>
        {REACTION_EMOJIS.map(em=>(
          <button key={em} type="button" onClick={()=>sendReaction(em)} style={{
            background:"var(--c-surface)",
            border:"1px solid var(--c-border)",
            borderRadius:14,padding:"5px 11px",cursor:"pointer",fontSize:14,lineHeight:1,
            fontFamily:"var(--font-body)",
            transition:"background 160ms var(--ease-out),transform 120ms var(--ease-out)"}}>{em}</button>
        ))}
        <button type="button" onClick={()=>setShowInput(v=>!v)} style={{
          background:"var(--c-surface)",border:"1px solid var(--c-border)",borderRadius:14,
          padding:"5px 10px",cursor:"pointer",fontSize:11,lineHeight:1,color:"var(--c-sub)",
          fontFamily:"var(--font-body)",fontWeight:600,display:"flex",alignItems:"center",gap:4}}>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Comment
        </button>
      </div>
      {/* Existing comments (including emoji reactions) */}
      {cmts.length>0&&<div style={{marginTop:8,paddingLeft:42,display:"flex",flexDirection:"column",gap:5}}>
        {cmts.map((co,j)=>{
          const isEmojiOnly=/^\p{Emoji}+$/u.test(co.text.trim());
          let authorLabel="Someone";
          if(co.reactorId===myUid)authorLabel="You";
          else{
            const reactor=(friends||[]).find(f=>f.id===co.reactorId);
            if(reactor)authorLabel=reactor.name.split(" ")[0];
          }
          return(
          <div key={j} style={{background:"var(--c-surface)",borderRadius:10,padding:"7px 11px",fontSize:isEmojiOnly?16:12,color:"var(--c-text)",lineHeight:1.4}}>
            <span style={{fontWeight:700,marginRight:6,color:"var(--c-green)",fontSize:12}}>{authorLabel}</span>{co.text}
          </div>);
        })}
      </div>}
      {/* Comment input */}
      {showInput&&<div style={{marginTop:8,paddingLeft:42,display:"flex",gap:6}}>
        <input value={draft} onChange={e=>setDraft(e.target.value)} autoFocus
          onKeyDown={e=>{if(e.key==="Enter")submitComment();else if(e.key==="Escape"){setDraft("");setShowInput(false);}}}
          placeholder="Write a comment..."
          style={{flex:1,background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:14,padding:"7px 12px",fontSize:12,outline:"none",fontFamily:"var(--font-body)",
            transition:"border-color 160ms var(--ease-out)"}}
          onFocus={e=>e.target.style.borderColor="var(--c-green)"} onBlur={e=>e.target.style.borderColor=""}/>
        {draft.trim()&&<button type="button" onClick={submitComment} style={{background:"var(--c-green)",color:"#fff",border:"none",borderRadius:14,padding:"7px 12px",fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"var(--font-body)"}}>Post</button>}
      </div>}
    </div>
  );
}

function HomeTab({profile,statuses,ratings,friends,activity,onSelect,onGoToTab,reactions,toggleEmoji,addComment,baselineRemaining,baselineGoal,onViewFriend,sessionRandomFactId,coursePreviews}){
  const[lightbox,setLightbox]=useState(null);
  const openLightbox=(photos,startIndex)=>setLightbox({photos,startIndex});
  const ratedIds=new Set(Object.keys(ratings).map(Number));
  const played=COURSES.filter(c=>statuses[c.id]?.play==="played");
  /* Sub-aware played count: each rated sub-course counts separately
     (Bethpage with 4 played subs = 4, not 1). Matches Profile + MyCourses. */
  const playedExpandedCount=played.reduce((sum,c)=>{
    const r=ratings[c.id];
    if(c.subcourses&&r?.allSubs&&Object.keys(r.allSubs).length)return sum+Object.keys(r.allSubs).length;
    return sum+1;
  },0);
  const scores=Object.values(ratings).map(r=>r.overall);
  const showMap=ratedIds.size>1;
  const homeCourse=COURSES.find(c=>c.id===profile.homeCourseId);
  const homeRating=ratings[profile.homeCourseId];
  const REACTION_EMOJIS=["\u{1F525}","\u{1F44F}","\u{1F44D}","\u2764\uFE0F","\u26F3\uFE0F"];

  /* Random course fact — picked once per app mount (passed in from App) */
  const randomFact=(()=>{
    if(!sessionRandomFactId)return null;
    const c=COURSES.find(x=>x.id===sessionRandomFactId);
    if(!c)return null;
    return{course:c,fact:HOME_FACTS[sessionRandomFactId]};
  })();

  /* Played courses with coords for the map */
  const playedWithCoords=useMemo(()=>
    COURSES.filter(c=>ratedIds.has(c.id)&&c.lat&&c.lng)
  ,[ratedIds.size]);

  /* Smart suggestions: unrated courses sorted by proximity. Anchor preference:
     1. Home course (most accurate — actual course coords)
     2. Home area metro (user-picked when no home course — see HOME_AREAS)
     3. No anchor → first 4 unrated courses (graceful default for fresh accounts) */
  const suggestions=useMemo(()=>{
    const unrated=COURSES.filter(c=>!ratedIds.has(c.id));
    const home=COURSES.find(c=>c.id===profile.homeCourseId);
    const area=!home?HOME_AREA_BY_KEY[profile.homeArea]:null;
    const anchor=home||area;
    if(!anchor||anchor.lat==null)return unrated.slice(0,4);
    return unrated.map(c=>{
      if(!c.lat)return{course:c,dist:9999};
      const dlat=c.lat-anchor.lat,dlng=c.lng-anchor.lng;
      const dist=Math.sqrt(dlat*dlat+dlng*dlng);
      return{course:c,dist};
    }).sort((a,b)=>a.dist-b.dist).slice(0,4).map(x=>x.course);
  },[ratedIds.size,profile.homeCourseId,profile.homeArea]);

  /* Recent friend activity (last 3) — drawn from the App-level `activity` prop, which is
     hydrated from real Supabase ratings of people I follow + kept fresh by realtime. */
  const recentActivity=useMemo(()=>(activity||[]).slice(0,3),[activity]);

  const greeting=(()=>{const h=new Date().getHours();if(h<12)return"Good morning";if(h<17)return"Good afternoon";return"Good evening";})();

  return(<div style={{padding:"14px 16px 20px"}}>
    {lightbox&&<PhotoLightbox photos={lightbox.photos} startIndex={lightbox.startIndex} onClose={()=>setLightbox(null)}/>}
    {/* Greeting */}
    <div style={{marginBottom:16,display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:24,fontWeight:500,fontFamily:"var(--font-display)",lineHeight:1.2}}>{greeting}, {profile.name.split(" ")[0]}</div>
        {played.length<3&&<div style={{color:"var(--c-muted)",fontSize:12,marginTop:4}}>Rate a few courses to start building your rankings</div>}
      </div>
      <button className="pressable" onClick={()=>onGoToTab&&onGoToTab("discover",null,{focusSearch:true})} style={{
        flexShrink:0,display:"flex",alignItems:"center",gap:6,background:"var(--c-green)",color:"#fff",border:"none",borderRadius:10,
        padding:"9px 14px",fontWeight:700,fontSize:12,letterSpacing:0.3,cursor:"pointer",fontFamily:"var(--font-body)",
        boxShadow:"0 2px 8px rgba(21,128,61,0.25)"}}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Rate a Course
      </button>
    </div>

    {/* Baseline counter — subtle progress indicator until scale is anchored.
        Hide if EITHER the ratings count OR the played-status count has reached the goal.
        This double-source check protects against either count being briefly stale. */}
    {baselineRemaining>0&&ratedIds.size<baselineGoal&&played.length<baselineGoal&&(
      <div className="fade-up" style={{marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
          <div style={{fontSize:11,color:"var(--c-sub)",fontWeight:600,fontFamily:"var(--font-body)"}}>{baselineGoal-baselineRemaining} / {baselineGoal} courses rated</div>
          <div style={{fontSize:10,color:"var(--c-muted)",fontWeight:500}}>{baselineRemaining} more to calibrate</div>
        </div>
